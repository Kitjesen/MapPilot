gateway:
  base_url: "http://127.0.0.1:5050"
  api_key_env: "LINGTU_RMF_API_KEY"
  commands_enabled_env: "LINGTU_RMF_COMMANDS_ENABLED"
  allow_insecure_http: false
  lease_ttl_s: 30.0
  timeout_s: 3.0
  max_pose_age_s: 2.0
  max_native_status_age_s: 2.0

robot:
  fleet_name: "lingtu"
  robot_name: "thunder-01"
  battery_soc_default: 1.0

poll_period_s: 0.5
goal_tolerance_m: 0.10

levels:
  L1:
    building_id: "industrial-park-a"
    floor_id: "floor-1"
    map_id: "industrial-park-a-floor-1"
    frame_id: "map"

  # Cross-floor destinations remain fail-closed until LingTu provides a
  # BuildingMission transition executor for lift/map/relocalization steps.
  L2:
    building_id: "industrial-park-a"
    floor_id: "floor-2"
    map_id: "industrial-park-a-floor-2"
    frame_id: "map"
