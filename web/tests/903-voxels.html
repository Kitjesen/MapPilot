<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>903 清理后的 OctoMap</title>
<style>

</style></head><body><main><div id="view"><div class="badge"><strong>实际导航体素 · OctoMap · 5 cm</strong><br><span id="loaded">正在读取占据格…</span></div></div><aside>
<h1>清理后的规划地图</h1><label>地图版本<select id="source"><option value="clean">最新：DUFO + 孤立点过滤</option><option value="dufo">对照：仅 DUFO 清理</option></select></label>
<code id="map-name"></code><p class="hint">每个方块是 OctoMap 中的占据格。完整读取占据数据，按下面的高度范围显示，不用点云代替。</p>
<div class="actions"><button id="perspective">三维整图</button><button id="top">俯视整图</button><button id="detail">放大通道</button></div>
<h2>显示高度（地图坐标，米）</h2><label>最低 <input id="low" type="number" value="-0.8" step="0.1"> 最高 <input id="high" type="number" value="0.8" step="0.1"></label><div class="actions"><button id="floor">地面与机身附近</button><button id="full">全部高度</button></div>
<p class="hint">左键旋转 · 右键平移 · 滚轮缩放。高度裁切只影响显示，不改规划地图。</p>
<h2>实际规划结果</h2><div id="status">正在载入…</div><p class="warning">候选地图尚未通过导航替换验收，未部署到 Go2。</p>
<h2>来源</h2><code id="source-path"></code><p class="hint">直接读取完整概率 octomap.ot，保留占据叶的实际尺寸，地图最小分辨率为 5 cm。未删格、未按视角抽样。空白可能是自由或未知空间，不能仅凭空白认定可走。</p>
