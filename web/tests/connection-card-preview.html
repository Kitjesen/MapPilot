<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置卡片预览</title><style>body{margin:0;background:#f7f9fc;color:#202b38;font:14px system-ui,-apple-system,sans-serif}.wrap{width:min(640px,calc(100vw - 32px));margin:48px auto}.chat{background:#fff;border:1px solid #e5eaf2;border-radius:22px;padding:20px;box-shadow:0 14px 35px #1e375c12}.bubble{width:fit-content;max-width:85%;padding:9px 12px;margin:7px 0;border-radius:14px;background:#f1f4f8;color:#334155}.bubble.user{margin-left:auto;background:#2774e6;color:#fff}.card{display:flex;align-items:center;gap:12px;margin:14px 0 7px;padding:13px;border:1px solid #e5eaf2;border-radius:14px;background:linear-gradient(180deg,#fff,#f8fafc);box-shadow:0 7px 18px #1e375c0f}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #e1e7ef;background:#fff;color:#216fe3;font-weight:700;font-size:18px}.copy{flex:1}.copy strong{display:flex;gap:5px;align-items:center;font-size:13px}.copy strong i{font-style:normal;color:#2b79e8;font-size:9px}.copy small{display:block;margin-top:4px;color:#738095;font-size:12px}.action{border:1px solid #dbe6f6;border-radius:9px;padding:7px 11px;background:#f3f7ff;color:#2168ce;font:inherit;cursor:pointer}.hint{margin:8px 2px;color:#8792a2;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#f0ad36;box-shadow:0 0 0 4px #f0ad3620}</style><main class="wrap"><div class="chat"><div class="bubble user">可以链接 Notion 吗？</div><div class="bubble">我先检查一下连接状态。</div><section class="card"><div class="logo">N</div><div class="copy"><strong>Notion <i>●</i></strong><small><span class="dot" style="display:inline-block;vertical-align:middle;margin-right:5px"></span>等待授权 · 连接后可在对话中使用</small></div><button class="action">重新打开</button></section><div class="hint">授权只影响 Notion 工具，不会改变机器狗的运动权限。</div><div class="bubble">授权完成后，我会继续使用你的 Notion。</div></div></main></html>
