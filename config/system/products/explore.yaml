schema_version: lingtu.runtime_graph.product.v3
name: explore
summary: Grow a map and navigate to exploration goals through the native runtime contract.
operator_switchable: true
session_mode: exploring
default_for_session_mode: true
native_control_mode: autonomy
default_variant: live
variants:
  live:
    topics:
      - /lidar/raw_frame
      - /imu/raw
      - /maps/state
      - /maps/scene
      - /tf
      - /slam/map_cloud
      - /nav/goal/status
      - /nav/traversability
    capabilities:
      - native_slam_mapping
      - frontier_or_tare_goal_source
      - rolling_map_segment_execution
      - local_planner_collision_and_traversability_scoring
      - final_cmd_vel_single_writer
    slam_mode: mapping
    requires_map: false
    switch_policy: cold_restart
    online_hot_switch_supported: false
    host:
      capabilities: [gateway, operator_motion, navigation_skills, goal_commands]
      run_startup_checks: true
    includes: [control, lidar, slam, maps, limits, follower, global, local, explore]
    native_nav:
      local_planner: cmu
      local_planners: [cmu, scan]
      follower:
        max_yaw_rate_rad_s: 1.0
  map:
    topics:
      - /lidar/raw_frame
      - /imu/raw
      - /maps/state
      - /maps/scene
      - /tf
      - /slam/map_cloud
      - /maps/activation/request
      - /maps/activation/ack
      - /nav/goal/status
      - /nav/traversability
      - /nav/way_point
    capabilities:
      - saved_map_relocalization
      - tare_frontier_or_viewpoint_goal_source
      - octoplanner3d_global_planning
      - rolling_map_segment_execution
      - local_planner_collision_and_traversability_scoring
      - final_cmd_vel_single_writer
      - operator_motion_typed_dds_interface
      - native_operator_motion_authority
      - operator_teleop_takeover_with_safety_veto
      - operator_assisted_local_planner_takeover
    slam_mode: localization
    requires_map: true
    switch_policy: cold_restart
    online_hot_switch_supported: false
    host:
      capabilities:
        - gateway
        - operator_motion
        - navigation_skills
        - goal_commands
        - exploration_adapter
      map_artifact_gate_required: true
      run_startup_checks: true
    includes: [control, lidar, slam, maps, limits, follower, global, local, explore, teleop]
    native_nav:
      local_planner: cmu
      local_planners: [cmu, scan]
      follower:
        max_yaw_rate_rad_s: 1.0
      teleop:
        takeover: true
        planner: true
processes:
  - lidar
  - imu
  - slam
  - maps
  - traversability
  - nav
  - driver
  - explore
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
