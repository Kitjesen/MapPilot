schema_version: lingtu.runtime_graph.product.v3
name: nav
default_variant: standard
variants:
  standard: {}
  camera:
    includes: [camera]
    processes_add: [camera, video]
    optional_processes_add: [video]
    topics_add: [/camera/color/image_raw, /camera/depth/image_raw, /camera/color/camera_info]
    capabilities_add: [camera_preview]
    # Operator video preview only. Navigation still consumes LiDAR geometry.
    require_map_scene: false
  semantic:
    includes: [camera]
    processes_add: [camera, video]
    optional_processes_add: [video]
    capabilities_add: [camera_preview]
    # RGB-D semantic perception and language planning over native navigation.
    topics_add:
      - /camera/color/image_raw
      - /camera/depth/image_raw
      - /camera/color/camera_info
      - /nav/semantic/views/request
      - /nav/semantic/views/result
    host:
      capabilities:
        - gateway
        - operator_motion
        - navigation_skills
        - goal_commands
        - semantic
        - semantic_planning
      detector: yolo_world
      llm: kimi
      default_classes: person . bottle . cup
      run_startup_checks: true
    critical_modules:
      - host.bus
      - SlamAdapterModule
      - nav.commands
      - nav.goals
      - PerceptionModule
      - LLMModule
      - SemanticPlannerModule
      - AgentPlannerModule
      - VisualServoModule
      - GatewayModule
topics:
  - /maps/state
  - /maps/scene
  - /tf
  - /slam/map_cloud
  - /maps/activation/request
  - /maps/activation/ack
  - /nav/goal/status
  - /nav/way_point
capabilities:
  - saved_map_relocalization
  - octoplanner3d_global_planning
  - local_planner_collision_scoring
  - path_follower_pre_command_output
  - final_cmd_vel_single_writer
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - operator_teleop_takeover_with_safety_veto
  - operator_assisted_local_planner_takeover
summary: Saved-map autonomous navigation through native localization, native DDS SLAM, OctoPlanner3D, C++ LocalPlanner, and gated command output.
operator_switchable: true
session_mode: navigating
default_for_session_mode: true
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities: [gateway, operator_motion, navigation_skills, goal_commands, conversation]
  llm: kimi
  run_startup_checks: true
includes: [control, lidar, slam, maps, limits, global, local, follower, teleop, recovery]
native_nav:
  corridor_lookahead_m: 3.5
  goal_reached_m: 0.15
  waypoint_reached_m: 0.2
  # Match SCAN's upstream 100 Hz FSM and closed-loop controller cadence.
  tick_hz: 100.0
  global:
    # This Product's clicked-goal tolerance is stricter than other global users.
    terminal_tolerance_m: 0.15
    terminal_xy_tolerance_m: 0.15
    terminal_z_tolerance_m: 0.15
  local_planner: scan
  local_planners: [cmu, scan]
  use_traversability_cost: false
  follower:
    max_accel_mps2: 0.75
    max_yaw_rate_rad_s: 1.0
    goal_tolerance_m: 0.15
    lookahead_m: 0.35
    min_speed_mps: 0.08
  teleop:
    takeover: true
    planner: true
parameters:
  scan_planner.acceleration_tolerance: 1.2
  scan_follower.max_vx_mps: 1.2
  scan_follower.position_gain: 1.5
  scan_follower.min_vy_mps: 0.35  # Thunder CTS39 response trials; zero and safety-limited commands stay exempt.
processes:
  - lidar
  - imu
  - slam
  - maps
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - SlamAdapterModule
  - nav.commands
  - nav.goals
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
