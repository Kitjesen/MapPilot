schema_version: lingtu.runtime_graph.product.v3
name: tracking
default_variant: standard
variants:
  standard: {}
  camera:
    includes: [camera]
    processes_add: [camera, video]
    optional_processes_add: [video]
    topics_add: [/camera/color/image_raw, /camera/depth/image_raw, /camera/color/camera_info]
    capabilities_add: [camera_preview]
    # Operator video preview shares the RGB source used by person perception.
topics:
  - /maps/state
  - /maps/scene
  - /tf
  - /maps/activation/request
  - /maps/activation/ack
  - /nav/goal/status
  - /nav/traversability
  - /nav/way_point
capabilities:
  - saved_map_relocalization
  - explicit_goal_tracking
  - local_planner_collision_and_traversability_scoring
  - path_follower_pre_command_output
  - final_cmd_vel_single_writer
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - operator_teleop_takeover_with_safety_veto
  - operator_assisted_local_planner_takeover
summary: Follow a selected person from RGB-D perception through native planning and safety.
operator_switchable: true
session_mode: navigating
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities: [gateway, navigation_skills, goal_commands, semantic]
  llm: kimi
  default_classes: person
  run_startup_checks: true
includes: [control, lidar, slam, maps, limits, follower, global, local, teleop, camera]
native_nav:
  local_planner: cmu
  local_planners: [cmu, scan]
  # SCAN requires the native control loop to run at its supported cadence.
  tick_hz: 100.0
  follower:
    max_yaw_rate_rad_s: 1.0
  use_traversability_cost: true
  teleop:
    takeover: true
    planner: true
processes:
  - lidar
  - imu
  - slam
  - maps
  - traversability
  - nav
  - driver
  - camera
  - host
critical_modules:
  - host.bus
  - nav.commands
  - nav.goals
  - PerceptionModule
  - VisualServoModule
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
  - SemanticPlannerModule
