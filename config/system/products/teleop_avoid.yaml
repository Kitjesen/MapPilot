schema_version: lingtu.runtime_graph.product.v3
name: teleop_avoid
topics:
  - /nav/way_point
capabilities:
  - teleop
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - localization_health_gate
  - registered_cloud_collision_check
  - path_follower_pre_command_output
  - operator_assisted_local_planner_control
  - final_cmd_vel_single_writer
  - cmd_vel_arbitration
summary: Operator-assisted teleoperation with selectable native local planning and live LiDAR obstacle checks.
operator_switchable: true
session_mode: navigating
native_control_mode: teleop_avoid
slam_mode: mapping
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities: [gateway, operator_motion]
  run_startup_checks: true
includes: [control, lidar, slam, maps, limits, follower, local, teleop]
native_nav:
  # Match SCAN's upstream 100 Hz FSM and closed-loop controller cadence.
  tick_hz: 100.0
  local_planner: scan
  local_planners: [cmu, scan]
  check_obstacle: true
  use_traversability_cost: false
  teleop:
    planner: true
    max_deviation_deg: 90.0
  # Local Planner followers own acceleration and curvature. A second generic
  # per-axis smoother would distort the path command after planning.
  smoothing: false
  follower:
    max_yaw_rate_rad_s: 1.0
  recovery:
    max_attempts: 0
processes:
  - lidar
  - imu
  - slam
  - maps
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - SlamAdapterModule
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
  - SemanticPlannerModule
