schema_version: lingtu.runtime_graph.product.v3
name: teleop
topics:
  - /nav/command/request
  - /nav/command/ack
  - /nav/state
  - /nav/operator_motion/control
  - /nav/operator_motion/sample
  - /nav/operator_motion/ack
  - /nav/operator_motion/status
  - /nav/cmd_vel
capabilities:
  - teleop
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - command_staleness_gate
  - velocity_limit
  - final_cmd_vel_single_writer
summary: Operator teleoperation without autonomous navigation decisions.
operator_switchable: true
session_mode: none
native_control_mode: teleop
slam_mode: none
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities: [gateway, operator_motion]
  run_startup_checks: false
native_nav:
  smoothing: true
  # x/y are independently limited to 1 m/s by the operator-motion contract.
  # The norm is sqrt(2) so diagonal commands are not clipped to 1 m/s.
  path_follower_max_speed_mps: 1.4142135623730951
  path_follower_max_accel_mps2: 4.0
  path_follower_max_yaw_accel_rad_s2: 4.0
  braking_deceleration_mps2: 4.0
  teleop_max_speed_mps: 1.0
  teleop_max_yaw_rate_rad_s: 1.0
parameters:
  scan_follower.max_vx_mps: 1.0
  scan_follower.max_vy_mps: 1.0
processes:
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
  - SemanticPlannerModule
