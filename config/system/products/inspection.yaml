schema_version: lingtu.runtime_graph.product.v3
name: inspection
topics:
  - /maps/state
  - /maps/scene
  - /tf
  - /slam/map_cloud
  - /maps/activation/request
  - /maps/activation/ack
  - /nav/goal/status
  - /nav/inspection/task/request
  - /nav/inspection/task/ack
  - /nav/inspection/status
  - /nav/inspection/task/event
  - /nav/inspection/evidence/request
  - /nav/inspection/evidence/result
  - /nav/way_point
capabilities:
  - saved_map_relocalization
  - operator_or_semantic_goal_source
  - bounded_multi_turn_semantic_tasks
  - octoplanner3d_global_planning
  - local_planner_collision_scoring
  - final_cmd_vel_single_writer
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - operator_teleop_takeover_with_safety_veto
  - operator_assisted_local_planner_takeover
  - inspection_evidence_capture_and_result_ack
summary: Operator or semantic inspection tasks over saved-map native navigation.
operator_switchable: true
session_mode: navigating
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities:
    - gateway
    - navigation_skills
    - goal_commands
    - semantic
    - semantic_planning
    - inspection_evidence
  llm: qwen
  inspection_evidence_max_rgb_odom_skew_s: 0.2
  run_startup_checks: true
includes: [control, lidar, slam, maps, limits, follower, global, local, teleop, camera]
native_nav:
  # Inspection follows the same saved-map navigation chain as nav:
  # OctoPlanner3D plans the route and SCAN owns local execution.
  tick_hz: 100.0
  local_planner: scan
  follower:
    max_yaw_rate_rad_s: 1.0
  use_traversability_cost: false
  teleop:
    takeover: true
    planner: true
processes:
  - lidar
  - imu
  - slam
  - maps
  - nav
  - driver
  - camera
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
