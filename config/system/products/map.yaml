schema_version: lingtu.runtime_graph.product.v3
name: map
default_variant: standard
variants:
  standard: {}
  camera:
    # Operator video preview does not change mapping or motion ownership.
    processes: [lidar, imu, slam, maps, nav, driver, camera, video, host]
    optional_processes: [video]
    topics:
      - /lidar/raw_frame
      - /imu/raw
      - /slam/odometry
      - /slam/registered_cloud
      - /slam/map_observation
      - /slam/map_geometry_snapshot
      - /slam/map_geometry_applied
      - /slam/map_cloud
      - /slam/cumulative_map_cloud
      - /slam/saved_map_cloud
      - /slam/localization_health
      - /maps/state
      - /maps/scene
      - /nav/command/request
      - /nav/command/ack
      - /nav/state
      - /nav/operator_motion/control
      - /nav/operator_motion/sample
      - /nav/operator_motion/ack
      - /nav/operator_motion/status
      - /nav/cmd_vel
      - /camera/color/image_raw
      - /camera/depth/image_raw
      - /camera/color/camera_info
    capabilities:
      - native_slam_mapping
      - map_artifact_save
      - map_pcd_to_octomap_artifact
      - teleop
      - operator_motion_typed_dds_interface
      - native_operator_motion_authority
      - command_staleness_gate
      - velocity_limit
      - final_cmd_vel_single_writer
      - camera_preview
topics:
  - /lidar/raw_frame
  - /imu/raw
  - /slam/odometry
  - /slam/registered_cloud
  - /slam/map_observation
  - /slam/map_geometry_snapshot
  - /slam/map_geometry_applied
  - /slam/map_cloud
  - /slam/cumulative_map_cloud
  - /slam/saved_map_cloud
  - /slam/localization_health
  - /maps/state
  - /maps/scene
  - /nav/command/request
  - /nav/command/ack
  - /nav/state
  - /nav/operator_motion/control
  - /nav/operator_motion/sample
  - /nav/operator_motion/ack
  - /nav/operator_motion/status
  - /nav/cmd_vel
capabilities:
  - native_slam_mapping
  - map_artifact_save
  - map_pcd_to_octomap_artifact
  - teleop
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - command_staleness_gate
  - velocity_limit
  - final_cmd_vel_single_writer
summary: Build live map artifacts from native LiDAR-inertial SLAM output.
operator_switchable: true
session_mode: mapping
default_for_session_mode: true
native_control_mode: teleop
native_nav:
  smoothing: true
  # Mapping uses the same operator motion contract as teleop: 1 m/s per body
  # axis, sqrt(2) norm allowance, and the shared responsive acceleration.
  path_follower_max_speed_mps: 1.4142135623730951
  path_follower_max_accel_mps2: 4.0
  path_follower_max_yaw_accel_rad_s2: 4.0
  braking_deceleration_mps2: 4.0
  teleop_max_speed_mps: 1.0
  teleop_max_yaw_rate_rad_s: 1.0
parameters:
  scan_follower.max_vx_mps: 1.0
  scan_follower.max_vy_mps: 1.0
slam_mode: mapping
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities: [gateway, operator_motion]
  run_startup_checks: true
processes:
  - lidar
  - imu
  - slam
  - maps
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
