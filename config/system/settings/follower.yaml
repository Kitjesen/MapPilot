# Shared tracking defaults. The nav Product retains its tighter clicked-goal settings.
native_nav:
  corridor_lookahead_m: 3.0
  goal_reached_m: 0.35
  goal_height_tolerance_m: 0.35
  waypoint_reached_m: 0.6
  follower:
    goal_tolerance_m: 0.2
    lookahead_m: 0.3
    min_speed_mps: 0.0
    align_enter_rad: 0.7853981633974483
    align_exit_rad: 0.35
  cmu:
    follower_lookahead_m: 0.5
    follower_yaw_gain: 1.5
    follower_nominal_dt_s: 0.01
    follower_switch_time_s: 1
    follower_heading_align_rad: 0.4
    follower_omni_goal_m: 0.4
    follower_omni_heading_rad: 1.5
    follower_stop_distance_m: 0.3
    follower_slowdown_distance_m: 0.75
parameters:
  scan_follower:
    time_forward_s: 0.8  # Heading lookahead; position tracks the current spline time.
    heading_error_rad: 0.8  # Above this error, rotate before translating.
    position_gain: 0.8  # Position error to velocity gain, 1/s.
    yaw_gain: 1.5  # Heading error to yaw-rate gain, 1/s.
    finish_distance_m: 0.15  # Horizontal tolerance after the spline duration ends.
