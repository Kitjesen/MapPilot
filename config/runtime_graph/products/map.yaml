schema_version: lingtu.runtime_graph.product.v1
name: map
contracts:
  - lingtu.product.map.v1
summary: Build live map artifacts from native LiDAR-inertial SLAM output.
operator_switchable: true
session_mode: mapping
default_for_session_mode: true
native_control_mode: teleop
slam_mode: mapping
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
processes:
  - lidar
  - imu
  - slam
  - maps
  - nav
  - driver
  - camera
  - host
critical_modules:
  - host.bus
  - camera
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
