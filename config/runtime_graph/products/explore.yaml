schema_version: lingtu.runtime_graph.product.v3
name: explore
summary: Grow a map and navigate to exploration goals through the native runtime contract.
operator_switchable: true
session_mode: exploring
default_for_session_mode: true
native_control_mode: autonomy
default_variant: live
variants:
  live:
    topics:
      - /tf
      - /lidar/raw_frame
      - /imu/raw
      - /slam/odometry
      - /slam/registered_cloud
      - /slam/map_observation
      - /slam/map_cloud
      - /slam/localization_health
      - /maps/state
      - /maps/scene
      - /nav/exploration/command
      - /nav/exploration/ack
      - /nav/exploration/run/event
      - /nav/command/request
      - /nav/command/ack
      - /nav/goal/status
      - /nav/state
      - /nav/traversability
      - /nav/exploration_snapshot
      - /nav/exploration_execution_snapshot
      - /nav/exploration_segment/request
      - /nav/exploration_segment/ack
      - /nav/exploration_segment/status
      - /nav/global_path
      - /nav/local_path
      - /nav/cmd_vel
    capabilities:
      - native_slam_mapping
      - frontier_or_tare_goal_source
      - rolling_map_segment_execution
      - local_planner_collision_and_traversability_scoring
      - final_cmd_vel_single_writer
    slam_mode: mapping
    requires_map: false
    switch_policy: cold_restart
    online_hot_switch_supported: false
    host:
      capabilities: [gateway, operator_motion, navigation_skills, goal_commands]
      run_startup_checks: true
    native_nav:
      global_planner: octoplanner3d
      local_planner: cmu
      local_planners: [cmu, scan]
  map:
    topics:
      - /tf
      - /lidar/raw_frame
      - /imu/raw
      - /slam/odometry
      - /slam/registered_cloud
      - /slam/map_observation
      - /slam/map_cloud
      - /slam/localization_health
      - /maps/state
      - /maps/scene
      - /maps/activation/request
      - /maps/activation/ack
      - /nav/exploration/command
      - /nav/exploration/ack
      - /nav/exploration/run/event
      - /nav/command/request
      - /nav/command/ack
      - /nav/state
      - /nav/operator_motion/control
      - /nav/operator_motion/sample
      - /nav/operator_motion/ack
      - /nav/operator_motion/status
      - /nav/goal/status
      - /nav/traversability
      - /nav/exploration_snapshot
      - /nav/exploration_execution_snapshot
      - /nav/exploration_segment/request
      - /nav/exploration_segment/ack
      - /nav/exploration_segment/status
      - /nav/global_path
      - /nav/local_path
      - /nav/way_point
      - /nav/cmd_vel
    capabilities:
      - saved_map_relocalization
      - tare_frontier_or_viewpoint_goal_source
      - octoplanner3d_global_planning
      - rolling_map_segment_execution
      - local_planner_collision_and_traversability_scoring
      - final_cmd_vel_single_writer
      - operator_motion_typed_dds_interface
      - native_operator_motion_authority
      - operator_teleop_takeover_with_safety_veto
      - operator_assisted_local_planner_takeover
    slam_mode: localization
    requires_map: true
    switch_policy: cold_restart
    online_hot_switch_supported: false
    host:
      capabilities:
        - gateway
        - operator_motion
        - navigation_skills
        - goal_commands
        - exploration_adapter
      map_artifact_gate_required: true
      run_startup_checks: true
    native_nav:
      global_planner: octoplanner3d
      local_planner: cmu
      local_planners: [cmu, scan]
      allow_teleop_takeover: true
      teleop_local_planner: true
parameters:
  segment.max_distance_m: 5.0
  segment.max_waypoints: 32
  risk.stop_threshold: 50.0
  risk.resume_threshold: 40.0
processes:
  - lidar
  - imu
  - slam
  - maps
  - traversability
  - nav
  - driver
  - explore
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
