schema_version: lingtu.runtime_graph.product.v2
name: explore
summary: Grow a map and navigate to exploration goals through the native runtime contract.
operator_switchable: true
session_mode: exploring
default_for_session_mode: true
native_control_mode: autonomy
default_variant: live
variants:
  live:
    contracts:
      - lingtu.product.explore.v1
    slam_mode: mapping
    requires_map: false
    switch_policy: cold_restart
    online_hot_switch_supported: false
    host:
      capabilities: [gateway, operator_motion, navigation_skills, goal_commands]
      run_startup_checks: true
    native_nav:
      global_planner: octoplanner3d
      local_planner: cmu
  map:
    contracts:
      - lingtu.product.explore.map.v1
    slam_mode: localization
    requires_map: true
    switch_policy: cold_restart
    online_hot_switch_supported: false
    host:
      capabilities:
        - gateway
        - operator_motion
        - navigation_skills
        - goal_commands
        - exploration_adapter
      map_artifact_gate_required: true
      run_startup_checks: true
    native_nav:
      global_planner: octoplanner3d
      local_planner: cmu
      allow_teleop_takeover: true
      teleop_local_planner: true
parameters:
  segment.max_distance_m: 5.0
  segment.max_waypoints: 32
  risk.stop_threshold: 50.0
  risk.resume_threshold: 40.0
processes:
  - lidar
  - imu
  - slam
  - maps
  - traversability
  - nav
  - driver
  - explore
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
