schema_version: lingtu.runtime_graph.product.v1
name: explore
summary: Grow a map and navigate to exploration goals through the native runtime contract.
operator_switchable: false
product_mode: exploration
product_session: exploration
session_mode: exploring
native_control_mode: autonomy
slam_mode: mapping
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
data_plane: typed_dds
control_owner: autonomy
autonomy_owner: exploration_policy
processes:
  - lidar
  - slam
  - maps
  - traversability
  - nav
  - driver
  - host
critical_modules:
  - host.bus
required_topics:
  - /lidar/raw_frame
  - /imu/raw
  - /slam/odometry
  - /slam/registered_cloud
  - /slam/map_observation
  - /slam/map_cloud
  - /slam/localization_health
  - /maps/state
  - /maps/scene
  - /nav/command/request
  - /nav/command/ack
  - /nav/goal/status
  - /nav/state
  - /nav/traversability
  - /nav/global_path
  - /nav/local_path
  - /nav/cmd_vel
required_capabilities:
  - native_slam_mapping
  - frontier_or_tare_goal_source
  - octoplanner3d_global_planning
  - local_planner_collision_and_traversability_scoring
  - final_cmd_vel_single_writer
forbidden_modules:
  - TeleopModule
  - nav.mission
  - nav.velocity_mux
  - SimEndpointDriverModule
  - nav.local_planner
  - nav.path_follower
forbidden_claims:
  - module_sim_real_equivalence
  - ros2_bridge_required
transport_rules:
  product_bus: typed_dds
  same_process_algorithms: direct_function_calls
  lcm_allowed: false
