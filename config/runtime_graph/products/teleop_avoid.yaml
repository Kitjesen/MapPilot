schema_version: lingtu.runtime_graph.product.v2
name: teleop_avoid
contracts:
  - lingtu.product.teleop_avoid.v1
summary: Operator-assisted teleoperation with native CMU local planning and live LiDAR obstacle checks.
operator_switchable: true
session_mode: navigating
native_control_mode: teleop_avoid
slam_mode: mapping
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities: [gateway, operator_motion]
  run_startup_checks: true
native_nav:
  local_planner: cmu
  local_planners:
    - cmu
  check_obstacle: true
  use_traversability_cost: false
  teleop_local_planner: true
  # Local Planner followers own acceleration and curvature. A second generic
  # per-axis smoother would distort the path command after planning.
  smoothing: false
  path_follower_max_yaw_rate_rad_s: 1.0
  path_follower_max_speed_mps: 0.5
  teleop_max_speed_mps: 0.5
  teleop_max_yaw_rate_rad_s: 1.0
  teleop_planner_horizon_m: 3.5
  teleop_planner_max_deviation_deg: 90.0
  recovery:
    max_attempts: 0
processes:
  - lidar
  - imu
  - slam
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - SlamAdapterModule
  - nav.commands
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
  - SemanticPlannerModule
