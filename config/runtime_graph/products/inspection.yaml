schema_version: lingtu.runtime_graph.product.v1
name: inspection
contracts:
  - lingtu.product.inspection.v1
summary: Operator or semantic inspection tasks over saved-map native navigation.
operator_switchable: true
product_mode: inspection
product_session: inspection
session_mode: navigating
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
data_plane: typed_dds
control_owner: autonomy
autonomy_owner: native_nav_endpoint
goal_owner: operator_or_semantic_planner
native_nav:
  control_mode: autonomy
  publish_cmd_vel: true
  check_obstacle: true
  use_traversability_cost: true
  allow_teleop_takeover: true
  teleop_local_planner: true
processes:
  - lidar
  - slam
  - maps
  - traversability
  - nav
  - driver
  - camera
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
forbidden_modules:
  - TeleopModule
  - nav.mission
  - nav.velocity_mux
  - SimEndpointDriverModule
  - nav.local_planner
  - nav.path_follower
  - OccupancyGridModule
  - VoxelGridModule
  - ElevationMapModule
  - ESDFModule
  - TraversabilityCostModule
  - SemanticMapModule
forbidden_claims:
  - module_sim_real_equivalence
  - ros2_bridge_required
transport_rules:
  product_bus: typed_dds
  same_process_algorithms: direct_function_calls
  lcm_allowed: false
inspection_task_boundary:
  request: /nav/inspection/task/request
  ack: /nav/inspection/task/ack
  status: /nav/inspection/status
  client_completion: business_ack_required
  request_identity_fields: [task_id, request_id]
  response_identity_fields: [task_id, request_id]
inspection_task_event_stream:
  topic: /nav/inspection/task/event
  ordering_cursor: [boot_id, event_sequence]
  consumer_status: host_bus_gateway_projection_enabled
  retention: durable_gateway_projection
  task_journal_status: gateway_atomic_projection_enabled_native_restart_reconciliation_pending
  recording_status: native_mcap_task_verification_enabled_native_task_journal_pending
inspection_report_contract:
  path: /api/v1/inspection/tasks/{task_id}/report
  source: native_task_events_plus_task_route_snapshot_plus_verified_evidence
  route_requirements: minimal_snapshot_persisted_with_task_journal
  route_snapshot_required: true
  request_id_binding: durable_before_native_command
  native_identity_conflict: reject_event_and_require_review
  execution_truth: native_task_event_only
  acceptance: separate_from_execution_terminal
  incomplete_history: unknown_review_required
  diagnostic_recording: optional_not_an_acceptance_source
recording_contract:
  activation: explicit_product_operation
  native_preset: inspection-evidence-v1
  identity: task_id
  completion: unique_native_terminal_after_boot_matched_zero_output_and_driver_confirmation
  output: atomic_mcap_plus_session_manifest
  replay_policy: sensors_only_recorded_control_and_task_facts_are_never_republished
  offline_verification: player_dry_run_same_task_timeline_and_stop_evidence
  lifecycle_binding: pending
inspection_evidence_boundary:
  request: /nav/inspection/evidence/request
  result: /nav/inspection/evidence/result
  client_completion: matching_persisted_result_required
