schema_version: lingtu.runtime_graph.product.v1
name: teleop
summary: Operator teleoperation without autonomous navigation decisions.
operator_switchable: true
product_mode: teleop
product_session: teleop
session_mode: none
native_control_mode: teleop
slam_mode: none
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
data_plane: typed_dds
control_owner: operator
autonomy_owner: none
native_nav:
  control_mode: teleop
  publish_cmd_vel: true
  check_obstacle: false
  use_traversability_cost: false
  allow_teleop_takeover: false
  teleop_local_planner: false
processes:
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
required_topics:
  - /nav/command/request
  - /nav/command/ack
  - /nav/state
  - /nav/operator_motion/control
  - /nav/operator_motion/sample
  - /nav/operator_motion/ack
  - /nav/operator_motion/status
  - /nav/cmd_vel
required_capabilities:
  - teleop
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - command_staleness_gate
  - velocity_limit
  - final_cmd_vel_single_writer
forbidden_modules:
  - TeleopModule
  - nav.velocity_mux
  - SimEndpointDriverModule
  - nav.mission
  - nav.local_planner
  - nav.path_follower
  - SemanticPlannerModule
forbidden_claims:
  - autonomous_navigation
  - global_planning
  - local_path_tracking
  - module_sim_real_equivalence
  - ros2_bridge_required
transport_rules:
  product_bus: typed_dds
  same_process_algorithms: direct_function_calls
  lcm_allowed: false
target_chain:
  - Operator clients claim, hold, or release authority through /nav/operator_motion/control; a matching /nav/operator_motion/ack confirms only that native control action, not final velocity or motor execution.
  - Fresh body-frame velocity intent uses /nav/operator_motion/sample; adapter success is submitted-only and there is no per-sample output or motor confirmation.
  - Native command endpoint runs in control_mode=teleop and rejects autonomous goals/paths.
  - Command age, linear speed, and yaw rate are checked without requiring SLAM or a map.
  - /nav/operator_motion/status exposes native authority, input-gate, teleop-output, and final logical-command evidence; /nav/cmd_vel is the final body-frame command after native gates.
  - Driver or Brainstem execution requires separate downstream evidence; neither control ACK nor /nav/cmd_vel alone confirms physical motion.
