schema_version: lingtu.runtime_graph.product.v1
name: teleop
summary: Operator teleoperation without autonomous navigation decisions.
operator_switchable: true
product_mode: teleop
product_session: teleop
session_mode: none
native_control_mode: teleop
slam_mode: none
requires_map: false
switch_policy: cold_restart
online_hot_switch_supported: false
data_plane: typed_dds
control_owner: operator
autonomy_owner: none
processes:
  - nav
  - driver
  - runtime
required_topics:
  - /nav/command/request
  - /nav/command/ack
  - /nav/cmd_vel
required_capabilities:
  - teleop
  - command_staleness_gate
  - velocity_limit
  - final_cmd_vel_single_writer
forbidden_modules:
  - SimEndpointDriverModule
  - nav.mission
  - nav.local_planner
  - nav.path_follower
  - SemanticPlannerModule
forbidden_claims:
  - autonomous_navigation
  - global_planning
  - local_path_tracking
  - module_sim_real_equivalence
  - ros2_bridge_required
transport_rules:
  product_bus: typed_dds
  same_process_algorithms: direct_function_calls
  lcm_allowed: false
target_chain:
  - Gateway/TeleopModule sends typed operator velocity requests through /nav/command/request and waits for /nav/command/ack.
  - Native command endpoint runs in control_mode=teleop and rejects autonomous goals/paths.
  - Command age, linear speed, and yaw rate are checked without requiring SLAM or a map.
  - Native command endpoint publishes final body-frame Twist to /nav/cmd_vel.
