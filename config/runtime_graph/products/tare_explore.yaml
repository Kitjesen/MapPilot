schema_version: lingtu.runtime_graph.product.v1
name: tare_explore
summary: TARE-style saved-map coverage goals feeding native OctoPlanner3D navigation execution.
operator_switchable: true
product_mode: exploration
product_session: exploration
session_mode: exploring
default_for_session_mode: true
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
data_plane: typed_dds
control_owner: autonomy
autonomy_owner: explore_endpoint
native_nav:
  control_mode: autonomy
  publish_cmd_vel: true
  check_obstacle: true
  use_traversability_cost: true
  allow_teleop_takeover: true
  teleop_local_planner: true
processes:
  - lidar
  - slam
  - maps
  - traversability
  - nav
  - driver
  - explore
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
required_topics:
  - /lidar/raw_frame
  - /imu/raw
  - /slam/odometry
  - /slam/registered_cloud
  - /slam/map_observation
  - /slam/map_cloud
  - /slam/localization_health
  - /maps/state
  - /maps/scene
  - /nav/exploration/command
  - /nav/exploration/ack
  - /nav/command/request
  - /nav/command/ack
  - /nav/state
  - /nav/operator_motion/control
  - /nav/operator_motion/sample
  - /nav/operator_motion/ack
  - /nav/operator_motion/status
  - /nav/goal/status
  - /nav/traversability
  - /nav/exploration_snapshot
  - /nav/exploration_execution_snapshot
  - /nav/exploration_segment/request
  - /nav/exploration_segment/ack
  - /nav/exploration_segment/status
  - /nav/global_path
  - /nav/local_path
  - /nav/way_point
  - /nav/cmd_vel
required_capabilities:
  - saved_map_relocalization
  - tare_frontier_or_viewpoint_goal_source
  - octoplanner3d_global_planning
  - local_planner_collision_and_traversability_scoring
  - final_cmd_vel_single_writer
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - operator_teleop_takeover_with_safety_veto
  - operator_assisted_local_planner_takeover
forbidden_modules:
  - TeleopModule
  - nav.mission
  - nav.velocity_mux
  - SimEndpointDriverModule
  - WavefrontFrontierExplorer
  - nav.local_planner
  - nav.path_follower
forbidden_claims:
  - module_sim_real_equivalence
  - ros2_bridge_required
transport_rules:
  product_bus: typed_dds
  same_process_algorithms: direct_function_calls
  lcm_allowed: false
target_chain:
  - Gateway starts, pauses, resumes, stops, or sets/clears a directed map-frame target through typed /nav/exploration/command and matching /nav/exploration/ack; SET/CLEAR use kinds 5/6 and the ACK returns intent_revision. The target is a soft TARE candidate preference, never static-boundary path authorization.
  - Native exploration requests an identity-bound rolling-map segment on /nav/exploration_segment/request; nav returns matching business ACK and lifecycle status with session, reset epoch, generation, and live identity. This does not reuse static-map generic-goal semantics.
  - Native exploration endpoint starts idle and chooses coverage goals only after a validated START command, a validated active map, and fresh identity-versioned rolling occupancy.
  - Status JSON is read-only telemetry and never grants command authority.
  - Exploration goals use typed /nav/command/request and must receive /nav/command/ack before they are recorded as active.
  - Operator takeover uses /nav/operator_motion/control for claim, hold, and release; matching /nav/operator_motion/ack confirms only that control action, while fresh /nav/operator_motion/sample is submitted-only and does not confirm output or motion.
  - Native nav publishes request-correlated map-frame lifecycle updates on /nav/goal/status; explore only reacts to the pending request's status.
  - Native nav endpoint executes exploration goals through OctoPlanner3D and LocalPlanner.
  - /nav/operator_motion/status exposes authority, gate, teleop-output, and final logical-command evidence; physical execution requires separate driver/actuator evidence beyond /nav/cmd_vel.
  - Operator takeover remains inside the native endpoint and uses assisted local planning; release holds zero until explicit resume and a fresh exploration goal.
