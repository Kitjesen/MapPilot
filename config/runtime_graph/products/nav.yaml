schema_version: lingtu.runtime_graph.product.v1
name: nav
contracts:
  - lingtu.product.nav.v1
summary: Saved-map autonomous navigation through native localization, native DDS SLAM, OctoPlanner3D, C++ LocalPlanner, and gated command output.
operator_switchable: true
product_mode: navigation
product_session: navigation
session_mode: navigating
default_for_session_mode: true
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
data_plane: typed_dds
control_owner: autonomy
autonomy_owner: native_nav_endpoint
native_nav:
  control_mode: autonomy
  publish_cmd_vel: true
  check_obstacle: true
  use_traversability_cost: true
  allow_teleop_takeover: true
  teleop_local_planner: true
processes:
  - lidar
  - slam
  - maps
  - traversability
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - SlamAdapterModule
  - maps.service
  - nav.commands
  - nav.goals
  - GatewayModule
forbidden_modules:
  - TeleopModule
  - nav.mission
  - nav.velocity_mux
  - SimEndpointDriverModule
  - nav.local_planner
  - nav.path_follower
  - OccupancyGridModule
  - VoxelGridModule
  - ElevationMapModule
  - ESDFModule
  - TraversabilityCostModule
  - SemanticMapModule
forbidden_claims:
  - module_sim_real_equivalence
  - ros2_bridge_required
transport_rules:
  product_bus: typed_dds
  same_process_algorithms: direct_function_calls
  lcm_allowed: false
