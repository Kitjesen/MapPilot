schema_version: lingtu.runtime_graph.product.v3
name: nav
default_variant: standard
variants:
  standard:
    host:
      capabilities: [gateway, operator_motion, navigation_skills, goal_commands]
      run_startup_checks: true
  camera:
    # Operator video preview only. Navigation still consumes LiDAR geometry.
    host:
      capabilities: [gateway, operator_motion, navigation_skills, goal_commands]
      run_startup_checks: true
    require_map_scene: false
    processes: [lidar, imu, slam, maps, nav, driver, camera, host]
    topics:
      - /tf
      - /slam/odometry
      - /slam/registered_cloud
      - /slam/map_observation
      - /slam/map_cloud
      - /slam/localization_health
      - /maps/state
      - /maps/scene
      - /maps/activation/request
      - /maps/activation/ack
      - /nav/command/request
      - /nav/command/ack
      - /nav/goal/status
      - /nav/state
      - /nav/operator_motion/control
      - /nav/operator_motion/sample
      - /nav/operator_motion/ack
      - /nav/operator_motion/status
      - /nav/global_path
      - /nav/local_path
      - /nav/way_point
      - /nav/cmd_vel
      - /camera/color/image_raw
      - /camera/depth/image_raw
      - /camera/color/camera_info
    capabilities:
      - saved_map_relocalization
      - octoplanner3d_global_planning
      - local_planner_collision_scoring
      - path_follower_pre_command_output
      - final_cmd_vel_single_writer
      - operator_motion_typed_dds_interface
      - native_operator_motion_authority
      - operator_teleop_takeover_with_safety_veto
      - operator_assisted_local_planner_takeover
      - camera_preview
topics:
  - /tf
  - /slam/odometry
  - /slam/registered_cloud
  - /slam/map_observation
  - /slam/map_cloud
  - /slam/localization_health
  - /maps/state
  - /maps/scene
  - /maps/activation/request
  - /maps/activation/ack
  - /nav/command/request
  - /nav/command/ack
  - /nav/goal/status
  - /nav/state
  - /nav/operator_motion/control
  - /nav/operator_motion/sample
  - /nav/operator_motion/ack
  - /nav/operator_motion/status
  - /nav/global_path
  - /nav/local_path
  - /nav/way_point
  - /nav/cmd_vel
capabilities:
  - saved_map_relocalization
  - octoplanner3d_global_planning
  - local_planner_collision_scoring
  - path_follower_pre_command_output
  - final_cmd_vel_single_writer
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - operator_teleop_takeover_with_safety_veto
  - operator_assisted_local_planner_takeover
summary: Saved-map autonomous navigation through native localization, native DDS SLAM, OctoPlanner3D, C++ LocalPlanner, and gated command output.
operator_switchable: true
session_mode: navigating
default_for_session_mode: true
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
host:
  capabilities: [gateway, operator_motion, navigation_skills, goal_commands]
  run_startup_checks: true
native_nav:
  # Match SCAN's upstream 100 Hz FSM and closed-loop controller cadence.
  tick_hz: 100.0
  global_planner: octoplanner3d
  # The measured 0.76 x 0.31 m Go2 envelope has a 0.410 m circumscribed
  # radius. Keep 1 cm of global-route margin; SCAN's local double cylinder
  # remains the stricter 0.43 m swept collision check.
  octoplanner3d_robot_radius: 0.42
  local_planner: scan
  local_planners: [cmu, scan]
  use_traversability_cost: false
  corridor_lookahead_m: 3.5
  goal_reached_m: 0.15
  waypoint_reached_m: 0.20
  path_follower_goal_tolerance_m: 0.15
  path_follower_lookahead_m: 0.35
  path_follower_max_speed_mps: 0.75
  path_follower_min_speed_mps: 0.08
  path_follower_max_accel_mps2: 0.5
  teleop_max_speed_mps: 0.5
  teleop_max_yaw_rate_rad_s: 1.0
  path_follower_max_yaw_rate_rad_s: 1.0
  path_follower_max_yaw_accel_rad_s2: 1.0
  path_follower_heading_align_enter_rad: 0.7853981633974483
  path_follower_heading_align_exit_rad: 0.35
  recovery:
    behavior_order: [translate, rotate]
    blocked_interval_s: 2.0
    rotation_timeout_s: 2.5
    translation_timeout_s: 1.5
    max_attempts: 3
    translation_speed_mps: 0.15
    rotation_rate_rad_s: 0.25
    min_rotation_rad: 0.20
    max_rotation_rad: 1.20
    rotation_candidate_step_rad: 0.20
    rotation_sample_step_rad: 0.05
  allow_teleop_takeover: true
  teleop_local_planner: true
processes:
  - lidar
  - imu
  - slam
  - maps
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - SlamAdapterModule
  - nav.commands
  - nav.goals
  - GatewayModule
forbidden_modules:
  - SimEndpointDriverModule
