schema_version: lingtu.runtime_graph.product.v1
name: tracking
summary: Follow explicit map-frame goals with native planning and safety, without semantic goal selection.
operator_switchable: true
product_mode: tracking
product_session: tracking
session_mode: navigating
native_control_mode: autonomy
slam_mode: localization
requires_map: true
switch_policy: cold_restart
online_hot_switch_supported: false
data_plane: typed_dds
control_owner: autonomy
autonomy_owner: native_nav_endpoint
native_nav:
  control_mode: autonomy
  publish_cmd_vel: true
  check_obstacle: true
  use_traversability_cost: true
  allow_teleop_takeover: true
  teleop_local_planner: true
processes:
  - lidar
  - slam
  - maps
  - traversability
  - nav
  - driver
  - host
critical_modules:
  - host.bus
  - nav.commands
  - GatewayModule
required_topics:
  - /tf
  - /slam/odometry
  - /slam/registered_cloud
  - /slam/map_observation
  - /slam/localization_health
  - /maps/state
  - /maps/scene
  - /nav/command/request
  - /nav/command/ack
  - /nav/goal/status
  - /nav/state
  - /nav/operator_motion/control
  - /nav/operator_motion/sample
  - /nav/operator_motion/ack
  - /nav/operator_motion/status
  - /nav/traversability
  - /nav/global_path
  - /nav/local_path
  - /nav/way_point
  - /nav/cmd_vel
required_capabilities:
  - saved_map_relocalization
  - explicit_goal_tracking
  - local_planner_collision_and_traversability_scoring
  - path_follower_pre_command_output
  - final_cmd_vel_single_writer
  - operator_motion_typed_dds_interface
  - native_operator_motion_authority
  - operator_teleop_takeover_with_safety_veto
  - operator_assisted_local_planner_takeover
forbidden_modules:
  - TeleopModule
  - nav.mission
  - nav.velocity_mux
  - SimEndpointDriverModule
  - SemanticPlannerModule
  - nav.local_planner
  - nav.path_follower
forbidden_claims:
  - semantic_autonomy
  - module_sim_real_equivalence
  - ros2_bridge_required
transport_rules:
  product_bus: typed_dds
  same_process_algorithms: direct_function_calls
  lcm_allowed: false
target_chain:
  - Gateway/MCP sends explicit tracking goals through /nav/command/request and waits for /nav/command/ack.
  - Operator takeover uses /nav/operator_motion/control for claim, hold, and release; matching /nav/operator_motion/ack confirms only native control admission, while fresh /nav/operator_motion/sample is submitted-only and does not confirm output or motion.
  - Native nav endpoint performs local planning and path follower pre-command output.
  - PathFollower consumes the local path in memory; the endpoint publishes /nav/local_path telemetry, /nav/way_point, and final /nav/cmd_vel.
  - /nav/operator_motion/status exposes authority, gate, teleop-output, and final logical-command evidence; separate driver/actuator evidence is required to confirm physical execution.
  - A deliberate non-zero operator command may latch manual takeover, cancel the old path, and remain stopped after release until explicit resume.
  - During takeover, joystick translation is treated as a short-horizon motion intent; native LocalPlanner and PathFollower may detour within the configured deviation, while no-path remains a hard stop.
