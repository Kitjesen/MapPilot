schema_version: lingtu.runtime_parameters.v1

# Parameter profiles contain only deliberate behavior choices. Platform limits
# belong to Env overrides, while values absent from both layers use the C++
# contract defaults. These values are baselines, not claims of optimal tuning.
profiles:
  rolling_explore:
    segment.max_distance_m: 5.0
    segment.max_waypoints: 32
    risk.stop_threshold: 50.0
    risk.resume_threshold: 40.0

