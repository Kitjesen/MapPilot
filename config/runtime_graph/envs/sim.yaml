schema_version: lingtu.runtime_graph.env.v1
name: sim
summary: Simulation environment with an explicit backend implementation selected per run.
simulation_only: true
parameter_overrides:
  map_input.max_cells: 262144
  map_input.max_age_s: 0.50
supported_products:
  - teleop
  - teleop_avoid
  - map
  - nav
  - tracking
  - inspection
  - explore
backends:
  mujoco:
    summary: Persistent MuJoCo runtime around the native C++ typed-DDS control chain.
    local_planners: [cmu, scan]
    supported_products:
      - teleop
      - teleop_avoid
      - map
      - nav
      - tracking
      - inspection
      - explore
    process_control: subprocess
    process_manager: direct
    presets:
      doso/thunder_v4:
        default: sim/presets/doso/thunder_v4/default.yaml
        nav: sim/presets/doso/thunder_v4/nav.yaml
        teleop_avoid: sim/presets/doso/thunder_v4/teleop_avoid.yaml
        tracking: sim/presets/doso/thunder_v4/tracking.yaml
    provided_roles:
      - lidar
      - imu
      - slam
      - maps
      - traversability
      - nav
      - driver
      - camera
      - explore
      - host
    support_processes:
      - mujoco_feeder
    stop_before_start:
      - host_runtime
      - explore_runtime
      - nav_runtime
      - traversability_runtime
      - map_runtime
      - slam_runtime
      - mujoco_feeder
      - camera_publisher
      - imu_publisher
      - lidar_publisher
      - driver_bridge
    processes:
      lidar_publisher:
        target: lidar_publisher
        lifecycle: mode
        order: 10
        timeout_s: 15
        provides: [lidar]
        platforms:
          windows:
            argv: [build/windows-native-dds-adapter/Release/lingtu_mujoco_sensor_publisher.exe, --stream, lidar, --domain-id, "17", --local-endpoint, --dds, --scan-window, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/windows-native-dds-adapter/Release/lingtu_mujoco_sensor_publisher.exe}
            dependencies:
              - path: build/windows-native-dds-adapter/Release/ddsc.dll
            readiness: {kind: file, target: lidar.ready.json}
            shutdown: {kind: process}
          linux:
            argv: [build/mujoco_native_dds/lingtu_mujoco_sensor_publisher, --stream, lidar, --domain-id, "231", --local-endpoint, --dds, --scan-window, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/mujoco_native_dds/lingtu_mujoco_sensor_publisher}
            readiness: {kind: file, target: lidar.ready.json}
            shutdown: {kind: process}
      imu_publisher:
        target: imu_publisher
        lifecycle: mode
        order: 10
        timeout_s: 15
        provides: [imu]
        platforms:
          windows:
            argv: [build/windows-native-dds-adapter/Release/lingtu_mujoco_sensor_publisher.exe, --stream, imu, --domain-id, "17", --local-endpoint, --dds, --scan-window, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/windows-native-dds-adapter/Release/lingtu_mujoco_sensor_publisher.exe}
            dependencies:
              - path: build/windows-native-dds-adapter/Release/ddsc.dll
            readiness: {kind: file, target: imu.ready.json}
            shutdown: {kind: process}
          linux:
            argv: [build/mujoco_native_dds/lingtu_mujoco_sensor_publisher, --stream, imu, --domain-id, "231", --local-endpoint, --dds, --scan-window, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/mujoco_native_dds/lingtu_mujoco_sensor_publisher}
            readiness: {kind: file, target: imu.ready.json}
            shutdown: {kind: process}
      camera_publisher:
        target: camera_publisher
        lifecycle: mode
        order: 10
        timeout_s: 15
        provides: [camera]
        platforms:
          windows:
            argv: [build/windows-native-dds-adapter/Release/lingtu_mujoco_sensor_publisher.exe, --stream, camera, --domain-id, "17", --local-endpoint, --dds, --scan-window, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/windows-native-dds-adapter/Release/lingtu_mujoco_sensor_publisher.exe}
            dependencies:
              - path: build/windows-native-dds-adapter/Release/ddsc.dll
            readiness: {kind: file, target: camera.ready.json}
            shutdown: {kind: process}
          linux:
            argv: [build/mujoco_native_dds/lingtu_mujoco_sensor_publisher, --stream, camera, --domain-id, "231", --local-endpoint, --dds, --scan-window, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/mujoco_native_dds/lingtu_mujoco_sensor_publisher}
            readiness: {kind: file, target: camera.ready.json}
            shutdown: {kind: process}
      driver_bridge:
        target: driver_bridge
        lifecycle: mode
        order: 10
        timeout_s: 15
        provides: [driver]
        platforms:
          windows:
            argv: [build/windows-native-dds-adapter/Release/lingtu_mujoco_driver_bridge.exe, --domain-id, "17", --local-endpoint, --command-timeout-ms, "500", --heartbeat-timeout-ms, "2000", --apply-timeout-ms, "30000"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/windows-native-dds-adapter/Release/lingtu_mujoco_driver_bridge.exe}
            dependencies:
              - path: build/windows-native-dds-adapter/Release/ddsc.dll
            readiness: {kind: file, target: driver.ready.json}
            shutdown: {kind: process}
          linux:
            argv: [build/mujoco_native_dds/lingtu_mujoco_driver_bridge, --domain-id, "231", --local-endpoint, --command-timeout-ms, "500", --heartbeat-timeout-ms, "2000", --apply-timeout-ms, "30000"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/mujoco_native_dds/lingtu_mujoco_driver_bridge}
            readiness: {kind: file, target: driver.ready.json}
            shutdown: {kind: process}
      mujoco_feeder:
        target: mujoco_feeder
        lifecycle: mode
        order: 20
        timeout_s: 60
        provides: []
        command:
          argv:
            - python
            - sim/scripts/mujoco/formal_feeder.py
            - --mid360-samples-per-frame
            - "4000"
          cwd: .
          env: {}
          artifact:
            path: sim/scripts/mujoco/formal_feeder.py
          readiness:
            kind: file
            target: mujoco_feeder.ready.json
          shutdown:
            kind: file
            target: mujoco_feeder.stop.json
            schema: lingtu.sim.motion_stop.v2
      slam_runtime:
        target: slam_runtime
        lifecycle: mode
        order: 20
        timeout_s: 60
        provides: [slam]
        platforms:
          windows:
            argv: [build/slam-core-windows-x64/stage/bin/slamd.exe, --backend, fastlio2, --domain-id, "17", --tick-hz, "50", --status-json-hz, "10", --track-against-map-period-s, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/slam-core-windows-x64/stage/bin/slamd.exe}
            dependencies:
              - path: build/slam-core-windows-x64/stage/bin/boost_filesystem-vc143-mt-x64-1_91.dll
              - path: build/slam-core-windows-x64/stage/bin/boost_iostreams-vc143-mt-x64-1_91.dll
              - path: build/slam-core-windows-x64/stage/bin/bz2.dll
              - path: build/slam-core-windows-x64/stage/bin/ddsc.dll
              - path: build/slam-core-windows-x64/stage/bin/liblzma.dll
              - path: build/slam-core-windows-x64/stage/bin/libpng16.dll
              - path: build/slam-core-windows-x64/stage/bin/lz4.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_common.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_filters.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_io.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_io_ply.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_kdtree.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_octree.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_registration.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_sample_consensus.dll
              - path: build/slam-core-windows-x64/stage/bin/pcl_search.dll
              - path: build/slam-core-windows-x64/stage/bin/yaml-cpp.dll
              - path: build/slam-core-windows-x64/stage/bin/z.dll
              - path: build/slam-core-windows-x64/stage/bin/zstd.dll
            readiness: {kind: file, target: slam.status.json}
            shutdown: {kind: process}
          linux:
            argv: [build/slam_core/slamd, --backend, fastlio2, --domain-id, "231", --tick-hz, "50", --status-json-hz, "10", --track-against-map-period-s, "0"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/slam_core/slamd}
            readiness: {kind: file, target: slam.status.json}
            shutdown: {kind: process}
      map_runtime:
        target: map_runtime
        lifecycle: mode
        order: 20
        timeout_s: 60
        provides: [maps]
        platforms:
          windows:
            argv: [build/maps-windows/Release/mapd.exe, --domain-id, "17", --disable-query]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/maps-windows/Release/mapd.exe}
            dependencies:
              - path: build/maps-windows/Release/ddsc.dll
            readiness: {kind: file, target: mapd.status.json}
            shutdown: {kind: process}
          linux:
            argv: [build/maps/mapd, --domain-id, "231"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/maps/mapd}
            readiness: {kind: file, target: mapd.status.json}
            shutdown: {kind: process}
      traversability_runtime:
        target: traversability_runtime
        lifecycle: mode
        order: 20
        timeout_s: 30
        provides: [traversability]
        platforms:
          windows:
            argv: [build/nav-cpp/windows-x64-nav-endpoint/Release/lingtu_traversability_dds.exe, --domain-id, "17", --observed-free-ttl-s, "0.60", --observed-free-inflation-radius-m, "0.75"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/nav-cpp/windows-x64-nav-endpoint/Release/lingtu_traversability_dds.exe}
            dependencies:
              - path: build/nav-cpp/windows-x64-nav-endpoint/Release/ddsc.dll
            readiness: {kind: file, target: traversability.status.json}
            shutdown: {kind: process}
          linux:
            argv: [build/nav_endpoint/lingtu_traversability_dds, --domain-id, "231", --observed-free-ttl-s, "0.60", --observed-free-inflation-radius-m, "0.75"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/nav_endpoint/lingtu_traversability_dds}
            readiness: {kind: file, target: traversability.status.json}
            shutdown: {kind: process}
      nav_runtime:
        target: nav_runtime
        lifecycle: mode
        order: 20
        timeout_s: 60
        provides: [nav]
        platforms:
          windows:
            argv: [build/nav-cpp/windows-x64-nav-endpoint/Release/navd.exe, --domain-id, "17", --status-s, "0.1"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17", LINGTU_NAV_LOCAL_MAP_DEBUG_POINTS: "600"}
            artifact: {path: build/nav-cpp/windows-x64-nav-endpoint/Release/navd.exe}
            dependencies:
              - path: build/nav-cpp/windows-x64-nav-endpoint/Release/ddsc.dll
            readiness: {kind: file, target: nav.status.json}
            shutdown: {kind: process}
          linux:
            argv: [build/nav_endpoint/navd, --domain-id, "231", --status-s, "0.1"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231", LINGTU_NAV_LOCAL_MAP_DEBUG_POINTS: "600"}
            artifact: {path: build/nav_endpoint/navd}
            readiness: {kind: file, target: nav.status.json}
            shutdown: {kind: process}
      explore_runtime:
        target: explore_runtime
        lifecycle: mode
        order: 50
        timeout_s: 30
        provides: [explore]
        platforms:
          windows:
            argv: [build/nav-cpp/windows-x64-nav-endpoint/Release/lingtu_explore_dds.exe, --domain, "17", --tick-hz, "2"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "17"}
            artifact: {path: build/nav-cpp/windows-x64-nav-endpoint/Release/lingtu_explore_dds.exe}
            dependencies:
              - path: build/nav-cpp/windows-x64-nav-endpoint/Release/ddsc.dll
            readiness: {kind: file, target: explore.status.json}
            shutdown: {kind: process}
          linux:
            argv: [build/nav_endpoint/lingtu_explore_dds, --domain, "231", --tick-hz, "2"]
            cwd: .
            env: {LINGTU_DDS_DOMAIN_ID: "231"}
            artifact: {path: build/nav_endpoint/lingtu_explore_dds}
            readiness: {kind: file, target: explore.status.json}
            shutdown: {kind: process}
      host_runtime:
        target: host_runtime
        lifecycle: mode
        order: 50
        timeout_s: 45
        provides: [host]
        platforms:
          windows:
            argv: [python, src/lingtu/sim/host.py]
            cwd: .
            env:
              LINGTU_DDS_DOMAIN_ID: "17"
              LINGTU_NAV_CLIENT_LIB: build/nav-cpp/windows-x64-nav-endpoint/Release/lingtu_nav_client.dll
              LINGTU_SLAM_CONTROL: build/slam-core-windows-x64/stage/bin/slamctl.exe
            artifact: {path: src/lingtu/sim/host.py}
            dependencies:
              - path: build/nav-cpp/windows-x64-nav-endpoint/Release/lingtu_nav_client.dll
              - path: build/nav-cpp/windows-x64-nav-endpoint/Release/ddsc.dll
              - path: build/slam-core-windows-x64/stage/bin/slamctl.exe
            readiness: {kind: file, target: host.ready.json}
            shutdown: {kind: process}
          linux:
            argv: [python, src/lingtu/sim/host.py]
            cwd: .
            env:
              LINGTU_DDS_DOMAIN_ID: "231"
              LINGTU_NAV_CLIENT_LIB: build/nav_endpoint/liblingtu_nav_client.so
            artifact: {path: src/lingtu/sim/host.py}
            dependencies:
              - path: build/nav_endpoint/liblingtu_nav_client.so
            readiness: {kind: file, target: host.ready.json}
            shutdown: {kind: process}
    host_config:
      robot: sim_endpoint
      _endpoint_transport: dds
      _endpoint_contract: field_dds_v1
      enable_robot_driver: false
      enable_lidar: false
      command_output_mode: endpoint_only
      hardware_control_boundary: driver
      localization_adapter: cpp_slam_status
      native_navigation_endpoint: lingtu-nav-dds
      enable_camera: false
      use_driver_camera: false
      run_startup_checks: false
    endpoints:
      contract:
        name: field_dds_v1
        transport: dds
        runtime_class: native_dds
        data_plane: native_dds
        real_equivalent: true
        sensor_publishers:
          lidar: lingtu_mujoco_sensor_publisher --stream lidar
          imu: lingtu_mujoco_sensor_publisher --stream imu
          camera: lingtu_mujoco_sensor_publisher --stream camera
        simulation_command_consumer: ThunderV4 RL policy via lingtu_mujoco_driver_bridge; never forwards to Brainstem or hardware
        navigation_command_boundary:
          request: /nav/command/request
          ack: /nav/command/ack
          goal_status: /nav/goal/status
          client_completion: business_ack_required
        exploration_command_boundary:
          request: /nav/exploration/command
          ack: /nav/exploration/ack
          client_completion: business_ack_required
          directed_target:
            set_kind: 5
            clear_kind: 6
            request_fields: [has_directed_target, directed_target_x, directed_target_y, directed_target_ttl_s]
            ack_field: intent_revision
            policy: soft_tare_candidate_preference
            grants_static_boundary_path_authorization: false
          status_source: /dev/shm/lingtu/explore_status.json
          status_authoritative_for_commands: false
        exploration_run_event_stream:
          topic: /nav/exploration/run/event
          ordering_cursor: [boot_id, event_sequence]
          terminal_truth: native_motion_stop_confirmation_before_terminal
        exploration_segment_boundary:
          execution_snapshot: /nav/exploration_execution_snapshot
          request: /nav/exploration_segment/request
          ack: /nav/exploration_segment/ack
          status: /nav/exploration_segment/status
          client_completion: matching_business_ack_and_terminal_status_required
          request_identity_fields: [session_id, reset_epoch, minimum_generation]
          response_identity_fields: [session_id, reset_epoch, generation, live]
        inspection_task_boundary:
          request: /nav/inspection/task/request
          ack: /nav/inspection/task/ack
          status: /nav/inspection/status
          client_completion: business_ack_required
          request_identity_fields: [task_id, request_id]
          response_identity_fields: [task_id, request_id]
        inspection_task_event_stream:
          topic: /nav/inspection/task/event
          ordering_cursor: [boot_id, event_sequence]
          terminal_truth: native_stop_evidence_before_terminal_state
        inspection_evidence_boundary:
          request: /nav/inspection/evidence/request
          result: /nav/inspection/evidence/result
          client_completion: matching_persisted_result_required
        plan_boundary:
          request: /nav/plan/request
          result: /nav/plan/result
        map_activation_boundary:
          request: /maps/activation/request
          ack: /maps/activation/ack
          client_completion: matching_business_ack_required
          operations: [stage, restore, verify]
          request_identity_fields: [target, previous]
          stale_rollback_policy: reject_unless_active_exactly_matches_target
        local_path_role: dds_telemetry_and_preview
        path_follower_role: embedded_before_cmd_vel_gate
        source_topics:
          - /tf
          - /tf_static
          - /lidar/raw_frame
          - /imu/raw
          - /slam/map_command
          - /slam/relocalization/request
          - /nav/command/request
          - /nav/plan/request
          - /nav/operator_motion/control
          - /nav/operator_motion/sample
          - /nav/exploration/command
          - /nav/inspection/task/request
          - /nav/inspection/evidence/result
          - /nav/traversability
          - /maps/activation/request
        exposed_topics:
          - /slam/odometry
          - /slam/state_at_scan
          - /slam/registered_cloud
          - /slam/map_observation
          - /slam/map_cloud
          - /slam/saved_map_cloud
          - /slam/map_event
          - /slam/relocalization/response
          - /slam/localization_health
          - /slam/localization_quality
          - /maps/state
          - /maps/local_collision
          - /maps/scene
          - /maps/activation/ack
          - /nav/exploration_grid
          - /nav/exploration_snapshot
          - /nav/exploration_execution_snapshot
          - /nav/exploration_segment/request
          - /nav/exploration_segment/ack
          - /nav/exploration_segment/status
          - /nav/local_traversability
          - /nav/global_path
          - /nav/local_path
          - /nav/way_point
          - /nav/cmd_vel
          - /nav/command/ack
          - /nav/plan/result
          - /nav/operator_motion/ack
          - /nav/operator_motion/status
          - /nav/goal/status
          - /nav/state
          - /nav/exploration/ack
          - /nav/exploration/run/event
          - /nav/inspection/task/ack
          - /nav/inspection/status
          - /nav/inspection/task/event
          - /nav/inspection/evidence/request
        forbidden_modules:
          - SimEndpointDriverModule
          - Python GlobalPlanner
          - Python LocalPlanner
          - Python PathFollower
        forbidden_claims:
          - module_sim_real_equivalence
          - python_slam
