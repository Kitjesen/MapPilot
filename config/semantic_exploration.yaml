perception_node:
  ros__parameters:
    # 鈹€鈹€ 妫€娴嬪櫒鍚庣 (鍚岄粯璁ら厤缃? 鈹€鈹€
    detector_type: "yoloe"

    yoloe:
      model_size: "l"
      confidence: 0.3
      iou_threshold: 0.5
      tensorrt: false
      max_detections: 30

    # 鈹€鈹€ 璇箟缂栫爜 鈹€鈹€
    clip:
      enable: true
      model: "ViT-B/32"
      text_only: true

    # 鈹€鈹€ 榛樿妫€娴嬬被鍒?鈹€鈹€
    default_classes: "door . chair . fire extinguisher . person . desk . stairs . elevator . sign . trash can . sofa . table . bed . refrigerator . window"

    # 鈹€鈹€ 3D 鎶曞奖 鈹€鈹€
    depth_scale: 0.001
    max_depth: 6.0
    min_depth: 0.3
    iou_threshold: 0.3
    clip_similarity_threshold: 0.75
    merge_distance: 0.5

    # 鈹€鈹€ 鍦烘櫙鍥?鈹€鈹€
    scene_graph:
      enable: true
      publish_rate: 2.0
      max_objects: 200

    semantic_map:
      enable: true

    target_fps: 15.0
    skip_frames: 1

    # 鈹€鈹€ 瀹炰緥杩借釜 (澧為噺鏇存柊) 鈹€鈹€
    tracker:
      incremental_update: true
      update_radius: 5.0
      stale_remove_timeout: 30.0

    # 鈹€鈹€ SCG 璺緞瑙勫垝 + 鑷姩澶氶潰浣撴墿灞?(鈽?鎺㈢储妯″紡鏍稿績) 鈹€鈹€
    scg:
      enable: true
      request_topic: "/nav/scg/plan_request"
      result_topic: "/nav/scg/plan_result"
      # 鎺㈢储妯″紡鏂板: 姣廚甯т粠褰撳墠灞€閮ㄦ爡鏍艰嚜鍔ㄦ墿灞曞闈綋骞舵洿鏂?SCG
      auto_expand: true
      expand_every_n_frames: 10     # 绾?1.5Hz (@ 15Hz 鎰熺煡棰戠巼)
      min_new_polyhedra: 2          # 灏戜簬姝ゆ暟閲忕殑鏂板闈綋鏃惰烦杩囨洿鏂?

    # 鈹€鈹€ 鍏ㄥ眬瑕嗙洊鎺╃爜 (鈽?鎺㈢储妯″紡鏍稿績) 鈹€鈹€
    gcm:
      enable: true
      resolution: 0.5               # 鏍煎瓙澶у皬 (绫?, 绮楃矑搴﹁拷韪鐩栬繘搴?


decision_node:
  ros__parameters:
    # 鈹€鈹€ LLM 閰嶇疆 (鎺㈢储妯″紡榛樿 mock, 鏃犻渶 API key) 鈹€鈹€
    # 鏀逛负 "kimi" 骞惰缃?MOONSHOT_API_KEY 鍙娇鐢ㄧ湡瀹炴帹鐞?
    llm:
      backend: "mock"
      model: "mock"
      api_key_env: "MOONSHOT_API_KEY"
      timeout_sec: 5.0
      max_retries: 1
      temperature: 0.2

    # 鈹€鈹€ 澶囩敤 LLM 鈹€鈹€
    llm_fallback:
      backend: "mock"
      model: "mock"
      api_key_env: "DASHSCOPE_API_KEY"
      timeout_sec: 5.0
      max_retries: 1

    # 鈹€鈹€ 鐩爣瑙ｆ瀽 (闄嶄綆闃堝€? 鏇村鏄撹Е鍙戞帰绱? 鈹€鈹€
    goal_resolution:
      confidence_threshold: 0.5     # 浣庝簬姝ょ疆淇″害瑙﹀彂 Frontier 鎺㈢储
      vision_threshold: 0.5
      replan_on_failure: true
      max_replan_attempts: 3
      fast_path_threshold: 0.70

    # 鈹€鈹€ 鎺㈢储绛栫暐 (鈽?鏍稿績鍙傛暟) 鈹€鈹€
    exploration:
      enable: true
      strategy: "frontier"          # frontier = FrontierScorer 瀹炴椂鎺㈢储 (USS-Nav style)
                                    # SG-Nav 瀛愬浘鎺ㄧ悊浠呭湪鐩爣纭闃舵鎸夐渶瑙﹀彂
                                    # 濡傞渶 SG-Nav 鍏ㄧ▼鎺㈢储 (鎱? <1Hz), 鏀逛负 "sg_nav"
      max_explore_steps: 50         # 鎺㈢储妯″紡姝ユ暟鏇村
      step_distance: 2.0
      costmap_topic: "/nav/costmap"
      frontier_score_threshold: 0.15   # 闄嶄綆闂ㄦ, 鎺ュ彈鏇村鍊欓€?frontier
      frontier_min_size: 5
      frontier_max_count: 10
      frontier_cluster_radius_cells: 3

      # Frontier 璇勫垎鏉冮噸 (鎺㈢储妯″紡璋冩暣: 鎻愰珮鏂伴搴︽潈閲?
      frontier_distance_weight: 0.25
      frontier_novelty_weight: 0.35    # 鏂伴搴︽潈閲嶆彁楂?(榧撳姳鎺㈢储鏂板尯鍩?
      frontier_language_weight: 0.20
      frontier_grounding_weight: 0.20  # 闄嶄綆, 鍥犱负鐩爣鍙兘鏈煡

      frontier_novelty_distance: 5.0
      frontier_nearby_object_radius: 3.0
      frontier_grounding_angle_threshold: 0.7854
      frontier_cooccurrence_bonus: 0.25
      frontier_grounding_spatial_bonus: 0.1
      frontier_grounding_keyword_bonus: 0.4
      frontier_grounding_relation_bonus: 0.15
      frontier_vision_weight: 0.15

      # SG-Nav 鍙傛暟 (sg_nav 绛栫暐宸插惎鐢?
      sgnav:
        max_subgraphs: 6
        use_llm_reasoning: false     # mock 妯″紡涓嬪叧闂?LLM 鎺ㄧ悊
        heuristic_weight: 0.60
        llm_weight: 0.40
        frontier_base_weight: 0.55
        room_gate_weight: 0.25
        interp_decay_distance: 4.0
        credibility_decay: 0.9
        false_positive_penalty: 0.2
        reject_threshold: 0.25
        min_confidence_for_bypass: 0.85
        arrival_reperception: true
        continuous_reperception: true
        reperception_interval_m: 2.0
        reperception_n_max: 10
        reperception_s_thresh: 0.8

    # 鈹€鈹€ 铻嶅悎鏉冮噸 鈹€鈹€
    fusion:
      weight_label_match: 0.35
      weight_clip_sim: 0.35
      weight_detector_score: 0.15
      weight_spatial_hint: 0.15
      no_clip_weight_label: 0.55
      no_clip_weight_detector: 0.25
      no_clip_weight_spatial: 0.20
      detector_count_normalize: 3

    # 鈹€鈹€ Vision Grounding 鈹€鈹€
    vision:
      enable: true
      image_topic: "/camera/color/image_raw"
      verify_threshold: 0.5

    # 鈹€鈹€ 鎵ц鍙傛暟 鈹€鈹€
    execution:
      arrival_radius: 1.0
      monitor_hz: 1.0
      look_around_hz: 10.0
      default_timeout: 600.0         # 鎺㈢储妯″紡瓒呮椂鏇撮暱

    # 鈹€鈹€ 鎷撴墤璁板繂 鈹€鈹€
    topo_memory:
      new_node_distance: 2.0
      max_nodes: 1000               # 鎺㈢储妯″紡璁板繂鑺傜偣鏇村

    # 鈹€鈹€ 瀹夊叏绾︽潫 鈹€鈹€
    safety:
      max_goal_distance: 50.0
      forbidden_zones: []

    # 鈹€鈹€ FSM 鈹€鈹€
    fsm:
      mode: "implicit"
      implicit:
        weights_path: ""
        strict: false

    prompt_template_dir: ""
