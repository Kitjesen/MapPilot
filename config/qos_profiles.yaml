# =============================================================================
# ROS 2 / DDS QoS Scenario Configuration - LingTu 3D NAV
#
# This file defines recommended QoS profiles for different data links.
# Applied via rclcpp::QoS in C++ or launch parameters in Python.
#
# QoS dimension reference:
#   reliability:  RELIABLE (guaranteed delivery) / BEST_EFFORT (drop allowed)
#   durability:   VOLATILE (live subscribers only) / TRANSIENT_LOCAL (late-join replay)
#   history:      KEEP_LAST(depth) / KEEP_ALL
#   deadline:     publisher's maximum publish interval
#   liveliness:   alive detection policy
#   lifespan:     message expiry time (dropped if expired, not delivered)
#
# Each topic is listed in both ROS style (/topic) and DDS native style (rt/topic).
# The rt/ prefix is the CycloneDDS / Fast DDS native topic name for ROS 2 topics.
# =============================================================================

# -----------------------------------------------------------------------------
# QoS Profiles
# -----------------------------------------------------------------------------

profiles:

  # =========================================================================
  # Existing profiles (preserved and fixed)
  # =========================================================================

  # --- LiDAR PointCloud (large high-frequency data) ---
  # ~1 MB/frame, 10 Hz, losing 1 frame is acceptable
  lidar_pointcloud:
    reliability: best_effort       # drop is acceptable, avoid retransmit stall
    durability: volatile
    history: keep_last
    depth: 2                       # buffer at most 2 frames, prevent memory burst
    lifespan: 200ms                # point clouds older than 200 ms are meaningless
    topics:
      - /slam/registered_cloud
      - rt/slam/registered_cloud
      - /nav/terrain_map
      - rt/nav/terrain_map
      - /nav/terrain_map_ext
      - rt/nav/terrain_map_ext

  # --- High-frequency State (Odometry, IMU) ---
  # ~200 B, 100-200 Hz, only latest value matters
  high_freq_state:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 5
    deadline: 20ms                 # expect >= 50 Hz
    topics:
      - /driver/odometry
      - rt/driver/odometry
      - /slam/odometry
      - rt/slam/odometry
      - /gnss/fix
      - rt/gnss/fix
      - /gnss/odom
      - rt/gnss/odom
      - /imu/raw
      - rt/imu/raw
      - /slam/localization_quality
      - rt/slam/localization_quality

  # --- Localization Health (low-rate diagnostic) ---
  localization_health:
    reliability: reliable          # keep state transitions visible
    durability: volatile           # avoid replaying stale lock/lost state
    history: keep_last
    depth: 10
    topics:
      - /slam/localization_health
      - rt/slam/localization_health

  # --- Final hardware velocity command ---
  # The application-level envelope is also freshness checked by lingtu-driver.
  final_velocity_command:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 1
    deadline: 50ms
    lifespan: 200ms
    topics:
      - /nav/cmd_vel
      - rt/nav/cmd_vel

  # --- Other control commands (stop, waypoint) ---
  control_commands:
    reliability: reliable          # control commands must be delivered
    durability: volatile
    history: keep_last
    depth: 1                       # only the latest command
    deadline: 50ms                 # expect >= 20 Hz
    topics:
      - /nav/stop
      - rt/nav/stop
      - /nav/way_point
      - rt/nav/way_point
      - /nav/teleop_cmd_vel
      - rt/nav/teleop_cmd_vel
      - /nav/cancel
      - rt/nav/cancel
      - /nav/map_clearing
      - rt/nav/map_clearing
      - /nav/cloud_clearing
      - rt/nav/cloud_clearing
      - /nav/slow_down
      - rt/nav/slow_down

  navigation_command_request:
    reliability: reliable
    durability: volatile
    history: keep_last
    depth: 32
    topics:
      - /nav/command/request
      - rt/nav/command/request
      - /nav/exploration/command
      - rt/nav/exploration/command
      - /nav/inspection/command
      - rt/nav/inspection/command

  navigation_command_ack:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 64
    topics:
      - /nav/command/ack
      - rt/nav/command/ack
      - /nav/exploration/ack
      - rt/nav/exploration/ack
      - /nav/inspection/ack
      - rt/nav/inspection/ack

  inspection_status:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 1
    topics:
      - /nav/inspection/status
      - rt/nav/inspection/status

  # --- Global Path ---
  # ~10 KB, <1 Hz, must not drop
  global_path:
    reliability: reliable
    durability: transient_local    # late-joining subscribers get the latest path
    history: keep_last
    depth: 1
    topics:
      - /nav/global_path
      - rt/nav/global_path
      - /nav/local_path
      - rt/nav/local_path

  # --- Map/Grid State ---
  # Low-rate occupancy-style state consumed by planners and gateway surfaces.
  map_grid:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 1
    topics:
      - /nav/traversability
      - rt/nav/traversability
      - /nav/exploration_grid
      - rt/nav/exploration_grid
      - /nav/exploration_snapshot
      - rt/nav/exploration_snapshot

  # --- Exploration Events (TARE explorer outputs, event-driven) ---
  # Waypoint / local path / runtime / finish / start signals emitted by the
  # exploration planner. Low-rate, event-driven; must not drop and late-joining
  # consumers should latch the latest value.
  exploration:
    reliability: reliable          # exploration commands/signals must be delivered
    durability: transient_local    # late-joining consumers get the latest value
    history: keep_last
    depth: 1                       # only the latest exploration output matters
    topics:
      - /exploration/way_point
      - rt/exploration/way_point
      - /exploration/local_path
      - rt/exploration/local_path
      - /exploration/runtime
      - rt/exploration/runtime
      - /exploration/finish
      - rt/exploration/finish
      - /exploration/start
      - rt/exploration/start

  # --- System Status (low-frequency but must arrive) ---
  system_status:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 1
    topics:
      - /robot_state
      - rt/robot_state
      - /gnss/status
      - rt/gnss/status
      - /driver/control_state
      - rt/driver/control_state

  # --- Geofence / Goal Pose (event-driven, must not drop) ---
  geofence_events:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 1
    topics:
      - /nav/goal_pose
      - rt/nav/goal_pose

  # --- Semantic Scene Graph (1-2 Hz, 2-10 KB/frame) ---
  # References:
  #   Hydra (MIT SPARK, TRO 2022): fast/slow dual-rate architecture -
  #     geometric layer 20-30 Hz, semantic layer 1-2 Hz;
  #     TRANSIENT_LOCAL lets late-joining nodes get current state immediately.
  #   KeySG (arXiv 2510.01049, 2025): trigger scene graph update only on key frames.
  semantic_scene_graph:
    reliability: reliable          # scene graph must not drop; 1 Hz miss = 1 s state gap
    durability: transient_local    # late-starting planner/gateway gets latest snapshot
    history: keep_last
    depth: 2                       # 1 Hz publish: buffer 2 frames, prevent stale buildup
    lifespan: 5000ms               # expire after 5 s, avoid stale scene graph on restart
    topics:
      - /nav/semantic/scene_graph
      - rt/nav/semantic/scene_graph

  # --- Semantic Detections (throttled to 2 Hz) ---
  # References:
  #   LOST-3DSG (arXiv 2601.02905, 2026): avoid storing 15 Hz dense features,
  #     keep only semantic digests to reduce bandwidth and memory; 2 Hz satisfies
  #     1 Hz planner demand.
  semantic_detections:
    reliability: best_effort       # detection frames allow occasional drops
    durability: volatile
    history: keep_last
    depth: 2                       # 2 Hz publish: buffer 2 frames, prevent single-frame delay
    lifespan: 1000ms               # detections older than 1 s are meaningless
    topics:
      - /nav/semantic/detections_3d
      - rt/nav/semantic/detections_3d

  # --- Semantic Nav Events (instruction / goal / status, event-driven) ---
  semantic_nav_events:
    reliability: reliable
    durability: transient_local    # late-joining executor gets current task state
    history: keep_last
    depth: 1
    topics:
      - /nav/semantic/instruction
      - rt/nav/semantic/instruction
      - /nav/semantic/status
      - rt/nav/semantic/status

  # --- TF (tf2_ros): use ROS 2 default QoS ---
  # /tf: BEST_EFFORT + KEEP_LAST(100) (ROS 2 default)
  # /tf_static: RELIABLE + TRANSIENT_LOCAL (ROS 2 default)
  # Do not override these; tf2_ros behavior will be abnormal otherwise.
  tf:
    note: "Use ROS 2 / tf2_ros default settings, do not override"
    topics:
      - /tf
      - rt/tf
      - /tf_static
      - rt/tf_static

  # =========================================================================
  # Product-level QoS profiles (new)
  # =========================================================================

  # --- Sensor Stream (raw LiDAR frames, IMU, SLAM odom prior) ---
  # High-rate sensor data where only the latest sample matters.
  sensor_stream:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 256
    topics:
      - /lidar/raw_frame
      - rt/lidar/raw_frame
      - /imu/raw
      - rt/imu/raw
      - /slam/odom_prior
      - rt/slam/odom_prior

  # --- Camera Stream (color + depth) ---
  # Best-effort video; depth=1 ensures only the latest frame is kept.
  camera_stream:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 1
    topics:
      - /camera/color/image_raw
      - rt/camera/color
      - /camera/depth/image_raw
      - rt/camera/depth

  # --- Camera Info (calibration metadata) ---
  # Latched: late-joining subscribers receive the last published camera info.
  camera_info:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 1
    topics:
      - /camera/color/camera_info
      - rt/camera/info

  # --- TF Dynamic (ROS 2 default for /tf) ---
  tf_dynamic:
    reliability: best_effort
    durability: volatile
    history: keep_last
    depth: 100
    topics:
      - /tf
      - rt/tf

  # --- TF Static (ROS 2 default for /tf_static) ---
  tf_static:
    reliability: reliable
    durability: transient_local
    history: keep_last
    depth: 1
    topics:
      - /tf_static
      - rt/tf_static

# -----------------------------------------------------------------------------
# Bandwidth Budget
# -----------------------------------------------------------------------------

bandwidth_budget:
  # Estimated per-link bandwidth consumers (single machine, remote inter-machine comm)
  lidar_10hz_1MB: "~10 MB/s"
  odometry_100hz_200B: "~20 KB/s"
  imu_200hz_200B: "~40 KB/s"
  cmd_vel_50hz_100B: "~5 KB/s"
  path_1hz_10KB: "~10 KB/s"
  image_30hz_50KB: "~1.5 MB/s"
  scene_graph_1hz_5KB: "~5 KB/s"       # JSON scene graph (200 objects)
  detections_2hz_2KB: "~4 KB/s"        # throttled (was 15 Hz: ~45 KB/s)
  total_estimate: "~12 MB/s"
  note: >
    CycloneDDS uses UDP multicast by default. Same-host loopback does not use
    the physical NIC, so bandwidth is not a bottleneck. For cross-host traffic
    (e.g. remote monitoring), consider limiting camera_stream.
