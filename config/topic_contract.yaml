algorithm_interfaces:
  fastlio_mapping:
    inputs: [/lidar/raw_frame, /imu/raw]
    outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    owner: slam
    map_dependency: none_live_canonical_sensor_slam
  fastlio_raw_validation:
    inputs: [/lidar/raw_frame, /imu/raw]
    outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    owner: slam_sim_validation
    map_dependency: none_live_raw_sensor_slam
  exploration_strategy:
    inputs: [/slam/odometry, /slam/map_cloud, /nav/exploration_grid]
    outputs: [/exploration/way_point]
    owner: tare_or_frontier
    map_dependency: live_map_or_occupancy_grid
  wavefront_frontier_exploration:
    inputs: [/slam/odometry, /nav/exploration_grid]
    outputs: [/nav/goal_pose]
    owner: lingtu_frontier
    map_dependency: live_occupancy_grid_unknown_free_boundary
  traversable_frontier_preview:
    inputs: [/slam/odometry, /nav/exploration_grid, module:TraversableFrontierModule.fused_cost, module:TraversableFrontierModule.slope_grid, module:TraversableFrontierModule.esdf_field, module:TraversableFrontierModule.elevation_map]
    outputs: [/nav/traversable_frontiers, /nav/frontier_candidate]
    owner: lingtu_traversable_frontier
    map_dependency: live_occupancy_grid_and_traversability_layers_read_only_preview
  tare_exploration:
    inputs: [/slam/odometry, /tf, /nav/exploration_snapshot, /nav/exploration/command, /nav/goal/status, /nav/exploration_segment/ack, /nav/exploration_segment/status]
    outputs: [/nav/command/request, /nav/exploration/ack, /nav/exploration/run/event, /nav/exploration_segment/request]
    owner: native_explore_endpoint
    map_dependency: identity_versioned_rolling_occupancy_snapshot
    safety_contract: stale_odometry_or_snapshot_cancels_active_goal_before_replan
  rolling_map_segment_execution:
    inputs: [/slam/odometry, /nav/exploration_execution_snapshot, /nav/exploration_segment/request]
    outputs: [/nav/global_path, /nav/exploration_segment/ack, /nav/exploration_segment/status]
    owner: native_nav_endpoint
    map_dependency: atomic_identity_bound_rolling_execution_grid
  global_planning:
    inputs: [/slam/odometry, /slam/map_cloud, /exploration/way_point, /nav/goal_pose]
    outputs: [/nav/global_path, /nav/way_point]
    owner: lingtu_navigation
    map_dependency: planner_specific_octoplanner3d_octomap
  octoplanner3d_global_planning:
    inputs: [/slam/odometry, artifact:octomap, artifact:point_cloud, /nav/goal_pose]
    outputs: [/nav/global_path, /nav/way_point]
    owner: lingtu_octoplanner3d
    map_dependency: headless_octomap_bt_or_point_cloud_pcd
  local_planning_and_following:
    inputs: [/slam/odometry, /slam/registered_cloud, /nav/global_path]
    outputs: [/nav/local_path, /nav/cmd_vel]
    owner: lingtu_autonomy
    map_dependency: current_registered_cloud_and_path

