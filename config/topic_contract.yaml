adapter_aliases:
  # Native/third-party names are adapter-only. LingTu modules must consume the
  # canonical targets, not these source names.
  livox_driver:
    - {source: /livox/lidar, target: /lidar/raw_frame, msg_format: raw_livox_custom, scope: adapter_only}
    - {source: /livox/imu, target: /imu/raw, msg_format: sensor_msgs/msg/Imu, scope: adapter_only}
  fastlio2:
    - {source: /cloud_registered, target: /slam/registered_cloud, msg_format: registered_cloud, scope: adapter_only}
    - {source: /cloud_map, target: /slam/map_cloud, msg_format: map_cloud, scope: adapter_only}
    - {source: /Odometry, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /imu/data, target: /imu/raw, msg_format: sensor_msgs/msg/Imu, scope: adapter_only}
    - {source: /lidar/scan, target: /lidar/raw_frame, msg_format: raw_livox_custom, scope: adapter_only}
    - {source: save_map, target: /slam/save_map, msg_format: service, scope: adapter_only}
  pgo:
    - {source: /cloud_registered, target: /slam/registered_cloud, msg_format: registered_cloud, scope: adapter_only}
    - {source: /Odometry, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
  localizer:
    - {source: /cloud_registered, target: /slam/registered_cloud, msg_format: registered_cloud, scope: adapter_only}
    - {source: /Odometry, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: map_cloud, target: /slam/saved_map_cloud, msg_format: map_cloud, scope: adapter_only}
    - {source: /localization_quality, target: /slam/localization_quality, msg_format: std_msgs/msg/Float32, scope: adapter_only}
    - {source: relocalize, target: /slam/relocalize, msg_format: service, scope: adapter_only}
    - {source: relocalize_check, target: /slam/relocalize_check, msg_format: service, scope: adapter_only}
    - {source: global_relocalize, target: /slam/global_relocalize, msg_format: service, scope: adapter_only}
    - {source: global_relocalize_status, target: /slam/global_relocalize_status, msg_format: service, scope: adapter_only}
  pointlio:
    - {source: cloud_registered_body, target: /slam/registered_cloud, msg_format: registered_cloud, scope: adapter_only}
    - {source: cloud_registered, target: /slam/map_cloud, msg_format: map_cloud, scope: adapter_only}
    - {source: aft_mapped_to_init, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: livox/imu, target: /imu/raw, msg_format: sensor_msgs/msg/Imu, scope: adapter_only}
    - {source: livox/lidar, target: /lidar/raw_frame, msg_format: raw_livox_custom, scope: adapter_only}
    - {source: save_map, target: /slam/save_map, msg_format: service, scope: adapter_only}
  tare:
    - {source: /registered_scan, target: /slam/map_cloud, msg_format: map_cloud, scope: adapter_only}
