  - VelocityMux
  - GatewayModule
  frequency: local_plan_5_20hz_cmd_vel_20_50hz
  transport_policy: direct_default_shm_for_external_cpp_local_planner_dds_for_low_rate_path_state
- name: dynamic_obstacle_gate
  inputs:
  - /nav/added_obstacles
  - /nav/local_path
  - /nav/cmd_vel
  outputs:
