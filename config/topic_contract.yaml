    - {source: /terrain_map_ext, target: /nav/terrain_map_ext, msg_format: map_cloud, scope: adapter_only}
    - {source: /state_estimation, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /state_estimation_at_scan, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /way_point, target: /exploration/way_point, msg_format: geometry_msgs/msg/PointStamped, scope: adapter_only}
  terrain_analysis:
    - {source: /Odometry, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /cloud_map, target: /slam/map_cloud, msg_format: map_cloud, scope: adapter_only}
    - {source: /map_clearing, target: /nav/map_clearing, msg_format: std_msgs/msg/Bool, scope: adapter_only}
    - {source: /terrain_map, target: /nav/terrain_map, msg_format: map_cloud, scope: adapter_only}
  terrain_analysis_ext:
    - {source: /Odometry, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /cloud_map, target: /slam/map_cloud, msg_format: map_cloud, scope: adapter_only}
    - {source: /cloud_clearing, target: /nav/cloud_clearing, msg_format: std_msgs/msg/Bool, scope: adapter_only}
    - {source: /terrain_map, target: /nav/terrain_map, msg_format: map_cloud, scope: adapter_only}
    - {source: /terrain_map_ext, target: /nav/terrain_map_ext, msg_format: map_cloud, scope: adapter_only}
  local_planner:
    - {source: /Odometry, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /cloud_map, target: /slam/map_cloud, msg_format: map_cloud, scope: adapter_only}
    - {source: /terrain_map, target: /nav/terrain_map, msg_format: map_cloud, scope: adapter_only}
    - {source: /terrain_map_ext, target: /nav/terrain_map_ext, msg_format: map_cloud, scope: adapter_only}
    - {source: /way_point, target: /nav/way_point, msg_format: geometry_msgs/msg/PointStamped, scope: adapter_only}
    - {source: /speed, target: /nav/speed, msg_format: std_msgs/msg/Float32, scope: adapter_only}
    - {source: /path, target: /nav/local_path, msg_format: nav_msgs/msg/Path, scope: adapter_only}
    - {source: /stop, target: /nav/stop, msg_format: std_msgs/msg/Bool, scope: adapter_only}
    - {source: /slow_down, target: /nav/slow_down, msg_format: std_msgs/msg/Float32, scope: adapter_only}
    - {source: /navigation_boundary, target: /nav/navigation_boundary, msg_format: geometry_msgs/msg/PolygonStamped, scope: adapter_only}
    - {source: /added_obstacles, target: /nav/added_obstacles, msg_format: sensor_msgs/msg/PointCloud2, scope: adapter_only}
    - {source: /check_obstacle, target: /nav/check_obstacle, msg_format: std_msgs/msg/Bool, scope: adapter_only}
  path_follower:
    - {source: /Odometry, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /path, target: /nav/local_path, msg_format: nav_msgs/msg/Path, scope: adapter_only}
    - {source: /cmd_vel, target: /nav/cmd_vel, msg_format: cmd_vel, scope: adapter_only}
    - {source: /planner_status, target: /nav/planner_status, msg_format: std_msgs/msg/String, scope: adapter_only}

adapter_relays:
  # Simulation bridge relays are explicit and must never be enabled on a
  # hardware ROS domain unless guarded by a hardware-safe command mux.
  cmu_unity:
    - {source: /state_estimation, target: /slam/odometry, msg_format: odometry, scope: adapter_only}
    - {source: /state_estimation_at_scan, target: /slam/state_at_scan, msg_format: state_estimation_at_scan, scope: adapter_only}
    - {source: /registered_scan, target: /slam/map_cloud, msg_format: map_cloud, scope: adapter_only}
    - {source: /terrain_map, target: /nav/terrain_map, msg_format: map_cloud, scope: adapter_only}
    - {source: /terrain_map_ext, target: /nav/terrain_map_ext, msg_format: map_cloud, scope: adapter_only}
    - {source: /nav/cmd_vel, target: /cmd_vel, msg_format: geometry_msgs/msg/TwistStamped, scope: adapter_only}

data_sources:
  # Different runtimes differ only by the source adapter at this boundary.
  # LingTu modules above the adapter consume the same canonical topics.
  in_process_stub:
    provider: in_process
    owns: [mock_odometry, mock_map, mock_commands]
    normalized_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    command_sink: module_graph_driver_cmd_vel
    source_outputs: []
    algorithm_entry_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    algorithm_context_outputs: []
    lidar_extrinsic_profile:
    slam_source: none
    localization_source: mock_or_in_process_odometry
    mapping_source: mock_or_in_process_map
  thunder:
    provider: hardware
    owns: [mid360_lidar, imu, robot_actuation]
    normalized_outputs: [/lidar/raw_frame, /imu/raw]
    command_sink: driver
    source_outputs: [/lidar/raw_frame, /imu/raw]
    algorithm_entry_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud, /slam/localization_health, /slam/localization_quality]
    algorithm_context_outputs: []
    lidar_extrinsic_profile: real_mid360
    slam_source: lingtu_fastlio_or_external_robot_slam
    localization_source: slam_localizer
    mapping_source: slam_map_cloud
  thunder_lite_local:
    provider: hardware
    owns: [robot_actuation, local_module_graph]
    normalized_outputs: []
    command_sink: driver
    source_outputs: []
    algorithm_entry_outputs: []
    algorithm_context_outputs: []
    lidar_extrinsic_profile:
    slam_source: none
    localization_source: none
    mapping_source: none
  mujoco_module_graph:
    provider: mujoco
    owns: [physics, rendered_lidar, simulated_imu_state, rgb_camera, depth_camera, simulation_actuation]
    normalized_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud, /camera/color/image_raw, /camera/depth/image_raw, /camera/color/camera_info]
    command_sink: mujoco_driver_module_cmd_vel
    source_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud, /camera/color/image_raw, /camera/depth/image_raw, /camera/color/camera_info]
    algorithm_entry_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    algorithm_context_outputs: []
    lidar_extrinsic_profile: mujoco_thunder_v3
    slam_source: none
    localization_source: mujoco_sim_odometry
    mapping_source: mujoco_rendered_lidar_map_cloud
  mujoco_fastlio2_live:
    provider: mujoco
    owns: [physics, mid360_pattern_lidar, imu]
    normalized_outputs: [/lidar/raw_frame, /imu/raw]
    command_sink: mujoco_velocity_adapter
    source_outputs: [/lidar/raw_frame, /imu/raw]
    algorithm_entry_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    algorithm_context_outputs: []
    lidar_extrinsic_profile: mujoco_thunder_v3
    slam_source: lingtu_fastlio2
    localization_source: fastlio2_odometry
    mapping_source: fastlio2_map_cloud
  gazebo_industrial:
    provider: gazebo
    owns: [world_geometry, physics, rendered_lidar, simulation_actuation]
    normalized_outputs: [/slam/odometry, /slam/state_at_scan, /slam/registered_cloud, /slam/map_cloud, /nav/exploration_grid]
    command_sink: /lingtu/gazebo/cmd_vel
    source_outputs: [/model/thunder/odometry, /lingtu/gazebo/raw/lidar_points, /lingtu/gazebo/raw/lidar_scan]
    algorithm_entry_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    algorithm_context_outputs: [/slam/state_at_scan, /nav/exploration_grid]
    lidar_extrinsic_profile: gazebo_proxy
    slam_source: none
    localization_source: gazebo_sim_odometry
    mapping_source: gazebo_lidar_derived_map
  cmu_unity_external:
    provider: cmu_unity
    owns: [world_geometry, physics, external_registered_scan, external_tare]
    normalized_outputs: [/slam/odometry, /slam/state_at_scan, /slam/registered_cloud, /slam/map_cloud, /nav/terrain_map_ext, /exploration/way_point]
    command_sink: /cmd_vel
    source_outputs: [/state_estimation, /state_estimation_at_scan, /registered_scan, /terrain_map, /terrain_map_ext, /way_point]
    algorithm_entry_outputs: [/slam/odometry, /slam/registered_cloud, /slam/map_cloud]
    algorithm_context_outputs: [/slam/state_at_scan, /nav/terrain_map_ext, /exploration/way_point]
    lidar_extrinsic_profile:
    slam_source: external_cmu_registered_scan
    localization_source: cmu_state_estimation
    mapping_source: cmu_registered_scan_and_terrain_map_ext

profile_data_sources:
  stub:
    profile: stub
    data_source: in_process_stub
    mode: framework_test
    note: ''
  dev:
    profile: dev
    data_source: in_process_stub
    mode: semantic_pipeline_test
    note: ''
  sim_nav:
    profile: sim_nav
    data_source: in_process_stub
    mode: pure_python_navigation_sim
    note: ''
  sim:
    profile: sim
    data_source: mujoco_module_graph
    mode: module_graph_simulation
    note: In-process MuJoCo profile; not the Fast-LIO raw sensor gate.
  portable_mujoco:
    profile: portable_mujoco
    data_source: mujoco_module_graph
    mode: portable_no_ros_mujoco_planning_sensor_gate
    note: Portable in-process MuJoCo kinematic planning/sensor profile; no ROS2 or Fast-LIO live adapter.
  sim_mujoco_live:
    profile: sim_mujoco_live
    data_source: mujoco_fastlio2_live
    mode: mujoco_raw_mid360_fastlio_live
    note: 'First-class raw-sensor MuJoCo path: MID-360 pattern LiDAR + IMU -> Fast-LIO -> /slam/*.'
  sim_mujoco_octo_live:
    profile: sim_mujoco_octo_live
    data_source: mujoco_fastlio2_live
    mode: mujoco_raw_mid360_fastlio_octoplanner3d_closed_loop
    note: 'OctoPlanner3D MuJoCo path: MID-360 + Fast-LIO source, OctoPlanner3D global plan, local planner/path follower, and simulated cmd_vel closure.'
  lite:
    profile: lite
    data_source: thunder_lite_local
    mode: minimal_thunder_no_ros
    note: Driver/safety/navigation shell only; no SLAM, map, semantic, ROS bridge, or external services.
product_data_sources:
  teleop:
    product: teleop
    data_source: thunder
    mode: real_robot_remote_control
    note: Operator command only; no autonomous navigation decision chain.
  teleop_avoid:
    product: teleop_avoid
    data_source: thunder
    mode: real_robot_remote_control_with_obstacle_avoidance
    note: Operator command with live SLAM, obstacle, and traversability gates; no saved map or global planning.
  map:
    product: map
    data_source: thunder
    mode: real_robot_mapping
    note: ''
  tracking:
    product: tracking
    data_source: thunder
    mode: real_robot_tracking
    note: Follow explicit map-frame goals through native planning and path following.
  nav:
    product: nav
    data_source: thunder
    mode: real_robot_saved_map_navigation
    note: ''
  inspection:
    product: inspection
    data_source: thunder
    mode: real_robot_inspection
    note: Typed multi-point inspection route execution over saved-map navigation.
  explore:
    product: explore
    data_source: thunder
    mode: real_robot_exploration
    note: ''
