# LingTu Runtime Stream Token Contract
#
# This file mirrors the canonical Python runtime contract in
# src/runtime/runtime_interface.py. Keep simulator adapters and real robot
# adapters aligned to that module; this YAML is the human-readable operations
# contract used by docs, diagnostics, and static validation. The historical
# field names still use "topic" for API compatibility, but these entries are
# canonical runtime stream tokens, not ROS2 topic names.
#
# Rules:
#   - High-level LingTu modules consume canonical runtime stream tokens.
#   - Endpoint adapters are responsible for remapping simulator or hardware
#     native streams or topics into this contract.
#   - Do not change existing stream token names without a full migration.
#   - Keep comments in English to avoid encoding drift across Windows/Linux.

sensor:
  # Raw SLAM input topics used when a runtime validates Fast-LIO from sensors.
  raw_lidar_points: /lidar/raw_frame          # sensor_msgs/PointCloud2 or Livox CustomMsg
  raw_lidar_packet: /lidar/raw_packet         # packet-level LivoxFrame diagnostics
  raw_imu: /imu/raw                      # sensor_msgs/Imu

  # Canonical post-adapter sensor topics for LingTu modules.
  lidar_scan: /lidar/raw_frame            # sensor_msgs/PointCloud2 or Livox CustomMsg
  imu: /imu/raw                          # sensor_msgs/Imu

slam:
  odom_prior: /slam/odom_prior              # optional native odometry prior for SLAM
  odometry: /slam/odometry                # nav_msgs/Odometry; canonical localization pose
  registered_cloud: /slam/registered_cloud # sensor_msgs/PointCloud2; robot/body frame
  map_observation: /slam/map_observation   # exact scan + map<-sensor pose + origin
  map_cloud: /slam/map_cloud              # sensor_msgs/PointCloud2; map/world frame
  cumulative_map_cloud: /slam/cumulative_map_cloud # simulation/debug accumulated cloud
  saved_map_cloud: /slam/saved_map_cloud  # sensor_msgs/PointCloud2; static localization map
  save_map_service: /slam/save_map        # map-save service

maps:
  activation_request: /maps/activation/request # typed exact STAGE/RESTORE/VERIFY transaction
  activation_ack: /maps/activation/ack       # request-correlated authoritative result
  state: /maps/state                    # native mapd process and data health
  live_cloud: /maps/live_cloud          # current accepted scan in map frame
  voxel_cloud: /maps/voxel_cloud          # cleaned accumulated voxel cloud
  accumulated_cloud: /maps/accumulated_cloud # bounded persistent block-grid view
  occupancy: /maps/occupancy              # map-domain occupancy product
  elevation: /maps/elevation              # map-domain elevation product
  esdf: /maps/esdf                        # map-domain distance field
  scene: /maps/scene                      # layered Gateway/Rerun scene product

driver:
  odometry: /driver/odometry              # base/driver proprioception feedback, not SLAM pose

localization:
  quality: /slam/localization_quality
  health: /slam/localization_health       # LOCKED/LOST/RECOVERED or JSON equivalent
  state_estimation_at_scan: /slam/state_at_scan
  relocalize_service: /slam/relocalize
  global_relocalize_service: /slam/global_relocalize
  global_relocalize_status_service: /slam/global_relocalize_status
  relocalize_check_service: /slam/relocalize_check

exploration:
  start: /exploration/start
  stop: /exploration/stop
  way_point: /exploration/way_point      # strategy waypoint from TARE/exploration
  exploration_grid: /nav/exploration_grid # nav_msgs/OccupancyGrid
  exploration_snapshot: /nav/exploration_snapshot # lingtu.dds.ExplorationGrid
  execution_snapshot: /nav/exploration_execution_snapshot # lingtu.dds.ExplorationExecutionGrid
  traversable_frontiers: /nav/traversable_frontiers # read-only candidate list
  frontier_candidate: /nav/frontier_candidate # read-only best candidate
  cmu_local_planner_path: /exploration/cmu_local_planner_path # optional CMU native planner path evidence
  status: /exploration/status

planning:
  global_path: /nav/global_path          # nav_msgs/Path
  far_reach_goal: /nav/far_reach_goal
  planner_status: /nav/planner_status
  adapter_status: /nav/adapter_status
  mission_status: /nav/mission_status
  navigation_state: /nav/state            # compact authoritative native nav lifecycle

autonomy:
  terrain_map: /nav/terrain_map          # sensor_msgs/PointCloud2
  terrain_map_ext: /nav/terrain_map_ext  # sensor_msgs/PointCloud2
  height_rays: /nav/height_rays          # application/json fixed-pattern terrain rays
  local_path: /nav/local_path            # nav_msgs/Path
  cmd_vel: /nav/cmd_vel                  # native lingtu.dds.FinalVelocityCommand; adapters may project TwistStamped
  stop: /nav/stop
  slow_down: /nav/slow_down
  way_point: /nav/way_point              # current execution waypoint/progress marker
  speed: /nav/speed

  # Optional control topics. Nodes must tolerate these being absent.
  map_clearing: /nav/map_clearing
  cloud_clearing: /nav/cloud_clearing
  navigation_boundary: /nav/navigation_boundary
  added_obstacles: /nav/added_obstacles
  check_obstacle: /nav/check_obstacle

control:
  nav_command_request: /nav/command/request  # typed C++ goal/cancel/teleop command
  nav_command_ack: /nav/command/ack          # native business-level ACK
  operator_motion_control: /nav/operator_motion/control # native authority claim/release/hold
  operator_motion_sample: /nav/operator_motion/sample # latest-only body-frame operator velocity intent
  operator_motion_ack: /nav/operator_motion/ack # native operator motion business ACK
  operator_motion_status: /nav/operator_motion/status # native authority/output evidence
  nav_goal_status: /nav/goal/status           # request-correlated native goal lifecycle
  exploration_command: /nav/exploration/command # typed native exploration lifecycle command
  exploration_ack: /nav/exploration/ack      # matching exploration business ACK
  exploration_run_event: /nav/exploration/run/event # immutable ordered finite-run facts
  exploration_segment_request: /nav/exploration_segment/request # identity-bound rolling-map execution request
  exploration_segment_ack: /nav/exploration_segment/ack # native segment business ACK
  exploration_segment_status: /nav/exploration_segment/status # native segment lifecycle state
  inspection_task_request: /nav/inspection/task/request # task-addressed native inspection request
  inspection_task_ack: /nav/inspection/task/ack # task-id preserving native inspection ACK
  inspection_status: /nav/inspection/status  # route and current point progress
  inspection_task_event: /nav/inspection/task/event # immutable ordered inspection task facts
  goal_pose: /nav/goal_pose              # geometry_msgs/PoseStamped
  goal_point: /nav/goal_point            # geometry_msgs/PointStamped
  patrol_goals: /nav/patrol_goals        # JSON route command
  cancel: /nav/cancel

semantic:
  detections_3d: /nav/semantic/detections_3d
  scene_graph: /nav/semantic/scene_graph
  query_service: /nav/semantic/query
  instruction: /nav/semantic/instruction
  cancel: /nav/semantic/cancel
  resolved_goal: /nav/goal_pose
  status: /nav/semantic/status
  costmap: /nav/costmap
  scg_plan_request: /nav/scg/plan_request
  scg_plan_result: /nav/scg/plan_result
  voice_response: /nav/voice/response

reconstruction:
  semantic_cloud: /nav/reconstruction/semantic_cloud
  stats: /nav/reconstruction/stats
  save_ply_service: /nav/reconstruction/save_ply

rings:
  safety_state: /nav/safety_state
  execution_eval: /nav/execution_eval
  dialogue_state: /nav/dialogue_state

services:
  map_command: /nav/map/command
  map_response: /nav/map/response
  poi_command: /nav/poi/command
  poi_response: /nav/poi/response
  patrol_command: /nav/patrol/command
  patrol_response: /nav/patrol/response
  geofence_command: /nav/geofence/command
  geofence_response: /nav/geofence/response
  schedule_command: /nav/schedule/command
  schedule_response: /nav/schedule/response
  history_query: /nav/history/query
  history_response: /nav/history/response

visualization:
  detections: /nav/detections          # visualization_msgs/MarkerArray
  robot_marker: /nav/robot_marker      # visualization_msgs/Marker
  building_cloud: /nav/building_cloud  # sensor_msgs/PointCloud2 demo/reference cloud

gnss:
  fix: /gnss/fix                       # native DDS WGS84 fix
  status: /gnss/status                 # native DDS receiver health
  odom: /gnss/odom                     # ENU odometry when a map origin is configured

required_runtime_topics:
- /slam/odometry
- /slam/registered_cloud
- /slam/map_cloud
- /nav/exploration_grid
- /nav/exploration_snapshot
- /nav/exploration_execution_snapshot
- /nav/global_path
- /nav/local_path
- /nav/terrain_map
- /nav/terrain_map_ext
- /nav/traversability
- /nav/cmd_vel
- /nav/goal_pose
required_nav_topics:
- /slam/odometry
- /slam/registered_cloud
- /slam/map_cloud
- /nav/exploration_grid
- /nav/exploration_snapshot
- /nav/exploration_execution_snapshot
- /nav/global_path
- /nav/local_path
- /nav/terrain_map
- /nav/terrain_map_ext
- /nav/traversability
- /nav/cmd_vel
- /nav/goal_pose
artifacts:
  map_pcd: map.pcd
  tomogram: tomogram.pickle
  octomap: octomap.bt
  point_cloud: map.pcd
  occupancy_grid: occupancy.npz
  metadata: metadata.json

artifact_formats:
  map_pcd:
    path: map.pcd
    artifact_type: pcd_xyz_or_xyzi
    frame_role: map
    required_fields: [x, y, z]
    required_metadata: [source_profile, data_source, slam_source, frame_id, point_count, sha256]
  tomogram:
    path: tomogram.pickle
    artifact_type: pct_tomogram
    frame_role: map
    required_fields: [tomogram, resolution, origin]
    required_metadata: [source_map_sha256, source_profile, data_source, frame_id, shape]
  octomap:
    path: octomap.bt
    artifact_type: octomap_binary_tree
    frame_role: map
    required_fields: [occupancy_tree]
    required_metadata: [source_map_sha256, source_profile, data_source, frame_id]
  point_cloud:
    path: map.pcd
    artifact_type: pcd_xyz_or_xyzi
    frame_role: map
    required_fields: [x, y, z]
    required_metadata: [source_profile, data_source, frame_id, point_count, sha256]
  occupancy_grid:
    path: occupancy.npz
    artifact_type: numpy_occupancy_grid
    frame_role: map
    required_fields: [grid, resolution, origin]
    required_metadata: [source_map_sha256, source_profile, data_source, frame_id]
  metadata:
    path: metadata.json
    artifact_type: json
    frame_role: map
    required_fields: [source_profile, data_source, slam_source, localization_source, mapping_source, frame_id, created_at, artifacts]
    required_metadata: []

tf:
  map_frame: map
  odom_frame: odom
  body_frame: body
  model_base_frame: base_link
  lidar_frame: lidar_link
  real_lidar_frame: livox_frame
  camera_frame: camera_link
  gnss_frame: gnss_antenna
  simulator_world_frame: world
  axis_convention: x_forward_y_left_z_up
  body_aliases:
    - base_link
  lidar_aliases:
    - livox_frame
  links:
    map_to_odom:
      parent: map
      child: odom
      required: true
    odom_to_body:
      parent: odom
      child: body
      required: true
    body_to_lidar:
      parent: body
      child: lidar_link
      required: true
    body_to_camera:
      parent: body
      child: camera_link
      required: true
    body_to_gnss:
      parent: body
      child: gnss_antenna
      required: false

extrinsics:
  # All entries are body -> LiDAR static transforms in metres/radians.
  # Source adapters must normalize their native sensor data through one of
  # these profiles before publishing LingTu canonical clouds.
  body_to_lidar_profiles:
    real_mid360:
      parent: body
      child: livox_frame
      x: 0.402876074867229
      y: 0.0
      z: 0.0582019450665819
      roll: -3.141592653589793
      pitch: -0.7853981633974483
      yaw: 0.0
    gazebo_proxy:
      parent: body
      child: lidar_link
      x: 0.28
      y: 0.0
      z: 0.20
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
    mujoco_thunder_v3:
      parent: body
      child: lidar_link
      x: -0.30638
      y: 0.0
      z: 0.19417
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
    portable_mid360_like:
      parent: body
      child: lidar_link
      x: 0.0
      y: 0.0
      z: 0.20
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

data_formats:
  tf_message:
    topic: /tf
    ros_type: lingtu.dds.TFMessage
    frame_role: per_transform
    required_fields: [transforms]
    note: Native frame-tree update; each transform carries its own parent and child frames.
  raw_livox_custom:
    topic: /lidar/raw_frame
    ros_type: livox_ros_driver2/msg/CustomMsg
    frame_role: lidar_or_body_raw_fastlio_input
    required_fields: [offset_time, x, y, z, reflectivity, tag, line]
  raw_timed_pointcloud2:
    topic: /lidar/raw_frame
    ros_type: sensor_msgs/msg/PointCloud2
    frame_role: lidar_or_body_raw_fastlio_input
    required_fields: [x, y, z, intensity, time, ring]
  registered_cloud:
    topic: /slam/registered_cloud
    ros_type: sensor_msgs/msg/PointCloud2
    frame_role: body
    required_fields: [x, y, z]
  map_observation:
    topic: /slam/map_observation
    ros_type: lingtu.dds.MapObservation
    frame_role: map
    required_fields: [header, observation_sequence, reset_epoch, sensor_frame, map_sensor, sensor_origin, scan, pose_confidence, localization_quality, pose_state, pose_reason]
    note: Accepted incremental scan with its exact same-timestamp map<-sensor transform. Consumers reject old epochs and non-increasing sequences.
  map_cloud:
    topic: /slam/map_cloud
    ros_type: sensor_msgs/msg/PointCloud2
    frame_role: map_or_odom
    required_fields: [x, y, z]
  lingtu.dds.Image:
    topic: /camera/color/image_raw
    ros_type: sensor_msgs/msg/Image
    frame_role: camera_link
    required_fields: [header, height, width, encoding, step, data]
    note: Native DDS camera image payload; ROS Image is compatibility only.
  lingtu.dds.CameraInfo:
    topic: /camera/color/camera_info
    ros_type: sensor_msgs/msg/CameraInfo
    frame_role: camera_link
    required_fields: [header, height, width, depth_scale, k, p]
    note: Native DDS camera calibration payload; ROS CameraInfo is compatibility only.
  lingtu.dds.GnssFix:
    topic: /gnss/fix
    ros_type: sensor_msgs/msg/NavSatFix
    frame_role: gnss_antenna
    required_fields: [header, latitude, longitude, altitude, fix_type, position_covariance]
    note: Native DDS GNSS WGS84 fix; ROS NavSatFix is compatibility only.
  lingtu.dds.GnssStatus:
    topic: /gnss/status
    ros_type: diagnostic_msgs/msg/DiagnosticStatus
    frame_role: gnss_antenna
    required_fields: [header, device, fix_type, link_ok, rtk]
    note: Native DDS GNSS receiver health; diagnostics are compatibility only.
  lingtu.dds.Imu:
    topic: /imu/raw
    ros_type: sensor_msgs/msg/Imu
    frame_role: imu
    required_fields: [header, orientation, angular_velocity, linear_acceleration]
    note: Native DDS IMU payload; ROS Imu is compatibility only.
  maps_state:
    topic: /maps/state
    ros_type: lingtu.dds.MapRuntimeState
    frame_role: map
    required_fields: [producer_boot_id, running, live, reset_epoch, observation_sequence, generation, dds_write_failures, dds_unhealthy_writers, required_publications_ready, current_generation_published, realtime_clouds_published_generation, map_layers_published_generation, scene_published_generation, voxel_snapshot_omitted_cells, voxel_capacity_rejections, accumulated_capacity_rejections, capacity_limited, dds_scene_oversize_rejections]
  map_activation_request:
    topic: /maps/activation/request
    ros_type: lingtu.dds.MapActivationRequest
    frame_role: metadata
    required_fields: [request_id, operation, target, previous, caller, reason]
  map_activation_ack:
    topic: /maps/activation/ack
    ros_type: lingtu.dds.MapActivationAck
    frame_role: metadata
    required_fields: [request_id, operation, accepted, message, changed, target, previous, active, producer_boot_id]
  maps_cloud_layer:
    topic: /maps/voxel_cloud
    ros_type: lingtu.dds.MapCloudLayer
    frame_role: map
    required_fields: [header, layer, cloud, reset_epoch, observation_sequence, generation, live]
  maps_grid:
    topic: /maps/occupancy
    ros_type: lingtu.dds.MapGrid
    frame_role: map
    required_fields: [header, layer, info, data, reset_epoch, observation_sequence, generation, live]
  maps_scene:
    topic: /maps/scene
    ros_type: lingtu.dds.MapScene
    frame_role: map
    required_fields: [header, producer_boot_id, reset_epoch, observation_sequence, generation, live, live_cloud, voxel_cloud, accumulated_cloud, occupancy, elevation, esdf]
  odometry:
    topic: /slam/odometry
    ros_type: nav_msgs/msg/Odometry
    frame_role: odom_to_body
  state_estimation_at_scan:
    topic: /slam/state_at_scan
    ros_type: nav_msgs/msg/Odometry
    frame_role: odom_to_body
  cmd_vel:
    topic: /nav/cmd_vel
    ros_type: lingtu.dds.FinalVelocityCommand
    frame_role: body
    required_fields: [header, host_boot_id, producer_boot_id, output_seq, source_wall_ns, twist]
    note: Final post-safety logical velocity envelope. Only the field driver may forward it to Brainstem; ROS adapters may explicitly project TwistStamped.
  height_rays:
    topic: /nav/height_rays
    ros_type: application/json
    frame_role: body
    required_fields: [heights, points_body, points_world, valid_mask]
  teleop_cmd_vel:
    topic: /nav/teleop_cmd_vel
    ros_type: geometry_msgs/msg/TwistStamped
    frame_role: body
    note: Operator velocity request before native safety arbitration and final command publication.
  traversability:
    topic: /nav/traversability
    ros_type: application/json
    frame_role: map_or_odom
    note: Terrain risk summary or grid; native DDS carries the grid form as lingtu.dds.OccupancyGrid.
  exploration_snapshot:
    topic: /nav/exploration_snapshot
    ros_type: lingtu.dds.ExplorationGrid
    frame_role: map
    required_fields: [header, info, data, session_id, map_id, map_version, artifact_hash, reset_epoch, generation, live]
    note: Strict trinary rolling occupancy snapshot with restart-safe map identity.
  exploration_execution_snapshot:
    topic: /nav/exploration_execution_snapshot
    ros_type: lingtu.dds.ExplorationExecutionGrid
    frame_role: map
    required_fields: [header, info, occupancy, terrain_cost, session_id, reset_epoch, generation, live, terrain_risk_stamp, terrain_risk_ready]
    note: Atomic rolling occupancy and terrain-risk execution input. Missing, stale, or inconsistent terrain risk blocks segment execution.
  local_planner_control_hint:
    topic: /nav/local_planner/control_hint
    ros_type: application/json
    frame_role: planner_status
    note: Local planner advisory output for path follower speed and stop behavior.
  lingtu.dds.Bool:
    topic: /nav/map_clearing
    ros_type: std_msgs/msg/Bool
    frame_role: unframed_control_flag
    required_fields: [data]
    note: Native DDS Bool control flag; ROS/compat adapters mirror it as std_msgs/msg/Bool.
  lingtu.dds.RelocalizationRequest:
    topic: /slam/relocalization/request
    ros_type: application/json
    frame_role: map_or_odom
    required_fields: [command, map_path, guess]
  lingtu.dds.RelocalizationResponse:
    topic: /slam/relocalization/response
    ros_type: application/json
    frame_role: map_or_odom
    required_fields: [request_id, success, state, quality]
  traversable_frontier_candidates:
    topic: /nav/traversable_frontiers
    ros_type: application/json
    frame_role: map
    required_fields: [id, centroid_3d, reachable_score, support_type, esdf_clearance_m, semantic_value, evidence_layers, reasons]
  nav_command_request:
    topic: /nav/command/request
    ros_type: lingtu.dds.NavigationCommandRequest
    frame_role: request_dependent
    required_fields: [client_id, task_id, request_id, kind]
    note: Typed C++ field command envelope. task_id is the stable logical navigation task and request_id is one delivery attempt; goal/cancel commands use a separate journal from high-rate teleop.
  nav_command_ack:
    topic: /nav/command/ack
    ros_type: lingtu.dds.NavigationCommandAck
    frame_role: map
    required_fields: [task_id, request_id, kind, accepted, reason]
    note: Endpoint business acceptance or rejection for one request attempt; this ACK is not a terminal task result.
  operator_motion_control:
    topic: /nav/operator_motion/control
    ros_type: lingtu.dds.OperatorMotionControl
    frame_role: metadata
    required_fields: [source_id, source_epoch, source_sequence, request_id, action, lease_ttl_ms, reason]
    note: Low-rate native operator motion authority control. Adapters may claim, release, or hold; the native endpoint remains the authority owner.
  operator_motion_sample:
    topic: /nav/operator_motion/sample
    ros_type: lingtu.dds.OperatorMotionSample
    frame_role: body
    required_fields: [source_id, source_epoch, source_sequence, request_id, deadman, velocity, freshness_budget_ms, source_stamp_ns]
    note: High-rate latest-only body-frame operator velocity intent. It is not final velocity until native authority, obstacle, traversability, and final safety checks publish /nav/cmd_vel.
  operator_motion_ack:
    topic: /nav/operator_motion/ack
    ros_type: lingtu.dds.OperatorMotionAck
    frame_role: metadata
    required_fields: [source_id, source_epoch, source_sequence, request_id, action, accepted, reason, accepted_sequence, final_output_sequence]
    note: Native business ACK for operator motion Claim, Hold, or Release only. Sample is best-effort intent; status carries last_sample/admitted/final sequence evidence.
  operator_motion_status:
    topic: /nav/operator_motion/status
    ros_type: lingtu.dds.OperatorMotionStatus
    frame_role: map
    required_fields: [active_source_id, active_source_epoch, has_active_authority, holding, has_active_sample, last_sample_sequence, admitted_sequence, final_output_sequence, authority_reason, input_gate_reason, teleop_output, final_cmd_vel]
    note: Native operator motion DDS evidence stream. No in-repo Python DDS reader is declared today; Gateway readiness consumes the native JSON status mirror, while external diagnostics may subscribe directly. Header is map/status-frame; teleop_output and final_cmd_vel are body-frame twists.
  nav_goal_status:
    topic: /nav/goal/status
    ros_type: lingtu.dds.NavigationGoalStatus
    frame_role: map
    required_fields: [header, boot_id, event_sequence, task_id, request_id, state, goal_epoch, reason]
    note: Native navigation task lifecycle transition. task_id remains stable across request retries; boot_id plus event_sequence provides at-least-once replay deduplication across Host restarts.
  navigation_state:
    topic: /nav/state
    ros_type: lingtu.dds.NavigationState
    frame_role: map
    required_fields: [header, boot_id, state_sequence, control_mode, lifecycle_state, active_task_id, active_request_id, goal_epoch, map_id, map_version, map_hash, planning_state, execution_state, recovery_state, progress, authority, hold_reason, failure_code]
    note: Compact authoritative navd lifecycle state; Host APIs normalize state_sequence to sequence and diagnostics remain a separate contract.
  exploration_command:
    topic: /nav/exploration/command
    ros_type: lingtu.dds.ExplorationCommandRequest
    frame_role: map
    required_fields: [request_id, exploration_run_id, kind, session_id, has_directed_target, directed_target_x, directed_target_y, directed_target_ttl_s, reason]
    note: Typed admission request for the native exploration FSM. exploration_run_id is a caller-created canonical uppercase ULID for one finite execution; request_id is only the idempotency key. Kinds 5 and 6 set and clear a directed map-frame target preference.
  exploration_ack:
    topic: /nav/exploration/ack
    ros_type: lingtu.dds.ExplorationCommandAck
    frame_role: map
    required_fields: [request_id, exploration_run_id, kind, accepted, duplicate, reason, session_id, intent_revision]
    note: Native exploration admission ACK echoing request_id and exploration_run_id. duplicate is endpoint-owned replay truth. The ACK is not lifecycle or terminal truth; intent_revision identifies an accepted directed-target intent.
  exploration_run_event:
    topic: /nav/exploration/run/event
    ros_type: lingtu.dds.ExplorationRunEvent
    frame_role: map
    required_fields: [timestamp_s, frame_id, boot_id, event_sequence, kind, exploration_run_id, start_request_id, command_request_id, product_session_id, state, route, map_id, map_version, artifact_hash, reason, motion_stop_confirmed, motion_stop_reason]
    note: Immutable ordered exploration-run fact. boot_id plus event_sequence is the ordering cursor. Paused and terminal states are authoritative only with motion_stop_confirmed=true and explicit motion_stop_reason.
  exploration_segment_request:
    topic: /nav/exploration_segment/request
    ros_type: lingtu.dds.ExplorationSegmentRequest
    frame_role: map
    required_fields: [request_id, kind, session_id, reset_epoch, minimum_generation, target, reason]
    note: TARE-only request for navd to select and validate an observed-free rolling-map prefix. It is separate from generic navigation goals.
  exploration_segment_ack:
    topic: /nav/exploration_segment/ack
    ros_type: lingtu.dds.ExplorationSegmentAck
    frame_role: map
    required_fields: [request_id, kind, accepted, session_id, reset_epoch, generation, live, reason]
    note: navd business acceptance for an identity-bound rolling-map segment.
  exploration_segment_status:
    topic: /nav/exploration_segment/status
    ros_type: lingtu.dds.ExplorationSegmentStatus
    frame_role: map
    required_fields: [request_id, state, session_id, reset_epoch, generation, live, reason]
    note: navd lifecycle state for an identity-bound rolling-map segment.
  inspection_task_request:
    topic: /nav/inspection/task/request
    ros_type: lingtu.dds.InspectionTaskRequest
    frame_role: map
    required_fields: [task_id, request_id, kind, route_id, route_revision]
    note: Product inspection lifecycle command with distinct task and request identities.
  inspection_task_ack:
    topic: /nav/inspection/task/ack
    ros_type: lingtu.dds.InspectionTaskAck
    frame_role: map
    required_fields: [task_id, request_id, kind, accepted, reason, run_id]
    note: Native inspection task admission result preserving caller task identity.
  inspection_status:
    topic: /nav/inspection/status
    ros_type: lingtu.dds.InspectionStatus
    frame_role: map
    required_fields: [run_id, route_id, state, point_index, point_count]
    note: Live status from the native C++ multi-point inspection executor.
  inspection_task_event:
    topic: /nav/inspection/task/event
    ros_type: lingtu.dds.InspectionTaskEvent
    frame_role: map
    required_fields: [boot_id, event_sequence, kind, task_id, request_id, command_request_id, state, map_id, map_version, route_id, route_revision, point_index, point_count, loop_index, retry_count, point_id, action, action_request_id, evidence_id, reason]
    note: Ordered native task fact; boot_id plus event_sequence exposes endpoint restart and event gaps.
  inspection_evidence_request:
    topic: /nav/inspection/evidence/request
    ros_type: lingtu.dds.InspectionEvidenceRequest
    frame_role: map
    required_fields: [request_id, run_id, route_id, revision, map_id, map_version, point_index, point_id, action, deadline_s]
    note: Native inspection action request consumed by the evidence worker.
  inspection_evidence_result:
    topic: /nav/inspection/evidence/result
    ros_type: lingtu.dds.InspectionEvidenceResult
    frame_role: map
    required_fields: [request_id, evidence_id, persisted, reason, analysis_verdict]
    note: Durable evidence result returned to the native inspection executor.

