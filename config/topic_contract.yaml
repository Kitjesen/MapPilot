- /slam/odometry
- /slam/registered_cloud
- /slam/map_cloud
- /nav/exploration_grid
- /nav/global_path
- /nav/local_path
- /nav/terrain_map
- /nav/terrain_map_ext
- /nav/traversability
- /nav/cmd_vel
- /nav/goal_pose
