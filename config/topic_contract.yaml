  frequency: sensor_native
  transport_policy: direct_in_process_or_endpoint_transport
- name: slam_or_relayed_localization_map
  inputs:
  - /lidar/raw_frame
  - /imu/raw
  - /lidar/raw_frame
  - /imu/raw
  - source:data_source.algorithm_entry_outputs
  outputs:
  - /slam/odometry
  - /slam/registered_cloud
  - /slam/map_cloud
  owner: slam_or_source_adapter
  frame_role: map_odom_body
  map_dependency: declared_by_data_source
  producer: SlamModule_or_SlamAdapterModule_or_compat_SlamBridgeModule
  consumers:
  - map_layers
  - navigation
  - safety
  - gateway
  frequency: odometry_50_200hz_cloud_5_20hz
  transport_policy: direct_or_shm_for_clouds_dds_for_endpoint_bridge
- name: map_layers_and_exploration
  inputs:
  - /slam/odometry
  - /slam/registered_cloud
  - /slam/map_cloud
  - /nav/exploration_grid
  - /nav/terrain_map_ext
  - module:TraversableFrontierModule.fused_cost
  - module:TraversableFrontierModule.slope_grid
  - module:TraversableFrontierModule.esdf_field
  - module:TraversableFrontierModule.elevation_map
  outputs:
  - /exploration/way_point
  - /nav/goal_pose
  - /nav/traversable_frontiers
  - /nav/frontier_candidate
  owner: maps_frontier_or_tare_adapter
  frame_role: map
  map_dependency: live_map_or_occupancy_grid
  producer: maps_modules_or_exploration_adapter
  consumers:
  - global_planning
  - gateway
  - exploration
  frequency: map_layers_1_10hz_frontier_0.5_2hz
  transport_policy: direct_default_shm_for_dense_maps_dds_for_external_exploration
- name: global_planning
  inputs:
  - /slam/odometry
  - /slam/map_cloud
  - /nav/exploration_grid
  - /exploration/way_point
  - /nav/goal_pose
  - artifact:tomogram
  - artifact:octomap
  - artifact:point_cloud
  outputs:
  - /nav/global_path
  - /nav/way_point
  owner: lingtu_navigation_or_planner_backend
  frame_role: map
  map_dependency: octoplanner3d_uses_headless_octomap_or_point_cloud;pct_uses_same_source_tomogram
  producer: NavigationModule_global_planner_service
  consumers:
  - LocalPlannerModule
  - GatewayModule
  - NAV_OUT
  frequency: on_goal_or_replan
  transport_policy: direct_default_dds_or_local_when_nav_plan_transport_enabled
- name: local_planning_and_following
  inputs:
  - /slam/odometry
  - /nav/terrain_map
  - /nav/terrain_map_ext
  - /nav/traversability
  - /nav/global_path
  - /nav/way_point
  outputs:
  - /nav/local_path
  - /nav/local_planner/control_hint
  - /nav/cmd_vel
  owner: lingtu_autonomy
  frame_role: map_odom_body_local_terrain
  map_dependency: live_terrain_maps_traversability_and_global_path
  producer: LocalPlannerModule_and_PathFollower
  consumers:
  - PathFollower
  - SafetyRing
  - CmdVelMux
  - GatewayModule
  frequency: local_plan_5_20hz_cmd_vel_20_50hz
  transport_policy: direct_default_shm_for_external_cpp_local_planner_dds_for_low_rate_path_state
- name: dynamic_obstacle_gate
  inputs:
  - /nav/added_obstacles
  - /nav/local_path
  - /nav/cmd_vel
  outputs:
  - /nav/check_obstacle
  - /nav/planner_status
  owner: local_planner_dynamic_obstacle_gate
  frame_role: odom_body_registered_cloud
  map_dependency: current_registered_cloud_and_added_obstacles
  producer: SafetyRing_or_dynamic_obstacle_gate
  consumers:
  - NavigationModule
  - CmdVelMux
  - GatewayModule
  frequency: 10_50hz
  transport_policy: direct_for_safety_path
- name: command_boundary
  inputs:
  - /nav/cmd_vel
  outputs:
  - sink:data_source.command_sink
  owner: cmd_vel_mux_to_endpoint_sink
  frame_role: body_twist
  map_dependency: none
  producer: CmdVelMux
  consumers:
  - robot_driver_or_endpoint_command_sink
  frequency: 20_50hz
  transport_policy: direct_to_driver_endpoint_transport_only_at_hardware_boundary
