# LingTu browser-camera sidecar template.
#
# Development/reference route for GStreamer 1.24, which lacks whepserversink.
# The native camera remains the only RGB-D device owner. This sidecar starts
# a color-SHM consumer when a viewer subscribes; it never opens /dev/video*.
# Install the compiled executable at the absolute path below or edit that path.
# x264enc is an explicit SOFTWARE reference, not target-board qualification.
# Use the qualified hardware factory only after checking its BSP integration.
# For native adaptive WHEP use lingtu_camera_webrtc without --output and set
# Gateway LINGTU_WEBRTC_URL=http://127.0.0.1:9090/whep/endpoint instead.

api:
  # Gateway reverse-proxies WHEP, so the go2rtc API remains private to the host.
  listen: "127.0.0.1:1984"
  origin: "*"

# WebRTC media transport. The browser must reach port 8555 over UDP or TCP.
webrtc:
  listen: ":8555"
  candidates:
    - "stun:stun.l.google.com:19302"

# Log level: debug / info / warn / error / panic / trace
log:
  level: info

# The WHEP `src` query parameter selects a stream name.
streams:
  # Fixed-rate H.264 -> go2rtc WebRTC. Encoder feedback does not control the
  # upstream encoder in this reference route.
  cam:
    - "exec:/usr/local/bin/lingtu_camera_webrtc --output - --encoder x264enc --fps 20 --start-bitrate 1500000"

# Uncomment to record to disk for debugging; paths are relative to go2rtc cwd.
# record:
#   path: /var/log/go2rtc/rec
#   segment: 60s
