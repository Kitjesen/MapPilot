# LingTu browser-camera sidecar template.
#
# The native camera service owns RGB-D acquisition. go2rtc opens the UVC RGB
# device only for the browser teleoperation feed. Device nodes and encoder
# availability are deployment-local; `#hardware` asks go2rtc/ffmpeg to use a
# supported hardware encoder when the target BSP exposes one.
#
# Discover your camera:
#   v4l2-ctl --list-devices
#   v4l2-ctl -d /dev/video0 --list-formats-ext     # supported input formats
#   ls /dev/video*
#
# Change the device in the installed `/etc/go2rtc/go2rtc.yaml`, then restart:
#   sudo systemctl restart go2rtc

api:
  # Gateway reverse-proxies WHEP, so the go2rtc API remains private to the host.
  listen: "127.0.0.1:1984"
  origin: "*"

# WebRTC media transport. The browser must be able to reach port 8555.
webrtc:
  listen: ":8555/tcp"
  candidates:
    - "stun:stun.l.google.com:19302"

# Log level: debug / info / warn / error / panic / trace
log:
  level: info

# The WHEP `src` query parameter selects a stream name.
streams:
  # Primary RGB teleoperation feed: MJPEG input, H.264 output.
  cam:
    - "ffmpeg:device?video=/dev/video0&input_format=mjpeg&video_size=1280x720&framerate=30#video=h264#hardware"

  # Optional second stream — same device but 640x480 for constrained
  # uplinks.  Uncomment and select with ?src=cam_lq in the browser.
  # cam_lq:
  #   - "ffmpeg:device?video=/dev/video0&input_format=mjpeg&video_size=640x480&framerate=30#video=h264#hardware"

# Uncomment to record to disk for debugging; paths are relative to go2rtc cwd.
# record:
#   path: /var/log/go2rtc/rec
#   segment: 60s
