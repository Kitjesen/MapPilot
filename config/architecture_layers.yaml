schema_version: lingtu.architecture_layers.v1
description: >
  Canonical folder ownership and import-boundary contract for LingTu.
  Layers describe where a seam belongs; import_boundaries
  define the static guards enforced by tools/validate/validate_architecture_boundaries.py.

layers:
  - id: L0_core_contract
    title: Runtime Contract
    intent: Module, Blueprint, typed ports, registry, runtime messages, and local transport contracts.
    owns:
      - src/runtime/
      - src/runtime/module.py
      - src/runtime/blueprint.py
      - src/runtime/stream.py
      - src/runtime/registry.py
      - src/runtime/msgs/
      - src/message/
      - src/runtime/contracts/
      - src/runtime/transport/
      - src/runtime/utils/
      - src/runtime/clock.py
      - src/runtime/config.py
      - src/runtime/yaml_helpers.py

  - id: L1_runtime_model
    title: Runtime Model
    intent: Frame/topic/communication contracts and runtime policies.
    owns:
      - src/runtime/runtime_interface.py
      - src/runtime/runtime_policy.py
      - src/diagnostics/
      - src/diagnostics/field/gates.py
      - src/diagnostics/field/evidence.py
      - src/runtime/algorithm_gates.py
      - src/runtime/backend_status.py
      - src/diagnostics/field/field_check.py
      - src/diagnostics/field/gateway_acceptance.py
      - src/diagnostics/field/inspection.py
      - config/devices.yaml
      - config/robots/

  - id: L2_product_composition
    title: Product Composition
    intent: Product declarations, immutable RunPlan compilation, and Host assembly choose what runs without owning process side effects.
    owns:
      - src/lingtu/assembly/
      - src/lingtu/run_plan.py
      - src/lingtu/products.py
      - src/lingtu/assembly/parameters.py

  - id: L3_adapter_layer
    title: Adapter Layer
    intent: Native DDS, simulator, replay, runtime shims, and external protocol conversion.
    owns:
      - src/runtime/adapters/
      - src/nav/adapters/
      - src/localization/adapters/
      - src/lingtu/assembly/host_bus.py

  - id: L4_capability_modules
    title: Capability Modules
    intent: Robot capabilities implemented as normal Modules, without direct external protocol ownership.
    owns:
      - src/nav/
      - src/drivers/
      - src/gateway/
      - src/perception/
      - src/decision/
      - src/memory/
      - src/localization/
      - src/explore/
      - src/maps/
      - src/lingtu/__init__.py
      - src/lingtu/README.md
      - tests/lingtu/

  - id: L5_algorithm_kernels
    title: Algorithm Kernels
    intent: Hot-path algorithm implementations and future Rust/FFI/native kernels, kept below Module adapters.
    owns:
      - src/kernels/
      - src/native/
      - src/explore/cpp/
      - src/nav/cpp/
      - src/nav/cpp/planning/local/cmu/paths/

  - id: L6_cli_deploy
    title: Product Control And Deploy
    intent: ProductControl side effects, internal systemd execution, command-line lifecycle, packaging, validation, and deployment.
    owns:
      - scripts/
      - tools/
      - pyproject.toml
      - src/lingtu/assembly/plugins.py
      - src/lingtu/control.py
      - src/lingtu/operator_drive.py
      - src/lingtu/product_lock.py
      - src/lingtu/real/
      - src/lingtu/switch_contracts.py
      - src/lingtu/sim/
      - src/lingtu/sdk/

import_boundaries:
  package_forbidden_roots:
    gateway: [nav, perception, decision, drivers, slam]
    nav: [perception, decision, drivers, gateway]
    perception: [nav, decision, drivers, gateway]
    decision: [nav, drivers, gateway, localization]
    drivers: [nav, perception, decision, gateway]
    maps: [nav, perception, decision, drivers, gateway]
    runtime:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - slam
      - memory
      - lingtu
    slam:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - memory
      - lingtu
    memory:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - slam
      - lingtu
    lingtu:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - slam
      - memory
  composition_exceptions:
    - lingtu/assembly/
    - lingtu/assembly/host_bus.py
    - diagnostics/field/gateway_acceptance.py
    - runtime/msgs/scene.py
    - diagnostics/field/field_check.py
    - gateway/routes/maps.py
  hardware_compat_forbidden_import_roots:
    - runtime.adapters.ros2
  hardware_compat_forbidden_dirs:
    - src/drivers/
  core_compat_forbidden_import_roots:
    - runtime.adapters.ros2
  core_compat_forbidden_dirs:
    - src/runtime/
