schema_version: lingtu.architecture_layers.v1
description: >
  Canonical folder ownership and import-boundary contract for the Thunder
  decoupling work. Layers describe where a seam belongs; import_boundaries
  define the static guards enforced by tools/validate/validate_architecture_boundaries.py.

layers:
  - id: L0_core_contract
    title: Runtime Contract
    intent: Module, Blueprint, typed ports, registry, runtime messages, and local transport contracts.
    owns:
      - src/runtime/
      - src/runtime/module.py
      - src/runtime/blueprint.py
      - src/runtime/stream.py
      - src/runtime/registry.py
      - src/runtime/msgs/
      - src/message/
      - src/runtime/contracts/
      - src/runtime/transport/
      - src/runtime/utils/
      - src/runtime/clock.py
      - src/runtime/config.py
      - src/runtime/config_loader.py
      - src/runtime/yaml_helpers.py

  - id: L1_runtime_model
    title: Runtime Model
    intent: Product profiles, robot presets, runtime endpoints, run specs, frame/topic contracts, and runtime policies.
    owns:
      - src/runtime/profiles/
      - src/runtime/runtime_interface.py
      - src/runtime/runtime_policy.py
      - src/runtime/runtime_profiles.py
      - src/runtime/runtime_switch.py
      - src/diagnostics/
      - src/diagnostics/field/gates.py
      - src/diagnostics/field/evidence.py
      - src/runtime/algorithm_gates.py
      - src/runtime/backend_status.py
      - src/diagnostics/field/field_check.py
      - src/diagnostics/field/gateway_acceptance.py
      - src/diagnostics/field/inspection.py
      - config/topic_contract.yaml
      - config/endpoints.yaml
      - config/devices.yaml
      - config/robot_config.yaml
      - config/robots/

  - id: L2_product_composition
    title: Product Composition
    intent: LingTu product assembly only chooses which Modules run and how they are wired.
    owns:
      - src/lingtu/assembly/
      - src/drivers/real/thunder/blueprints.py

  - id: L3_adapter_layer
    title: Adapter Layer
    intent: Native DDS, simulator, replay, runtime shims, and external protocol conversion.
    owns:
      - src/runtime/adapters/
      - src/external_adapters/
      - src/nav/adapters/
      - src/localization/adapters/
      - src/maps/adapters/
      - src/gateway/rerun_bridge_module.py

  - id: L4_capability_modules
    title: Capability Modules
    intent: Robot capabilities implemented as normal Modules, without direct external protocol ownership.
    owns:
      - src/nav/
      - src/drivers/
      - src/gateway/
      - src/perception/
      - src/decision/
      - src/memory/
      - src/localization/
      - src/explore/
      - src/maps/
      - src/lingtu/__init__.py
      - src/lingtu/README.md
      - src/lingtu/robot.py
      - src/lingtu/runtime.py
      - src/lingtu/tests/
      - src/nav/local/
      - src/nav/exploration/

  - id: L5_algorithm_kernels
    title: Algorithm Kernels
    intent: Hot-path algorithm implementations and future Rust/FFI/native kernels, kept below Module adapters.
    owns:
      - src/kernels/
      - src/native/
      - src/nav/kernel/
      - src/nav/cpp/
      - src/nav/local/paths/
      - src/nav/services/plan/

  - id: L6_cli_deploy
    title: CLI And Deploy
    intent: Command-line lifecycle, packaging, validation tools, deployment scripts, and runtime bootstrap.
    owns:
      - lingtu.py
      - cli/
      - scripts/
      - tools/
      - requirements-lite.txt
      - pyproject.toml
      - config/thunder_lite_package.yaml
      - src/lingtu/plugin_seed.py
      - src/lingtu/launcher.py
      - src/lingtu/control.py
      - src/lingtu/sdk/

import_boundaries:
  package_forbidden_roots:
    gateway: [nav, perception, decision, drivers, slam]
    nav: [perception, decision, drivers, gateway]
    perception: [nav, decision, drivers, gateway]
    decision: [nav, drivers, gateway, localization]
    drivers: [nav, perception, decision, gateway]
    maps: [nav, perception, decision, drivers, gateway]
    runtime:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - slam
      - memory
      - lingtu
    slam:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - memory
      - lingtu
    memory:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - slam
      - lingtu
    lingtu:
      - nav
      - perception
      - decision
      - drivers
      - gateway
      - slam
      - memory
  composition_exceptions:
    - lingtu/assembly/
    - diagnostics/field/gateway_acceptance.py
    - runtime/msgs/scene.py
    - diagnostics/field/field_check.py
    - gateway/routes/maps.py
    - nav/services/plan/global_planner/algorithm/pct/vendor/pct_planner/launch/system_launch.py
    - nav/services/plan/global_planner/algorithm/pct/vendor/pct_planner/planner/lib/3rdparty/
  hardware_compat_forbidden_import_roots:
    - runtime.adapters.ros2
  hardware_compat_forbidden_dirs:
    - src/drivers/
  core_compat_forbidden_import_roots:
    - runtime.adapters.ros2
  core_compat_forbidden_dirs:
    - src/runtime/
