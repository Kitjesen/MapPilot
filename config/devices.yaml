# LingTu device registry: physical hardware inventory.
#
# This file describes supported hardware assets and discovery metadata. The
# camera record is also the native camera service's startup input. Other device
# endpoints come from the selected RobotConfig and RunPlan; editing an inventory
# record here does not rewire Product dataflow.

version: 1

devices:
  # GNSS
  - id: wtrtk980_main
    type: gnss
    enabled: true
    driver: wtrtk980_native
    description: "WitMotion WTRTK-980 RTK GNSS"
    udev_match:
      vendor_id: "1a86"
      product_id: "7523"
      port_path: "3-1"
    serial:
      device: /dev/wtrtk980
      baud: 115200
    capabilities: [position, velocity]

  # LiDAR
  - id: livox_mid360_main
    type: lidar
    enabled: true
    driver: livox_sdk2
    description: "Livox MID-360 360-degree 3D LiDAR"
    network:
      ip: "192.168.123.20"
      port: 56100
    capabilities: [pointcloud, imu]

  # Camera
  - id: orbbec_gemini335_main
    type: camera
    enabled: true
    driver: orbbec_native
    description: "Orbbec Gemini 335 RGB-D Camera"
    udev_match:
      vendor_id: "2bc5"
      product_id: "0800"
    config:
      sdk_config_path: ""
      serial_number: ""
      uid: ""
      product_id: "0x0800"
      device_index: 0
      connect_timeout_ms: 10000
      color:
        width: 640
        height: 480
        fps: 30
      depth:
        width: 640
        height: 480
        fps: 30
      enable_frame_sync: false
      frame_id: camera_link
    capabilities: [color, depth, intrinsics]

  # Optional Go2 RGB-D accessory; enable only after USB discovery and calibration.
  - id: realsense_d435i_main
    type: camera
    enabled: false
    driver: realsense_native
    description: "Intel RealSense D435i RGB-D Camera"
    config:
      serial_number: ""
      color: {width: 640, height: 480, fps: 30}
      depth: {width: 640, height: 480, fps: 30}
      frame_id: camera_link
    capabilities: [color, depth, intrinsics]

  # Motor controller
  - id: brainstem_main
    type: motor_controller
    enabled: true
    driver: brainstem_grpc
    description: "Brainstem quadruped motion controller"
    network:
      host: "127.0.0.1"
      port: 13145
    capabilities: [walk, stand, sit, listen_imu, listen_joint]

  # PCAN-USB (CAN bus)
  - id: pcan_main
    type: can_bus
    enabled: false
    driver: pcan_native
    description: "PEAK PCAN-USB to motor CAN bus"
    udev_match:
      vendor_id: "0c72"
      product_id: "000c"
    note: "Brainstem internal exclusive bus; not part of LingTu Module dataflow"
