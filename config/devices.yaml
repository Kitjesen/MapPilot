# LingTu device registry: physical hardware inventory.
#
# This file describes hardware assets and low-rate discovery/status metadata.
# It must not decide runtime sensor wiring. Camera images, LiDAR point clouds,
# IMU samples, and GNSS fixes are owned by the camera/lidar/imu/gnss roles.
#
# The hw role may use this inventory for discovery, status, hotplug, open, and
# close operations. Product profiles decide dataflow through explicit runtime
# roles and service catalog entries, not through this file.

version: 1

devices:
  # GNSS
  - id: wtrtk980_main
    type: gnss
    enabled: true
    driver: serial_nmea0183  # inventory probe only; product dataflow is C++ gnss
    description: "WitMotion WTRTK-980 RTK GNSS"
    udev_match:
      vendor_id: "1a86"
      product_id: "7523"
      port_path: "3-1"
    serial:
      device: /dev/wtrtk980
      baud: 115200
    capabilities: [position, velocity]

  # LiDAR
  - id: livox_mid360_main
    type: lidar
    enabled: true
    driver: livox_sdk2
    description: "Livox MID-360 360-degree 3D LiDAR"
    network:
      ip: "192.168.1.178"
      port: 56100
    capabilities: [pointcloud, imu]

  # Camera
  - id: orbbec_gemini335_main
    type: camera
    enabled: true
    driver: orbbec_native
    description: "Orbbec Gemini 335 RGB-D Camera"
    udev_match:
      vendor_id: "2bc5"
      product_id: "0800"
    config:
      sdk_config_path: ""
      serial_number: ""
      uid: ""
      product_id: "0x0800"
      device_index: 0
      connect_timeout_ms: 10000
      color:
        width: 640
        height: 480
        fps: 30
      depth:
        width: 640
        height: 480
        fps: 30
      enable_frame_sync: false
      frame_id: camera_link
    capabilities: [color, depth, intrinsics]

  # Motor controller
  - id: brainstem_main
    type: motor_controller
    enabled: true
    driver: brainstem_grpc
    description: "Brainstem quadruped motion controller"
    network:
      host: "127.0.0.1"
      port: 13145
    capabilities: [walk, stand, sit, listen_imu, listen_joint]

  # PCAN-USB (CAN bus)
  - id: pcan_main
    type: can_bus
    enabled: false
    driver: pcan_native
    description: "PEAK PCAN-USB to motor CAN bus"
    udev_match:
      vendor_id: "0c72"
      product_id: "000c"
    note: "Brainstem internal exclusive bus; not part of LingTu Module dataflow"
