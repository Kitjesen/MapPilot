[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingtu"
version = "2.3.0"
description = "LingTu autonomous navigation for quadruped robots"
requires-python = ">=3.10"
dependencies = [
    # Core (always needed)
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# ONNX Runtime 1.24.x has no CPython 3.10 wheels, while the product still
# supports Python 3.10 and the ThunderV4 MuJoCo policy is an ONNX model.
sim-mujoco = [
    "mujoco>=3.2",
    "mujoco-lidar==0.3.3",
    "onnxruntime>=1.17,<1.24; python_version == '3.10'",
    "onnxruntime>=1.24; python_version >= '3.11'",
]
gateway = ["fastapi", "uvicorn", "websockets"]
vision = ["opencv-python-headless>=4.5"]
ml = ["scikit-learn>=1.0"]
llm = ["openai>=1.0", "anthropic"]
nlp = ["jieba>=0.42"]
agent = ["langchain-core>=0.2", "langchain-openai>=0.1", "langchain>=0.2"]
perception = ["torch", "ultralytics", "open-clip-torch"]
vector = ["chromadb"]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff", "mypy", "fastapi", "uvicorn", "websockets"]
# ThunderDriver requires brainstem gRPC contract package brainstem_api (v2.0.0).
# Install on a real robot target: pip install -e '.[thunder]'
# stub / sim mode does not need this.
thunder = ["brainstem-api @ git+https://github.com/Kitjesen/brainstem_api.git@v2.0.0#subdirectory=python"]
all = ["lingtu[gateway,vision,ml,llm,nlp,agent,perception,vector]"]

[project.scripts]
lingtu = "lingtu.control:main"
lingtu-drive = "lingtu.operator_drive:main"
lingtu-sdk = "lingtu.sdk.cli:main"

[tool.uv]
# brainstem-api v2.0.0 metadata currently declares Python >=3.13, while the
# Thunder runtime is Python 3.10.12. Keep the package locked for thunder deploys
# and override only the resolver metadata uv needs for Python 3.10 locks.
[[tool.uv.dependency-metadata]]
name = "brainstem-api"
version = "2.0.0"
requires-python = ">=3.10"
requires-dist = [
    "grpcio>=1.76.0,<2.0.0",
    "protobuf==6.33.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "runtime*",
    "drivers*",
    "diagnostics*",
    "explore*",
    "gateway*",
    "kernels*",
    "lingtu*",
    "memory*",
    "nav*",
    "perception*",
    "decision*",
    "localization*",
    "maps*",
    "message*",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
exclude = ["**/legacy/*"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "D101",  # pydocstyle: missing docstring in public class
    "D102",  # pydocstyle: missing docstring in public method
    "D103",  # pydocstyle: missing docstring in public function
    "S",     # flake8-bandit: security lints
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg (common in Module __init__)
    "B905",  # zip strict (py310 compat)
    "E402",  # module level import not at top (sys.path manipulation)
    "F401",  # unused import (re-exports in __init__.py)
    "F811",  # redefinition of unused name (test fixtures)
    "RUF001",  # ambiguous unicode in string (Chinese chars, legacy code)
    "RUF002",  # ambiguous unicode in docstring (Chinese chars, legacy code)
    "RUF003",  # ambiguous unicode in comment (Chinese chars, legacy code)
    "UP035",   # deprecated typing imports, too many to fix at once
    "UP031",   # printf-string-formatting (legacy %s style, migrate gradually)
    "E741",    # ambiguous variable name (l, I, O), common in math code
    "RUF012",  # mutable class default (Module ports use this pattern intentionally)
    "F403",    # undefined-local-with-import-star (legacy ROS2-style wildcard imports)
    "B027",    # empty-method-without-abstract-decorator (Module lifecycle stubs)
    "RUF046",  # unnecessary-cast-to-int (explicit int() for clarity in grid math)
]

[tool.ruff.lint.isort]
known-first-party = [
    "runtime",
    "drivers",
    "diagnostics",
    "explore",
    "gateway",
    "kernels",
    "lingtu",
    "maps",
    "memory",
    "message",
    "nav",
    "perception",
    "decision",
    "localization",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/runtime/tests/*" = ["F811", "E402", "D", "S101"]
"src/perception/*/test*" = ["F811", "E402", "D"]
"src/decision/*/test*" = ["F811", "E402", "D"]
"src/decision/tests/*" = ["S101"]
"src/*/tests/*" = ["D", "E402", "S101"]
"sim/tests/*" = ["D"]
"scripts/*" = ["D"]
"third_party/*" = ["D", "B", "S"]
"tools/calibration/**" = ["D", "W191", "E731", "F821"]
"docs/**" = ["E702", "E701"]
# E501 in test files with embedded shell scripts or \uXXXX docstrings
"src/runtime/tests/test_deployment_service_contracts.py" = ["E501"]
"src/decision/tests/test_fast_slow_benchmark.py" = ["E501"]
"src/decision/tests/test_fast_slow_efficiency.py" = ["E501"]
"src/decision/tasking/task_rules.py" = ["E501"]
"src/decision/llm/prompt_templates.py" = ["E501"]
"src/runtime/msgs/scene.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual adoption
ignore_missing_imports = true   # many deps lack stubs
exclude = ["third_party/", "research/"]

[tool.pytest.ini_options]
addopts = "-p no:anyio"
cache_dir = "build/pytest-cache"
testpaths = [
    "tests/contracts",
    "src/runtime/tests",
    "src/nav/tests",
    "src/gateway/tests",
    "tests/drivers",
    "src/lingtu/tests",
    "src/lingtu/real/tests",
    "src/lingtu/sim/tests",
    "src/lingtu/assembly/tests",
    "src/lingtu/sdk/tests",
    "src/memory/tests",
    "sim/tests",
    "tools/simstudio/tests",
    "src/localization/tests",
    "src/perception/tests",
    "src/decision/tests",
]
# tests/ contains default contracts plus root-level integration tests run separately:
#   python -m pytest tests/ -q
norecursedirs = [
    "third_party",
    "research",
    ".venv",
    "venv",
    ".omc",
    "artifacts",
    "build",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests that take >5 seconds",
    "sim: tests that require MuJoCo simulation",
]
