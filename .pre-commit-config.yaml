repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # ROS/OpenCV calibration packages use `%YAML:1.0`, which PyYAML's
        # generic checker does not accept even though the tools consume it.
        exclude: ^calibration/camera_lidar/(mlcc|livox_camera_calib|livox_calib_standalone)/
      - id: check-added-large-files
        args: [--maxkb=10000]
