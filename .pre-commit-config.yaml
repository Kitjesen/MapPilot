repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
        exclude: >-
          ^tools/calibration/(camera_lidar/(direct_visual_lidar_calibration|livox_calib_standalone|livox_camera_calib|livox_camera_lidar_calibration|mlcc)|imu/allan_variance_ros2|lidar_imu/LiDAR_IMU_Init)/
      - id: ruff-format
        exclude: >-
          ^tools/calibration/(camera_lidar/(direct_visual_lidar_calibration|livox_calib_standalone|livox_camera_calib|livox_camera_lidar_calibration|mlcc)|imu/allan_variance_ros2|lidar_imu/LiDAR_IMU_Init)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # ROS/OpenCV calibration packages use `%YAML:1.0`, which PyYAML's
        # generic checker does not accept even though the tools consume it.
        exclude: ^tools/calibration/camera_lidar/(mlcc|livox_camera_calib|livox_calib_standalone)/
      - id: check-added-large-files
        args: [--maxkb=10000]
