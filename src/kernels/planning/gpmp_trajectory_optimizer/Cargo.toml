[package]
name = "lingtu_gpmp_trajectory_optimizer"
version = "0.1.0"
edition = "2021"
description = "Portable LingTu GPMP trajectory optimizer math kernel"
license = "Proprietary"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []

[dependencies]
faer = "0.24"
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
