schema_version: lingtu.runtime_graph.topics.v2
topics:
  cumulative_map_cloud:
    topic: /slam/cumulative_map_cloud
    transport: dds
    dds_topic: rt/slam/cumulative_map_cloud
    message_type: lingtu.dds.PointCloud2
    qos_profile: LidarPointcloud
    cpp_name: kSlamCumulativeMapCloud
    role: online_whole_map_preview
    native_contract: true
    frame: map
    producer: native_slam_runtime
    consumers: [gateway, diagnostics]
    semantics: complete_sampled_snapshot_replaces_previous_revision_not_collision_map
    port_bindings:
    - owner: native_slam_runtime
      port: cumulative_map_cloud
      direction: out
      boundary: endpoint
