# Simulation MID-360 LTLIO long-run tuning profile.
#
# Do NOT lower max_update_velocity_mps: IESKF rejects the whole LiDAR update when
# |v| exceeds the cap and reverts to IMU prediction, which can diverge on long
# box_explore turn segments. This variant only tightens per-scan pose/velocity
# deltas and ZUPT while keeping the absolute velocity cap at 3.0 m/s.
#
# Do not deploy this simulation profile to physical robot hardware.

imu_topic: /imu/raw
lidar_topic: /lidar/raw_frame
body_frame: body
world_frame: odom

print_time_cost: false

lidar_type: 1
scan_line: 4
timestamp_unit: 3

acc_scale: 9.80665
time_diff_lidar_to_imu: 0.0
max_imu_gap_s: 0.25

odom_prior_enabled: false
odom_prior_max_age_s: 0.20
odom_prior_map_resolution: 0.20
odom_prior_snap_translation_m: 0.25

lidar_filter_num: 2
lidar_min_range: 0.5
lidar_max_range: 20.0
scan_resolution: 0.25
map_resolution: 0.2

cube_len: 1000
det_range: 30
move_thresh: 1.0

max_map_points: 1000000
stationary_thresh: 0.08

imu_init_num: 20
near_search_num: 5
ieskf_max_iter: 5
max_update_translation_m: 0.25
max_update_rotation_rad: 0.30
max_update_velocity_mps: 3.0
max_update_velocity_delta_mps: 0.25

r_il: [0.7071067812, 0.0, 0.7071067812, 0.0, -1.0, 0.0, 0.7071067812, 0.0, -0.7071067812]
t_il: [0.402876074867229, 0.0, 0.0582019450665819]

lidar_cov_inv: 1000.0

imu_static_acc_thresh: 0.18
imu_static_gyro_thresh: 0.025
zupt_min_static_frames: 6
zupt_sigma_v: 0.012

