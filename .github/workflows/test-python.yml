name: Python Tests + Lint

on:
  push:
    branches: [main]
    paths: ['src/**', 'docs/**', 'config/**', 'sim/**', 'tools/**', 'tests/**', 'scripts/**', 'docker/**', 'AGENTS.md', 'README.md', '.pre-commit-config.yaml', 'pyproject.toml', 'uv.lock', '.github/workflows/test-python.yml']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python correctness lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.15.17"
      - name: Run Ruff
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          src/
          tests/
          sim/
          tools/
          scripts/

  test:
    name: Framework Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.10.12"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.10 --extra dev --extra sim-recording --extra nlp --extra agent --extra llm
      - name: Run framework tests
        run: xvfb-run -a uv run --locked --no-sync python -m pytest tests/ -q --tb=short --basetemp=/tmp/lt
        env:
          PYTHONPATH: src
          LIBGL_ALWAYS_SOFTWARE: '1'

  windows-toolchain:
    name: Windows toolchain contracts
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.10.12"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.10 --extra dev
      - name: Run Windows toolchain tests
        run: >-
          uv run --locked --no-sync python -m pytest -q --tb=short
          tests/sim/test_ue_build_preflight.py
          tests/sim/test_ue_build_runner.py
          tests/sim/test_windows_distribution.py
          tests/localization/test_cyclonedds_windows_stage.py
          tests/sim/test_recording_qualification.py
          tests/sim/test_e2e_qualification_record.py
          tests/sim/test_robotsimue_skeleton.py
        env:
          PYTHONPATH: src
