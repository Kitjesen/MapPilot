name: Python Tests + Lint

on:
  push:
    branches: [main]
    paths: ['src/**', 'cli/**', 'docs/**', 'calibration/**', 'pyproject.toml', '.github/workflows/test-python.yml']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Ruff Lint + Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            src
            cli
            docs
            calibration
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: astral-sh/ruff-action@v3
        with:
          args: check src/ cli/ docs/ calibration/

  test:
    name: Framework Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            src
            cli
            config
            sim
            calibration
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run framework tests
        run: |
          python -m pytest src/runtime/tests/ src/drivers/tests/ src/gateway/tests/ \
            src/memory/tests/ src/nav/tests/ src/perception/tests/ \
            src/decision/tests/ src/localization/tests/ \
            -q --tb=short
        env:
          PYTHONPATH: src
