name: Python Tests + Lint

on:
  push:
    branches: [main]
    paths: ['src/**', 'docs/**', 'config/**', 'sim/**', 'tools/**', 'tests/**', 'scripts/**', 'AGENTS.md', 'README.md', '.pre-commit-config.yaml', 'pyproject.toml', '.github/workflows/test-python.yml']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            src
            tests
            docs
            tools/calibration
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
          src: >-
            src/
            tests/
            docs/
            tools/calibration/
          version: "0.15.17"

  test:
    name: Framework Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            src
            config
            sim
            tests
            tools
            scripts
            .github/workflows
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,sim-mujoco]'
      - name: Run framework tests
        run: python -m pytest tests/ -q --tb=short
        env:
          PYTHONPATH: src
