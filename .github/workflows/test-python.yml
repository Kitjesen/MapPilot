name: Python Tests + Lint

on:
  push:
    branches: [main]
    paths: ['src/**', 'docs/**', 'config/**', 'sim/**', 'tools/**', 'tests/**', 'scripts/**', 'AGENTS.md', 'README.md', '.pre-commit-config.yaml', 'pyproject.toml', '.github/workflows/test-python.yml']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Python correctness lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.15.17"
      - name: Run Ruff
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          src/
          tests/
          sim/
          tools/
          scripts/

  test:
    name: Framework Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,sim-mujoco,nlp]'
      - name: Run framework tests
        run: python -m pytest tests/ -q --tb=short
        env:
          PYTHONPATH: src
