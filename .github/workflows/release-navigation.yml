name: Release LingTu Native Runtime

# Builds the tracked typed-DDS runtime components on a native aarch64 runner.
# Packaging never activates services or changes machine configuration.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v2.1.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (Markdown)'
        required: false
        default: 'LingTu native runtime update'
        type: string
      prerelease:
        description: 'Pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish aarch64 native release
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      CMAKE_BUILD_TYPE: Release
      LINGTU_BUILD_JOBS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Configure stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine release metadata
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_NOTES: ${{ inputs.release_notes }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION}"
            PRERELEASE="${DISPATCH_PRERELEASE}"
            printf '%s\n' "${DISPATCH_NOTES}" > release-notes.md
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
            printf 'LingTu native runtime %s release\n' "${VERSION}" > release-notes.md
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 2
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Synchronize repository version
        run: |
          printf '%s\n' "${{ steps.version.outputs.version_clean }}" > VERSION
          bash tools/release/sync_versions.sh

      - name: Verify native aarch64 runner
        run: |
          test "$(dpkg --print-architecture)" = "arm64"
          test "$(uname -m)" = "aarch64"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            cmake \
            cyclonedds-dev \
            cyclonedds-tools \
            libeigen3-dev \
            libgrpc++-dev \
            libgtest-dev \
            liboctomap-dev \
            libpcl-dev \
            libprotobuf-dev \
            libyaml-cpp-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc \
            python3 \
            python3-cryptography \
            rsync

      - name: Test native release packager
        run: bash scripts/deploy/package_native_release.sh --self-test

      - name: Build native product artifacts
        run: make build PYTHON=python3

      - name: Package signed native release
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          KEY_FILE=""
          cleanup_key() {
            if [[ -n "${KEY_FILE}" ]]; then
              rm -f -- "${KEY_FILE}"
            fi
          }
          trap cleanup_key EXIT
          if [[ -n "${OTA_PRIVATE_KEY}" ]]; then
            KEY_FILE="${RUNNER_TEMP}/lingtu-native-release-key.pem"
            printf '%s\n' "${OTA_PRIVATE_KEY}" > "${KEY_FILE}"
            chmod 0600 "${KEY_FILE}"
            export LINGTU_NATIVE_RELEASE_SIGNING_KEY="${KEY_FILE}"
          fi
          LINGTU_NATIVE_RELEASE_ARCH=aarch64 \
            bash scripts/deploy/package_native_release.sh \
              "${{ steps.version.outputs.version }}" dist

      - name: Verify release artifacts
        run: |
          TARBALL=$(find dist -maxdepth 1 -type f \
            -name '*-aarch64-native-release.tar.gz' -print -quit)
          MANIFEST=$(find dist -maxdepth 1 -type f \
            -name '*-aarch64-native-release-manifest.json' -print -quit)
          test -n "${TARBALL}"
          test -n "${MANIFEST}"
          (
            cd dist
            sha256sum -c "$(basename "${TARBALL%.tar.gz}.sha256")"
          )
          python3 -m json.tool "${MANIFEST}" >/dev/null
          SIZE_MB=$(du -m "${TARBALL}" | awk '{print $1}')
          echo "Artifact: ${TARBALL} -- ${SIZE_MB} MB"
          if [[ "${SIZE_MB}" -gt 500 ]]; then
            echo "Native release exceeds the 500 MB limit" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "LingTu Native Release ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: dist/*native-release*
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload native release to OTA server
        env:
          OTA_SERVER_URL: ${{ secrets.OTA_SERVER_URL }}
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
        run: |
          if [[ -z "${OTA_SERVER_URL}" || -z "${OTA_API_KEY}" ]]; then
            echo "OTA server credentials are not configured; skipping upload"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CLEAN="${VERSION#v}"
          TARBALL=$(find dist -maxdepth 1 -type f \
            -name '*-aarch64-native-release.tar.gz' -print -quit)
          test -n "${TARBALL}"

          UPLOAD_RESPONSE=$(curl -sf \
            -H "X-API-Key: ${OTA_API_KEY}" \
            -F "name=navigation-native-release" \
            -F "version=${VERSION_CLEAN}" \
            -F "changelog=<release-notes.md" \
            -F "auto_sign=true" \
            -F "file=@${TARBALL}" \
            "${OTA_SERVER_URL}/packages/upload")
          PACKAGE_ID_JSON=$(printf '%s' "${UPLOAD_RESPONSE}" | \
            python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['id']))")

          curl -sf \
            -H "X-API-Key: ${OTA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"${VERSION_CLEAN}\", \"channel\": \"stable\", \"package_ids\": [${PACKAGE_ID_JSON}], \"rollout_percent\": 10, \"target_product\": \"LINGTU-NAV\"}" \
            "${OTA_SERVER_URL}/releases"

          echo "Published native release ${VERSION_CLEAN} with a 10% rollout"
