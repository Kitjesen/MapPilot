name: Release Navigation Package

# Automatic navigation package build and release.
# Trigger:
#   1. Push v* tag (e.g., v1.0.0)
#   2. Manual trigger (workflow_dispatch)
#
# Artifacts:
#   - navigation-<version>-aarch64.tar.gz (ARM64 cross-compiled)
#   - manifest.json (with Ed25519 signature)
#   - GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.1.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (Markdown)'
        required: false
        default: 'Navigation system update'
        type: string
      prerelease:
        description: 'Pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "notes=${{ inputs.release_notes }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "notes=Navigation system ${TAG} release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update VERSION file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "${VERSION#v}" > VERSION

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        run: |
          source /opt/ros/humble/setup.bash
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            libpcl-dev \
            libeigen3-dev \
            libopencv-dev \
            libgrpc++-dev \
            protobuf-compiler-grpc
          # Install signing dependency
          pip install cryptography

      - name: Sync versions
        run: bash scripts/sync_versions.sh

      - name: Build workspace
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run unit tests
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --return-code-on-test-failure
          colcon test-result --verbose

      - name: Package
        run: |
          bash scripts/ota/build_nav_package.sh --skip-build

      - name: Check artifact size
        run: |
          TARBALL=$(ls dist/navigation-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: No tarball found in dist/"
            exit 1
          fi
          SIZE_MB=$(du -m "$TARBALL" | awk '{print $1}')
          echo "Artifact: $TARBALL -- ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "ERROR: Artifact exceeds 500 MB limit (${SIZE_MB} MB). Check for accidentally packaged large files."
            exit 1
          fi
          echo "Artifact size OK (${SIZE_MB} MB <= 500 MB)"

      - name: Generate & sign manifest
        run: |
          # Write signing key (from GitHub Secret)
          if [ -n "${{ secrets.OTA_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.OTA_PRIVATE_KEY }}" > /tmp/ota_key.pem
            python3 scripts/ota/generate_manifest.py \
              --version ${{ steps.version.outputs.version }} \
              --artifacts-dir ./dist/ \
              --template scripts/ota/manifest_template.json \
              --signing-key /tmp/ota_key.pem \
              --key-id ota-signing-key-01 \
              --output ./dist/manifest.json
            rm -f /tmp/ota_key.pem
          else
            python3 scripts/ota/generate_manifest.py \
              --version ${{ steps.version.outputs.version }} \
              --artifacts-dir ./dist/ \
              --template scripts/ota/manifest_template.json \
              --output ./dist/manifest.json
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Navigation ${{ steps.version.outputs.version }}"
          body: |
            ${{ steps.version.outputs.notes }}

            ---

            **OTA Deploy:**
            1. MapPilot App -> Settings -> Cloud Update -> Check Updates
            2. Select the navigation package -> Download and Install

            **Manual Deploy:**
            ```bash
            ./scripts/ota/push_to_robot.sh sunrise@<robot_ip>
            ```
          files: dist/*
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to OTA Server
        env:
          OTA_SERVER_URL: ${{ secrets.OTA_SERVER_URL }}
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
        run: |
          if [ -z "${OTA_SERVER_URL}" ] || [ -z "${OTA_API_KEY}" ]; then
            echo "OTA_SERVER_URL or OTA_API_KEY not configured, skipping OTA server upload"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CLEAN="${VERSION#v}"
          NOTES="${{ steps.version.outputs.notes }}"

          # Find the packaged navigation tarball
          TARBALL=$(ls dist/navigation-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: No navigation tarball found in dist/"
            exit 1
          fi
          echo "Uploading: $TARBALL"

          # Step 1: Upload package (multipart/form-data)
          UPLOAD_RESP=$(curl -sf \
            -H "X-API-Key: ${OTA_API_KEY}" \
            -F "name=navigation" \
            -F "version=${VERSION_CLEAN}" \
            -F "changelog=${NOTES}" \
            -F "auto_sign=true" \
            -F "file=@${TARBALL}" \
            "${OTA_SERVER_URL}/packages/upload")

          PKG_ID=$(echo "$UPLOAD_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Package uploaded: id=${PKG_ID}"

          # Step 2: Create release (initial 10% canary rollout, LINGTU-NAV product policy)
          curl -sf \
            -H "X-API-Key: ${OTA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"${VERSION_CLEAN}\", \"channel\": \"stable\", \"package_ids\": [${PKG_ID}], \"rollout_percent\": 10, \"target_product\": \"LINGTU-NAV\"}" \
            "${OTA_SERVER_URL}/releases"

          echo "Release created in OTA server: ${VERSION_CLEAN} (10% rollout)"
