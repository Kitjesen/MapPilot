name: Navigation C++ portable tests

on:
  push:
    paths:
      - 'src/nav/cpp/**'
      - 'tests/nav/cpp/**'
      - 'tests/explore/cpp/**'
      - '.github/workflows/nav-core-tests.yml'
  pull_request:
    paths:
      - 'src/nav/cpp/**'
      - 'tests/nav/cpp/**'
      - 'tests/explore/cpp/**'
      - '.github/workflows/nav-core-tests.yml'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libeigen3-dev \
            libgtest-dev \
            liboctomap-dev

      - name: Configure portable native tests
        run: |
          cmake -S src/nav/cpp -B build/nav-cpp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLINGTU_NAV_CPP_BUILD_TESTS=ON \
            -DLINGTU_NAV_CPP_BUILD_ENDPOINT=OFF

      - name: Build
        run: cmake --build build/nav-cpp --parallel 4

      - name: Run tests
        run: ctest --test-dir build/nav-cpp --output-on-failure
