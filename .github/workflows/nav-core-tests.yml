name: Navigation C++ portable tests

on:
  push:
    paths:
      - 'src/nav/cpp/**'
      - 'src/kernels/nav/mls_core/**'
      - 'src/maps/**'
      - 'config/system/settings/**'
      - 'scripts/build/settings.py'
      - 'scripts/build/cmake/settings.cmake'
      - 'tests/nav/cpp/**'
      - 'tests/explore/cpp/**'
      - 'src/drivers/sim/mujoco/**'
      - 'tests/sim/test_mujoco_runtime.py'
      - 'config/acceptance/official_global_planner.json'
      - 'tools/bench/official_global_planner.py'
      - '.github/workflows/nav-core-tests.yml'
  pull_request:
    paths:
      - 'src/nav/cpp/**'
      - 'src/kernels/nav/mls_core/**'
      - 'src/maps/**'
      - 'config/system/settings/**'
      - 'scripts/build/settings.py'
      - 'scripts/build/cmake/settings.cmake'
      - 'tests/nav/cpp/**'
      - 'tests/explore/cpp/**'
      - 'src/drivers/sim/mujoco/**'
      - 'tests/sim/test_mujoco_runtime.py'
      - 'config/acceptance/official_global_planner.json'
      - 'tools/bench/official_global_planner.py'
      - '.github/workflows/nav-core-tests.yml'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: false

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3-yaml \
            libeigen3-dev \
            libgtest-dev \
            liboctomap-dev

      - name: Configure portable native tests
        run: |
          cmake -S src/nav/cpp -B build/nav-cpp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLINGTU_NAV_CPP_BUILD_TESTS=ON \
            -DLINGTU_NAV_CPP_BUILD_ENDPOINT=OFF

      - name: Build
        run: cmake --build build/nav-cpp --parallel 4

      - name: Run tests
        run: ctest --test-dir build/nav-cpp --output-on-failure

  global:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: false

      - name: Install global planner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake python3-yaml liboctomap-dev

      - name: Test Rust MLS
        run: cargo test --manifest-path src/kernels/nav/mls_core/Cargo.toml

      - name: Build global planner
        run: |
          cmake -S src/nav/cpp/planning/global/octoplanner -B build/global \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/global --parallel 4

      - name: Test global planner
        run: ctest --test-dir build/global --output-on-failure --parallel 2

      # Real public point clouds with pinned endpoints; synthetic smokes alone
      # missed the 2026-11-17 vertex-pivot regression.
      - name: Public-map global planner acceptance
        run: |
          python3 tools/bench/official_global_planner.py \
            --build-dir build/global --output-dir build/official-global --download

      - name: Upload global planner acceptance results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: official-global-planner
          path: build/official-global
