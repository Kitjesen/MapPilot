name: Navigation C++ portable tests

on:
  push:
    paths:
      - 'src/nav/cpp/**'
      - '.github/workflows/nav-core-tests.yml'
  pull_request:
    paths:
      - 'src/nav/cpp/**'
      - '.github/workflows/nav-core-tests.yml'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gcovr \
            libgtest-dev \
            liboctomap-dev

      - name: Configure portable native tests with coverage
        run: |
          cmake -S src/nav/cpp -B build/nav-cpp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage" \
            -DLINGTU_NAV_CPP_BUILD_TESTS=ON \
            -DLINGTU_NAV_CPP_BUILD_ENDPOINT=OFF \
            -DLINGTU_NAV_CPP_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build/nav-cpp --parallel 4

      - name: Run tests
        run: ctest --test-dir build/nav-cpp --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr --root src/nav/cpp \
            --filter 'src/nav/cpp/include/' \
            --filter 'src/nav/cpp/control/' \
            --filter 'src/nav/cpp/engine/' \
            --filter 'src/nav/cpp/planning/' \
            --exclude '.*test.*' \
            --print-summary \
            --xml build/nav-cpp/coverage.xml
          # Extract line coverage percentage for summary
          LINE_COV=$(gcovr --root src/nav/cpp \
            --filter 'src/nav/cpp/include/' \
            --filter 'src/nav/cpp/control/' \
            --filter 'src/nav/cpp/engine/' \
            --filter 'src/nav/cpp/planning/' \
            --exclude '.*test.*' \
            --print-summary 2>&1 | grep 'lines:' | awk '{print $2}')
          echo "### Navigation C++ Test Coverage: ${LINE_COV}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: nav-core-coverage
          path: build/nav-cpp/coverage.xml
          retention-days: 14
