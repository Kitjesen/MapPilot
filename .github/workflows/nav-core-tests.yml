name: nav-kernel standalone tests

on:
  push:
    paths:
      - 'src/nav/kernel/**'
  pull_request:
    paths:
      - 'src/nav/kernel/**'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Configure (standalone mode, no ROS2, with coverage)
        run: cmake -B src/nav/kernel/build -S src/nav/kernel -DSTANDALONE=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage"

      - name: Build
        run: cmake --build src/nav/kernel/build --parallel 4

      - name: Run tests
        run: ctest --test-dir src/nav/kernel/build --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr --root src/nav/kernel \
            --filter 'src/nav/kernel/include/' \
            --filter 'src/nav/kernel/src/' \
            --exclude '.*test.*' \
            --print-summary \
            --xml src/nav/kernel/build/coverage.xml
          # Extract line coverage percentage for summary
          LINE_COV=$(gcovr --root src/nav/kernel \
            --filter 'src/nav/kernel/include/' \
            --filter 'src/nav/kernel/src/' \
            --exclude '.*test.*' \
            --print-summary 2>&1 | grep 'lines:' | awk '{print $2}')
          echo "### nav-kernel Test Coverage: ${LINE_COV}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: nav-core-coverage
          path: src/nav/kernel/build/coverage.xml
          retention-days: 14
