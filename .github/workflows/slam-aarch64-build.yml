name: Native SLAM aarch64 Build Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/localization/slam/**'
      - 'src/localization/fastlio2/src/**'
      - 'src/localization/localizer/**'
      - 'src/maps/include/**'
      - 'src/message/**'
      - 'third_party/3d_bbs/**'
      - 'third_party/research_localization/small_gicp/include/**'
      - 'scripts/build/build_slam_core.sh'
      - '.github/workflows/slam-aarch64-build.yml'
  push:
    branches: [main]
    paths:
      - 'src/localization/slam/**'
      - 'src/localization/fastlio2/src/**'
      - 'src/localization/localizer/**'
      - 'src/maps/include/**'
      - 'src/message/**'
      - 'third_party/3d_bbs/**'
      - 'third_party/research_localization/small_gicp/include/**'
      - 'scripts/build/build_slam_core.sh'
      - '.github/workflows/slam-aarch64-build.yml'
  workflow_dispatch:

concurrency:
  group: native-slam-aarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-slam-aarch64:
    name: Native Fast-LIO2 and CycloneDDS runtime
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 40
    env:
      CMAKE_BUILD_TYPE: Release
      LINGTU_BUILD_JOBS: '4'
      LINGTU_SLAM_BUILD_TESTS: 'ON'
      LINGTU_SLAM_BUILD_DDS_RUNTIME: 'ON'
      LINGTU_SLAM_FASTLIO2: 'ON'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify native aarch64 runner
        run: |
          test "$(dpkg --print-architecture)" = "arm64"
          test "$(uname -m)" = "aarch64"

      - name: Install native SLAM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            cmake \
            cyclonedds-dev \
            cyclonedds-tools \
            libeigen3-dev \
            libpcl-dev \
            libyaml-cpp-dev \
            ninja-build \
            pkg-config

      - name: Build and test native SLAM runtime
        run: |
          set -o pipefail
          bash scripts/build/build_slam_core.sh 2>&1 | tee /tmp/native-slam-build.log

      - name: Surface native compile errors
        if: failure()
        run: |
          {
            echo "## Native SLAM build failure"
            echo '```text'
            grep -E "error:|undefined reference|fatal error|No such file" \
              /tmp/native-slam-build.log | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native SLAM runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lingtu-slam-aarch64-native-build
          path: |
            build/slam_core/slamd
            build/slam_core/slamctl
            build/slam_core/test_slam_contract
          retention-days: 7
          if-no-files-found: error
