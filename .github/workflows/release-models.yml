name: Release Models & Firmware

# Manual trigger — publish trained models, maps, configs, firmware to GitHub Release
# The "cloud update" feature in the mobile App pulls latest assets from here

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. models-v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: true
        default: 'Model & Firmware Release'
        type: string
      release_notes:
        description: 'Release notes (Markdown supported)'
        required: false
        default: 'Model/firmware update package. Deployable to robot via MapPilot App "Cloud Update".'
        type: string
      models_path:
        description: 'Models glob pattern (e.g. models/*.pt models/*.onnx)'
        required: false
        default: ''
        type: string
      configs_path:
        description: 'Config files glob pattern (e.g. configs/*.yaml)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
  # Also triggered by tag push (e.g., pushing models-v1.0.0 tag)
  push:
    tags:
      - 'models-*'
      - 'firmware-*'
      - 'release-*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Fetch model files stored with Git LFS

      - name: Collect release assets
        id: collect
        run: |
          mkdir -p release_assets

          # Collect model files (if specified)
          if [ -n "${{ inputs.models_path }}" ]; then
            for pattern in ${{ inputs.models_path }}; do
              cp -v $pattern release_assets/ 2>/dev/null || true
            done
          fi

          # Collect config files (if specified)
          if [ -n "${{ inputs.configs_path }}" ]; then
            for pattern in ${{ inputs.configs_path }}; do
              cp -v $pattern release_assets/ 2>/dev/null || true
            done
          fi

          # For tag-triggered releases, auto-collect common model/config files
          if [ "${{ github.event_name }}" = "push" ]; then
            # Collect model files with common extensions
            find . -maxdepth 3 \( \
              -name "*.pt" -o -name "*.pth" -o -name "*.onnx" \
              -o -name "*.tflite" -o -name "*.engine" \
            \) -exec cp -v {} release_assets/ \; 2>/dev/null || true
          fi

          # List collected assets
          echo "=== Collected Assets ==="
          ls -la release_assets/ || echo "No assets found"

          # Check if any files were collected
          ASSET_COUNT=$(find release_assets/ -type f | wc -l)
          echo "asset_count=$ASSET_COUNT" >> "$GITHUB_OUTPUT"

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.release_name }}" >> "$GITHUB_OUTPUT"
            echo "notes=${{ inputs.release_notes }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
            echo "notes=Auto release — deployable via MapPilot App cloud update." >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            ${{ steps.tag.outputs.notes }}

            ---

            **Deploy to robot via MapPilot App:**
            1. Open MapPilot App -> Settings -> Cloud Update
            2. Tap "Check for Updates"
            3. Select the file, tap the cloud button to download and deploy

            **Manual deploy:**
            ```bash
            # Copy the file to the robot
            scp <asset_file> sunrise@<robot_ip>:/home/sunrise/models/
            ```
          files: release_assets/*
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
