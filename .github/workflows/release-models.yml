name: Release Models & Runtime Assets

# Publish explicitly selected models and runtime assets to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. models-v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: true
        default: 'Model & Firmware Release'
        type: string
      release_notes:
        description: 'Release notes (Markdown supported)'
        required: false
        default: 'Model and runtime asset update.'
        type: string
      models_path:
        description: 'Model glob (for example sim/packages/controllers/doso/thunder_v4/locomotion/policy/*.onnx)'
        required: false
        default: ''
        type: string
      configs_path:
        description: 'Config glob (for example config/robots/doso/thunder_v4/*.yaml)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
  # Also triggered by tag push (e.g., pushing models-v1.0.0 tag)
  push:
    tags:
      - 'models-*'
      - 'firmware-*'
      - 'release-*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true  # Fetch model files stored with Git LFS

      - name: Collect release assets
        id: collect
        run: |
          mkdir -p release_assets

          # Collect model files (if specified)
          if [ -n "${{ inputs.models_path }}" ]; then
            for pattern in ${{ inputs.models_path }}; do
              cp -v $pattern release_assets/ 2>/dev/null || true
            done
          fi

          # Collect config files (if specified)
          if [ -n "${{ inputs.configs_path }}" ]; then
            for pattern in ${{ inputs.configs_path }}; do
              cp -v $pattern release_assets/ 2>/dev/null || true
            done
          fi

          # For tag-triggered releases, collect tracked model assets at any depth.
          if [ "${{ github.event_name }}" = "push" ]; then
            find . -path './research' -prune -o -type f \( \
              -name "*.pt" -o -name "*.pth" -o -name "*.onnx" \
              -o -name "*.tflite" -o -name "*.engine" \
            \) -exec cp -v {} release_assets/ \;
          fi

          # List collected assets
          echo "=== Collected Assets ==="
          ls -la release_assets/ || echo "No assets found"

          # Check if any files were collected
          ASSET_COUNT=$(find release_assets/ -type f | wc -l)
          echo "asset_count=$ASSET_COUNT" >> "$GITHUB_OUTPUT"
          test "$ASSET_COUNT" -gt 0

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.release_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$REQUESTED_NOTES" > release_notes.md
          else
            printf '%s\n' 'Automated model and runtime asset release.' > release_notes.md
          fi
          cat >> release_notes.md <<'EOF'

          ---

          Download the required asset and install it at the path declared by the
          target robot's configuration. Activate it through ProductControl rather
          than replacing an asset used by a running Product.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release_notes.md
          files: release_assets/*
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
