name: Native motion build and tests

on:
  pull_request:
    paths:
      - 'src/drivers/real/motion/**'
      - 'tests/drivers/real/motion/**'
      - 'tests/drivers/test_real_motion_driver_contract.py'
      - 'tests/explore/cpp/**'
      - 'tests/maps/cpp/**'
      - 'tests/nav/cpp/**'
      - 'src/nav/cpp/**'
      - 'src/nav/inspection/**'
      - 'src/maps/**'
      - 'src/message/**'
      - 'scripts/build/build_driver.sh'
      - 'scripts/build/build_dds_probe.sh'
      - 'scripts/build/build_nav_endpoint.sh'
      - '.github/workflows/native-motion-build.yml'
  push:
    branches: [main]
    paths:
      - 'src/drivers/real/motion/**'
      - 'tests/drivers/real/motion/**'
      - 'tests/drivers/test_real_motion_driver_contract.py'
      - 'tests/explore/cpp/**'
      - 'tests/maps/cpp/**'
      - 'tests/nav/cpp/**'
      - 'src/nav/cpp/**'
      - 'src/nav/inspection/**'
      - 'src/maps/**'
      - 'src/message/**'
      - 'scripts/build/build_driver.sh'
      - 'scripts/build/build_dds_probe.sh'
      - 'scripts/build/build_nav_endpoint.sh'
      - '.github/workflows/native-motion-build.yml'
  workflow_dispatch:

concurrency:
  group: native-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Driver and navigation CTest
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      LINGTU_BUILD_JOBS: '4'
      LINGTU_DRIVER_BACKEND: doso
      LINGTU_DRIVER_RUN_TESTS: '1'
      LINGTU_NAV_ENDPOINT_RUN_TESTS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: false

      - name: Checkout DOSO SDK
        uses: actions/checkout@v4
        with:
          repository: Kitjesen/DOSO-SDK
          ref: 0ae4969c9b6e9e026b14d6129aff10bd842a1241
          path: build/deps/doso-sdk

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            cyclonedds-dev \
            cyclonedds-tools \
            libeigen3-dev \
            libgrpc++-dev \
            libgtest-dev \
            liboctomap-dev \
            libprotobuf-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Build and install DOSO SDK
        run: |
          sdk_prefix="${RUNNER_TEMP}/doso-sdk"
          cmake -S build/deps/doso-sdk -B build/deps/doso-sdk-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build/deps/doso-sdk-build --parallel "${LINGTU_BUILD_JOBS}"
          cmake --install build/deps/doso-sdk-build --prefix "${sdk_prefix}"
          echo "LINGTU_BRAINSTEM_CLIENT_PREFIX=${sdk_prefix}" >> "${GITHUB_ENV}"

      - name: Build and test native hardware driver
        run: bash scripts/build/build_driver.sh

      - name: Build native DDS diagnostics probe
        run: bash scripts/build/build_dds_probe.sh

      - name: Build and test native navigation endpoint
        run: bash scripts/build/build_nav_endpoint.sh

      - name: Verify native navigation runtime install
        run: |
          install_root="$(mktemp -d)"
          trap 'rm -rf -- "$install_root"' EXIT
          cmake --install build/nav_endpoint --prefix "$install_root"

          for executable in \
            bin/navd \
            bin/lingtu_traversability_dds \
            bin/lingtu_explore_dds \
            bin/lingtu_nav_control \
            bin/octoplanner3d_pcd_to_octomap; do
            test -x "$install_root/$executable"
          done
          for library in \
            lib/liblingtu_nav_client.so \
            lib/liblingtu_inspection_evidence_bridge.so \
            lib/liblingtu_inspection.so; do
            test -f "$install_root/$library"
          done
          for robot in go2 thunder; do
            for asset in \
              paths.ply \
              pathList.ply \
              startPaths.ply \
              search_radius.txt \
              correspondences.txt; do
              test -f "$install_root/share/lingtu/cmu_paths/$robot/$asset"
            done
          done

          test -z "$(find "$install_root" -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.a' -o -name 'libnav_far.*' \) -print -quit)"
          diff -u \
            <(printf '%s\n' \
              bin/navd \
              bin/lingtu_traversability_dds \
              bin/lingtu_explore_dds \
              bin/lingtu_nav_control \
              bin/octoplanner3d_pcd_to_octomap \
              lib/liblingtu_nav_client.so \
              lib/liblingtu_inspection_evidence_bridge.so \
              lib/liblingtu_inspection.so \
              share/lingtu/cmu_paths/go2/paths.ply \
              share/lingtu/cmu_paths/go2/pathList.ply \
              share/lingtu/cmu_paths/go2/startPaths.ply \
              share/lingtu/cmu_paths/go2/search_radius.txt \
              share/lingtu/cmu_paths/go2/correspondences.txt \
              share/lingtu/cmu_paths/thunder/paths.ply \
              share/lingtu/cmu_paths/thunder/pathList.ply \
              share/lingtu/cmu_paths/thunder/startPaths.ply \
              share/lingtu/cmu_paths/thunder/search_radius.txt \
              share/lingtu/cmu_paths/thunder/correspondences.txt | sort) \
            <(find "$install_root" -type f -printf '%P\n' | sort)
