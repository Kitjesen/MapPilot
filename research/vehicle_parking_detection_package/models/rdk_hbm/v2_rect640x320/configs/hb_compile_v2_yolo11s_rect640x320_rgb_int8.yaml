model_parameters:
  onnx_model: "../model/best_rect640x320.onnx"
  march: "nash-m"
  output_model_file_prefix: "patrol_v2_yolo11s_static_640x320_rect_rgb_int8"
  working_dir: "../model_output_rect640x320_rgb_int8"

input_parameters:
  input_name: "images"
  input_type_train: "rgb"
  input_layout_train: "NCHW"
  input_shape: "1x3x640x320"
  input_batch: 1
  mean_value: "0 0 0"
  scale_value: "0.00392156862745098 0.00392156862745098 0.00392156862745098"
  input_type_rt: "rgb"

calibration_parameters:
  cal_data_dir: "../calibration_npy/rgb_float32_nchw_640x320"
  calibration_type: "default"

compiler_parameters:
  compile_mode: "latency"
  core_num: 1
  optimize_level: "O2"
  jobs: 8
  input_source: {"images": "ddr"}
  cache_mode: "disable"
  max_l2m_size: 0
