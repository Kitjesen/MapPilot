[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingtu-sdk"
version = "2.3.0"
description = "LingTu robot SDK — clean Python client"
requires-python = ">=3.10"
dependencies = []  # stdlib-only for sync; aiohttp optional

[project.optional-dependencies]
async = ["aiohttp>=3.8"]

[project.scripts]
lingtu = "lingtu_sdk.cli:main"
