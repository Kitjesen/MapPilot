# LingTu native local Host runtime.
# Field Products remain owned by ProductControl and the robot-side scripts/lingtu
# adapter; this compose service intentionally starts only the local stub profile.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f nav-stack
#   docker compose run --rm nav-stack python3 lingtu.py sim_nav

services:
  nav-stack:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: lingtu:${LINGTU_VERSION:-latest}
    container_name: lingtu-stack
    hostname: lingtu-stack

    ports:
      - "5050:5050"
      - "8090:8090"

    environment:
      NAV_MAP_DIR: /opt/lingtu/maps

    command: ["python3", "lingtu.py", "stub"]

    volumes:
      - nav-logs:/opt/robot/logs
      - nav-flight-records:/opt/robot/flight_records
      - nav-ota:/opt/robot/ota
      - nav-recordings:/opt/robot/recordings
      - ${HOST_MAP_DIR:-./maps}:/opt/lingtu/maps

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  nav-logs:
    driver: local
  nav-flight-records:
    driver: local
  nav-ota:
    driver: local
  nav-recordings:
    driver: local
