# LingTu native development overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up dev

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: lingtu-dev:latest
    container_name: lingtu-dev
    hostname: lingtu-dev

    network_mode: host

    cap_add:
      - NET_ADMIN
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    environment:
      LINGTU_DDS_DOMAIN_ID: ${LINGTU_DDS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///ws/config/cyclonedds.xml}
      CMAKE_BUILD_TYPE: ${CMAKE_BUILD_TYPE:-RelWithDebInfo}

    volumes:
      - .:/ws:cached
      - nav-ccache:/ws/.ccache
      - nav-build:/ws/build
      - nav-logs:/opt/robot/logs
      - nav-flight-records:/opt/robot/flight_records
      - ${HOST_MAP_DIR:-./maps}:/ws/maps

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0

    stdin_open: true
    tty: true
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 16G

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  build-only:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    image: lingtu-build:latest
    container_name: lingtu-build
    working_dir: /ws
    volumes:
      - .:/ws:cached
      - nav-build:/ws/build
    command: ["make", "build", "PYTHON=python3"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    image: lingtu-test:latest
    container_name: lingtu-test
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  nav-ccache:
    driver: local
  nav-build:
    driver: local
  nav-logs:
    driver: local
  nav-flight-records:
    driver: local
