schema: lingtu.sim.robot-package.v1
id: thunderv4
version: 1.0.0
kind: robot
description: Standard Thunder V4 quadruped simulation package.
compatibility:
  runtime_abi: lingtu.sim.robot.v1
  mujoco: 3.10.x
physics:
  mjcf: mjcf/thunderv4.xml
  attach_root: base_link
  root_joint: floating_base_joint
visual:
  binding: RobotVisual:ThunderV4
frames:
  - name: base_link
    role: body
  - name: imu
    role: sensor_mount
  - name: front_camera
    role: sensor_mount
  - name: lidar1_link
    role: sensor_mount
  - name: camera1_link
    role: sensor_mount
  - name: lidar2_link
    role: sensor_mount
  - name: camera2_link
    role: sensor_mount
interfaces:
  state:
    - lingtu.sim.base-state.v1
    - lingtu.sim.joint-state.v1
  command:
    - lingtu.sim.joint-torque.v1
defaults:
  controller: thunderv4_locomotion@1.0.0
  sensor_rig: thunderv4_navigation@1.0.0
declared_capabilities:
  locomotion:
    - stand
    - walk
  sensor_mounts:
    - front_camera
    - lidar1_link
