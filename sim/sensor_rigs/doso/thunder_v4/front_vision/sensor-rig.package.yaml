schema: lingtu.sim.sensor-rig-package.v1
id: thunderv4_front_vision
version: 1.0.0
kind: sensor_rig
description: Front RGB and metric-depth capture preset for Thunder V4.
sensors:
  - id: front_rgb
    package: rgb_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: visual, source: unreal_camera}
    frequency_hz: 30
    extrinsic:
      position_m: [0.423358800364963, -0.000496202974186816, 0.11370714960317]
      quaternion_wxyz: [0.5, -0.5, 0.5, -0.5]
    configuration:
      width: 640
      height: 480
  - id: front_depth
    package: depth_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: visual, source: unreal_camera}
    frequency_hz: 30
    extrinsic:
      position_m: [0.423358800364963, -0.000496202974186816, 0.11370714960317]
      quaternion_wxyz: [0.5, -0.5, 0.5, -0.5]
    configuration:
      width: 640
      height: 480
