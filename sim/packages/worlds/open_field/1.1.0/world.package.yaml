schema: lingtu.sim.world-package.v1
id: open_field
version: 1.1.0
kind: world
description: Open field with a 1 ms physics timebase for exact navigation sensor sampling.
physics:
  mjcf: physics/open_field.xml
  global_policy:
    timestep_s: 0.001
    integrator: rk4
    solver: newton
    iterations: 100
    gravity_mps2: [0.0, 0.0, -9.81]
visual:
  binding: WorldVisual:OpenField
  level: /Game/RobotSim/Maps/ThunderV4_RuntimePreview
entities: []
