schema: lingtu.sim.world-package.v1
id: open_field_hf
version: 1.1.0
kind: world
description: OpenField heightfield with a 1 ms timebase for exact navigation sensor sampling.
physics:
  mjcf: physics/open_field_hf.xml
  global_policy:
    timestep_s: 0.001
    integrator: rk4
    solver: newton
    iterations: 100
    gravity_mps2: [0.0, 0.0, -9.81]
visual:
  binding: WorldVisual:OpenFieldHF
  level: /Game/RobotSim/Maps/OpenFieldRuntime
entities: []
