schema: lingtu.sim.world-package.v1
id: open_field_hf
version: 1.0.0
kind: world
description: Deterministic same-source outdoor terrain foundation for MuJoCo and Unreal.
physics:
  mjcf: physics/open_field_hf.xml
  global_policy:
    timestep_s: 0.002
    integrator: rk4
    solver: newton
    iterations: 100
    gravity_mps2: [0.0, 0.0, -9.81]
visual:
  binding: WorldVisual:OpenFieldHF
  level: /Game/RobotSim/Maps/OpenFieldRuntime
entities: []
