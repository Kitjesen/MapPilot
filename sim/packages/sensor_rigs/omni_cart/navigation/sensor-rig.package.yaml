schema: lingtu.sim.sensor-rig-package.v1
id: omni_cart_navigation
version: 1.0.0
kind: sensor_rig
description: Navigation sensor arrangement for OmniCart.
sensors:
  - id: imu
    package: imu@1.0.0
    parent_frame: imu
    runtime: {owner: physics, source: mujoco_sensor}
    frequency_hz: 200
  - id: mid360
    package: mid360@1.0.0
    parent_frame: lidar_link
    runtime: {owner: physics, source: mujoco_livox_model}
    frequency_hz: 10
    configuration:
      raycast_frame: lidar_link
  - id: front_rgb
    package: rgb_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: sensor_runtime, source: mujoco_camera}
    frequency_hz: 30
    configuration:
      width: 640
      height: 480
  - id: front_depth
    package: depth_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: sensor_runtime, source: mujoco_camera}
    frequency_hz: 30
    configuration:
      width: 640
      height: 480
  - id: truth_odom
    package: truth_odom@1.0.0
    parent_frame: base_link
    runtime: {owner: physics, source: mujoco_truth}
    frequency_hz: 100
