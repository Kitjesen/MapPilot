schema: lingtu.sim.sensor-rig-package.v1
id: thunderv4_headless_multimodal
version: 1.0.0
kind: sensor_rig
description: Experimental opt-in headless navigation plus thermal, semantic and mono acoustic measurements; requires explicit World properties, not Fab qualification.
sensors:
  - id: imu
    package: imu@1.0.0
    parent_frame: imu
    runtime: {owner: physics, source: mujoco_sensor}
    frequency_hz: 200
  - id: mid360
    package: mid360@1.0.0
    parent_frame: lidar1_link
    runtime: {owner: physics, source: mujoco_livox_model}
    frequency_hz: 10
    configuration:
      raycast_frame: lidar1_link_site
      navigation_fixture_raw_overlay: true
  - id: front_rgb
    package: rgb_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: sensor_runtime, source: mujoco_camera}
    # Full factory RGB-D rendering exceeds 500 ms under load; leave physics/LiDAR independent.
    frequency_hz: 1
    extrinsic:
      position_m: [0.423358800364963, -0.000496202974186816, 0.11370714960317]
      quaternion_wxyz: [0.5, -0.5, 0.5, -0.5]
    configuration:
      width: 640
      height: 480
  - id: front_depth
    package: depth_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: sensor_runtime, source: mujoco_camera}
    frequency_hz: 1
    extrinsic:
      position_m: [0.423358800364963, -0.000496202974186816, 0.11370714960317]
      quaternion_wxyz: [0.5, -0.5, 0.5, -0.5]
    configuration:
      width: 640
      height: 480
      encoding: 16UC1
  - id: truth_odom
    package: truth_odom@1.0.0
    parent_frame: base_link
    runtime: {owner: physics, source: mujoco_truth}
    frequency_hz: 100
  - id: front_thermal
    package: thermal_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: physics, source: mujoco_measurement}
    frequency_hz: 10
    # Catalog replaces the frame extrinsic; optical +Z forward, +Y down (not MJ camera axes).
    extrinsic:
      position_m: [0.423358800364963, -0.000496202974186816, 0.11370714960317]
      quaternion_wxyz: [0.5, -0.5, 0.5, -0.5]
  - id: front_semantic
    package: semantic_camera@1.0.0
    parent_frame: front_camera
    runtime: {owner: physics, source: mujoco_measurement}
    frequency_hz: 10
    extrinsic:
      position_m: [0.423358800364963, -0.000496202974186816, 0.11370714960317]
      quaternion_wxyz: [0.5, -0.5, 0.5, -0.5]
  - id: microphone
    package: microphone@1.0.0
    parent_frame: payload_top
    runtime: {owner: physics, source: mujoco_measurement}
    frequency_hz: 100
