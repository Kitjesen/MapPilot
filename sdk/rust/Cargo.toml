[package]
name = "lingtu-sdk"
version = "2.3.0"
edition = "2021"
description = "Blocking external client for the LingTu Gateway HTTP, SSE and WebSocket APIs"
license = "LicenseRef-Proprietary"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.154"
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
